<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mediko Gateway</title>
  <link rel="icon" type="image/png" href="/admin-dashboard/favicon.png" />
  <!-- Public app client ID (shopify.app.toml). App Bridge uses it to issue the
       session tokens it attaches to every fetch() to this domain. -->
  <meta name="shopify-api-key" content="ee63d07f77aeb73c3ade6dd713eb40f7" />
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
  <style>
    /* Layout glue only; Polaris owns the look. */
    body { margin: 0; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    /* Table text columns: capped so phone, date and status keep room. */
    .cell-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-width: 14rem; max-width: 26rem; }
    .nowrap { white-space: nowrap; }
    .cell-one { display: block; max-width: 22rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prewrap { white-space: pre-wrap; overflow-wrap: anywhere; }
    /* In-page title (the admin title bar also shows it). */
    .page-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .page-title h1 { margin: 0; font: 650 1.25rem/1.75rem -apple-system, BlinkMacSystemFont, "San Francisco", "Segoe UI", Roboto, "Helvetica Neue", sans-serif; color: #303030; overflow-wrap: anywhere; }
    /* Chats: three panes (list | thread | details); one pane at a time below 768px. */
    .chat-grid { display: grid; grid-template-columns: 32% 1fr 24%; height: 600px; }
    .chat-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .chat-pane + .chat-pane { border-left: 1px solid #e3e3e3; }
    .chat-bar { border-bottom: 1px solid #e3e3e3; }
    .chat-bar-top { border-top: 1px solid #e3e3e3; }
    .chat-scroll { flex: 1; min-height: 0; overflow-y: auto; }
    .chat-row { border-bottom: 1px solid #f1f1f1; }
    .chat-msgs { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
    .chat-msg { max-width: 72%; }
    .chat-pv-img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; flex: none; display: block; }
    .chat-pv-text { min-width: 0; }
    .chat-pv-text .cell-one { max-width: 100%; }
    .chat-msg.from-user { align-self: flex-start; }
    .chat-msg.from-agent { align-self: flex-end; }
    .chat-mobile { display: none; }
    @media (max-width: 767px) {
      .chat-grid { grid-template-columns: 1fr; height: 560px; }
      .chat-pane + .chat-pane { border-left: 0; }
      .chat-grid[data-view="list"] > :not(.chat-list),
      .chat-grid[data-view="thread"] > :not(.chat-thread),
      .chat-grid[data-view="details"] > :not(.chat-details) { display: none; }
      .chat-mobile { display: inline-block; }
    }
  </style>
</head>
<body>
  <s-app-nav>
    <s-link href="/admin-dashboard/" rel="home">Home</s-link>
    <s-link href="/admin-dashboard/chats">Chats</s-link>
    <s-link href="/admin-dashboard/applications">Senior/PWD</s-link>
    <s-link href="/admin-dashboard/requests/returns">Returns</s-link>
    <s-link href="/admin-dashboard/requests/messages">Messages</s-link>
    <s-link href="/admin-dashboard/blasts">Email/SMS Blasts</s-link>
    <s-link href="/admin-dashboard/shipping-sms">Shipping SMS</s-link>
    <s-link href="/admin-dashboard/templates">Templates</s-link>
    <s-link href="/admin-dashboard/settings">Settings</s-link>
  </s-app-nav>

  <div id="app"></div>

  <script src="/admin-dashboard/chat-connection.js"></script>
  <script src="/admin-dashboard/chat-orders.js"></script>
  <script>
  'use strict';

  // ── Basics ─────────────────────────────────────────────────────────────────
  const BASE = '/admin-dashboard';
  const $app = document.getElementById('app');
  const inAdmin = window.top !== window.self && typeof window.shopify !== 'undefined';

  function esc(v) {
    return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  const byId = (id) => document.getElementById(id);
  function on(id, ev, fn) { const el = byId(id); if (el) el.addEventListener(ev, fn); return el; }
  function onAll(sel, ev, fn) { document.querySelectorAll(sel).forEach((el) => el.addEventListener(ev, fn)); }

  function toast(msg, isError = false) {
    if (window.shopify?.toast) shopify.toast.show(msg, { isError });
  }
  function loading(v) { try { window.shopify?.loading(v); } catch { /* outside admin */ } }
  function showModal(id) { const m = byId(id); if (m?.showOverlay) m.showOverlay(); else window.shopify?.modal?.show(id); }
  function hideModal(id) { const m = byId(id); if (m?.hideOverlay) m.hideOverlay(); else window.shopify?.modal?.hide(id); }
  function go(path) { window.location.assign(BASE + path); }

  // App Bridge adds a fresh Shopify session token to every same-origin fetch,
  // and the gateway verifies it, so no token handling here.
  async function api(path, { method = 'GET', body } = {}) {
    const res = await fetch(path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const text = await res.text();
    let json = null;
    try { json = text ? JSON.parse(text) : {}; } catch { /* non-JSON */ }
    if (!res.ok) {
      const msg = json?.error || `Server error ${res.status}`;
      const err = new Error(msg); err.status = res.status; throw err;
    }
    return json ?? {};
  }

  // ── Chat service client ────────────────────────────────────────────────────
  // The gateway mints a short-lived agent token; the chat service is called
  // directly at the apiUrl it returns. The Bearer token is only ever sent there.
  const chatClient = (() => {
    let cached = null; // { token, apiUrl, exp }
    async function token(force = false) {
      if (!force && cached && Date.now() < cached.exp - 30000) return { token: cached.token, apiUrl: cached.apiUrl };
      const r = await api('/api/chat/agent-token', { method: 'POST' });
      const exp = Date.parse(r.expiresAt);
      cached = { token: r.token, apiUrl: String(r.apiUrl || '').replace(/\/+$/, ''), exp: Number.isFinite(exp) ? exp : 0 };
      return { token: cached.token, apiUrl: cached.apiUrl };
    }
    async function call(path, { method, body }, force) {
      if (typeof path !== 'string' || path[0] !== '/') throw new Error('Invalid chat path');
      const { token: t, apiUrl } = await token(force);
      const headers = { Authorization: `Bearer ${t}` };
      if (body) headers['Content-Type'] = 'application/json';
      return fetch(apiUrl + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    }
    async function chatApi(path, { method = 'GET', body } = {}) {
      let res = await call(path, { method, body }, false);
      if (res.status === 401) res = await call(path, { method, body }, true);
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : {}; } catch { /* non-JSON */ }
      if (!res.ok) {
        const err = new Error(json?.error || json?.message || `Chat service error ${res.status}`);
        err.status = res.status; throw err;
      }
      return json ?? {};
    }
    return { token, api: chatApi };
  })();

  const fmtDate = (ts) => ts
    ? new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })
    : '—';
  // Compact date for tables: "Nov 9, 4:55 AM" this year, "Nov 9, 2025" otherwise.
  function fmtShort(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return d.getFullYear() === new Date().getFullYear()
      ? d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  const phoneCell = (p) => `<span class="nowrap">${esc(fmtPhone(p))}</span>`;
  const dateCell = (ts) => `<span class="nowrap" title="${esc(fmtDate(ts))}">${esc(fmtShort(ts))}</span>`;
  const fmtDay = (d) => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
  function fmtPhone(p) {
    let d = String(p || '').replace(/\D/g, '');
    if (d.startsWith('63') && d.length === 12) d = '0' + d.slice(2);
    return d.length === 11 ? `${d.slice(0, 4)} ${d.slice(4, 7)} ${d.slice(7)}` : (p || '—');
  }
  const num = (n) => Number(n || 0).toLocaleString('en-US');
  const plural = (n, one, many = one + 's') => `${num(n)} ${n === 1 ? one : many}`;

  // One status → tone mapping everywhere.
  const TONES = {
    pending: 'caution', approved: 'success', resolved: 'success', sent: 'success', completed: 'success',
    rejected: 'critical', failed: 'critical', skipped: 'neutral', cancelled: 'neutral',
    queued: 'info', sending: 'info', interrupted: 'warning',
  };
  const cap = (s) => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1);
  const badge = (status, slot = '') => `<s-badge tone="${TONES[status] || 'neutral'}"${slot ? ` slot="${slot}"` : ''}>${esc(cap(status || 'pending'))}</s-badge>`;

  const qs = () => new URLSearchParams(location.search);
  function withQuery(path, params) {
    const p = new URLSearchParams();
    Object.entries(params).forEach(([k, v]) => { if (v !== '' && v != null && v !== 'all') p.set(k, v); });
    const s = p.toString();
    return s ? `${path}?${s}` : path;
  }
  const photoUrls = (csv) => String(csv || '').split(',').map((p) => p.trim()).filter(Boolean)
    .map((p) => `/view-uploads/${encodeURIComponent(p.split(/[\\/]/).pop())}`);

  // Page title shown at the top of every page; `html` must already be escaped.
  const pageTitle = (html, extra = '') => `<div class="page-title"><h1>${html}</h1>${extra}</div>`;

  function errorSection(msg, retryId = 'retry-load') {
    return `<s-section>
      <s-banner tone="critical" heading="Couldn't load this page">
        ${esc(msg)}
        <s-button slot="secondary-actions" id="${retryId}">Try again</s-button>
      </s-banner></s-section>`;
  }
  function emptyState(heading, text, actionHtml = '') {
    return `<s-section><s-stack gap="base" alignItems="center" padding="large-200">
      <s-heading>${esc(heading)}</s-heading>
      <s-paragraph color="subdued">${esc(text)}</s-paragraph>
      ${actionHtml}
    </s-stack></s-section>`;
  }
  function renderError(page, err) {
    $app.innerHTML = `<s-page heading="${esc(page)}"><s-stack gap="base">${pageTitle(esc(page))}${errorSection(err.message)}</s-stack></s-page>`;
    on('retry-load', 'click', () => location.reload());
  }

  // Index-table filter bar + pagination, shared by the list pages.
  // Items per page: remembered per table in this browser (best effort).
  const PER_PAGE_OPTIONS = [10, 20, 50, 100];
  function perPage(table, fromUrl) {
    const n = parseInt(fromUrl, 10);
    if (PER_PAGE_OPTIONS.includes(n)) { try { localStorage.setItem(`per:${table}`, String(n)); } catch { /* storage off */ } return n; }
    try { const saved = parseInt(localStorage.getItem(`per:${table}`), 10); if (PER_PAGE_OPTIONS.includes(saved)) return saved; } catch { /* storage off */ }
    return 20;
  }

  function filterBar({ searchLabel, search, from, to, per }, slotted = true) {
    return `<s-grid ${slotted ? 'slot="filters"' : ''} gap="small-200" gridTemplateColumns="repeat(auto-fit, minmax(11rem, 1fr))" alignItems="end">
      ${per ? `<s-select id="f-per" label="Per page">${PER_PAGE_OPTIONS.map((n) => `<s-option value="${n}" ${n === Number(per) ? 'selected' : ''}>${n}</s-option>`).join('')}</s-select>` : ''}
      <s-search-field id="f-search" label="Search" labelAccessibilityVisibility="exclusive" placeholder="${esc(searchLabel)}" value="${esc(search)}"></s-search-field>
      <s-date-field id="f-from" label="From" value="${esc(from)}"></s-date-field>
      <s-date-field id="f-to" label="To" value="${esc(to)}"></s-date-field>
    </s-grid>`;
  }
  function wireFilters(path, state) {
    const apply = (patch) => go(withQuery(path, { ...state, page: '', ...patch }));
    on('f-search', 'change', (e) => apply({ search: e.currentTarget.value.trim() }));
    on('f-from', 'change', (e) => apply({ from: e.currentTarget.value }));
    on('f-to', 'change', (e) => apply({ to: e.currentTarget.value }));
    on('f-per', 'change', (e) => apply({ per: e.currentTarget.value }));
  }
  function wirePaging(tableId, path, state, meta) {
    on(tableId, 'nextpage', () => go(withQuery(path, { ...state, page: meta.current_page + 1 })));
    on(tableId, 'previouspage', () => go(withQuery(path, { ...state, page: meta.current_page - 1 })));
  }
  function statusTabs(path, state, current, tabs) {
    return `<s-stack direction="inline" gap="small-200">${tabs.map(([key, label, count]) =>
      `<s-button href="${BASE}${withQuery(path, { ...state, status: key, page: '' })}" variant="${current === key ? 'primary' : 'secondary'}">${esc(label)}${count != null ? ` ${num(count)}` : ''}</s-button>`
    ).join('')}</s-stack>`;
  }

  // ── Router ─────────────────────────────────────────────────────────────────
  const ROUTES = [
    [/^\/?$/, viewHome],
    [/^\/chats$/, () => viewChats()],
    [/^\/chats\/([0-9a-f-]{36})$/, viewChats],
    [/^\/applications$/, () => viewInbox('applications')],
    [/^\/applications\/(\d+)$/, viewApplication],
    [/^\/requests$/, () => go('/requests/returns')],
    [/^\/requests\/messages$/, () => viewInbox('messages')],
    [/^\/requests\/messages\/(\d+)$/, viewMessage],
    [/^\/requests\/returns$/, () => viewInbox('returns')],
    [/^\/requests\/returns\/(\d+)$/, viewReturn],
    [/^\/blasts$/, () => go('/blasts/email')],
    [/^\/blasts\/(email|sms)$/, viewBlastList],
    [/^\/blasts\/(email|sms)\/new$/, viewBlastCreate],
    [/^\/blasts\/(email|sms)\/(\d+)$/, viewBlastDetail],
    [/^\/shipping-sms$/, viewShippingSms],
    [/^\/templates$/, viewTemplates],
    [/^\/settings$/, viewSettings],
  ];

  async function route() {
    if (!inAdmin) {
      $app.innerHTML = `<s-page heading="Mediko Gateway"><s-section>
        <s-heading>Open this app from your Shopify admin</s-heading>
        <s-paragraph>Mediko Gateway only works inside Shopify. Go to Apps › MedikoPH Gateway in your store admin.</s-paragraph>
      </s-section></s-page>`;
      return;
    }
    const path = location.pathname.replace(/^\/admin-dashboard/, '').replace(/\/$/, '') || '/';
    for (const [re, view] of ROUTES) {
      const m = path.match(re);
      if (m) {
        loading(true);
        try { await view(...m.slice(1)); }
        catch (err) { console.error(err); renderError('Mediko Gateway', err); }
        finally { loading(false); }
        return;
      }
    }
    $app.innerHTML = `<s-page heading="Page not found"><s-stack gap="base">${pageTitle('Page not found')}${emptyState('This page doesn’t exist', 'Use the app menu to find what you need.')}</s-stack></s-page>`;
  }

  // ── Home ───────────────────────────────────────────────────────────────────
  async function viewHome() {
    const [d, acct] = await Promise.all([
      api('/api/dashboard'),
      api('/api/sms/account').catch(() => null),
    ]);
    const credits = acct?.creditBalance;
    const banners = [];
    if (d.sms.failedToday > 0) {
      banners.push(`<s-banner tone="critical" heading="${esc(plural(d.sms.failedToday, 'shipping text'))} failed today">
        Customers didn’t get their shipping update.
        <s-button slot="secondary-actions" href="${BASE}/shipping-sms?status=failed">Review failed texts</s-button></s-banner>`);
    }
    if (credits != null && Number(credits) < 100) {
      banners.push(`<s-banner tone="warning" heading="Semaphore credits are running low">
        ${num(credits)} credits left — about ${num(credits)} texts.</s-banner>`);
    }
    d.interrupted.forEach((b) => {
      banners.push(`<s-banner tone="info" heading="${b.kind === 'sms' ? 'SMS' : 'Email'} blast “${esc(b.title)}” stopped at ${num(b.done)} of ${num(b.total)}">
        You can pick up where it left off.
        <s-button slot="secondary-actions" href="${BASE}/blasts/${b.kind}/${b.id}">Resume blast</s-button></s-banner>`);
    });

    const metric = (label, value, linkLabel, href) => `<s-section>
      <s-stack gap="small-200">
        <s-text color="subdued">${esc(label)}</s-text>
        <s-heading>${esc(value)}</s-heading>
        ${href ? `<s-link href="${href}">${esc(linkLabel)}</s-link>` : `<s-text color="subdued">${esc(linkLabel)}</s-text>`}
      </s-stack></s-section>`;
    const c = d.counts;

    const s = d.setup;
    const steps = [
      { done: s.apiKeySet, title: 'Semaphore API key set', note: 'Set on the server by your developer.' },
      { done: s.webhookSecretSet, title: 'Shopify webhook secret set', note: 'Set on the server by your developer.' },
      { done: Boolean(s.senderName), title: 'Enter an approved sender name',
        note: 'Get the name approved in Semaphore first (max 11 characters), then add it in Settings. Until then, texts use Semaphore’s default sender.',
        action: `<s-button href="${BASE}/settings">Open Settings</s-button>` },
      { done: s.checkoutPhoneDone, title: 'Phone number required at checkout',
        note: 'In Shopify Settings › Checkout, set “Shipping address phone number” to Required.',
        action: `<s-stack direction="inline" gap="small-200"><s-button href="shopify://admin/settings/checkout" target="_top">Open checkout settings</s-button><s-button id="mark-phone-done">Mark as done</s-button></s-stack>` },
      { done: s.testSmsSent, title: 'Send a test SMS', note: 'Uses 1 credit.',
        action: `<s-button id="open-test-sms">Send test SMS</s-button>` },
    ];
    const doneCount = steps.filter((x) => x.done).length;
    const guide = s.dismissed ? '' : doneCount === steps.length
      ? `<s-section heading="Shipping texts are ready">
          <s-stack gap="base">
            <s-paragraph>Customers will get a text each time an order is marked fulfilled.</s-paragraph>
            <s-button id="dismiss-guide">Dismiss guide</s-button>
          </s-stack></s-section>`
      : `<s-section heading="Set up shipping texts">
          <s-stack gap="base">
            <s-stack direction="inline" gap="small" alignItems="center">
              <s-text color="subdued">Customers get a text when their order is marked fulfilled.</s-text>
              <s-badge>${doneCount} of ${steps.length} done</s-badge>
            </s-stack>
            ${steps.map((st) => `<s-box padding="small" borderRadius="base" ${st.done ? '' : 'background="subdued"'}>
              <s-stack gap="small-200">
                <s-stack direction="inline" gap="small" alignItems="center">
                  <s-badge tone="${st.done ? 'success' : 'neutral'}">${st.done ? 'Done' : 'To do'}</s-badge>
                  <s-text type="strong">${esc(st.title)}</s-text>
                </s-stack>
                ${st.done ? '' : `<s-text color="subdued">${esc(st.note)}</s-text>${st.action || ''}`}
              </s-stack></s-box>`).join('')}
            <s-button variant="tertiary" id="dismiss-guide">Dismiss</s-button>
          </s-stack></s-section>`;

    $app.innerHTML = `<s-page heading="Home"><s-stack gap="base">
      ${pageTitle('Home')}
      ${banners.join('')}
      <div id="home-chat"></div>
      <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(14rem, 1fr))">
        ${metric('Pending Senior/PWD', num(c.applications.pending), 'View pending →', `${BASE}/applications?status=pending`)}
        ${metric('Pending messages', num(c.contact.pending), 'View pending →', `${BASE}/requests/messages?status=pending`)}
        ${metric('Pending returns', num(c.returns.pending), 'View pending →', `${BASE}/requests/returns?status=pending`)}
        ${metric('Shipping texts sent · last 7 days', num(d.sms.sent7d), 'Automatic, on fulfilment')}
        ${metric('Shipping texts failed · last 7 days', num(d.sms.failed7d), 'View failed →', `${BASE}/shipping-sms?status=failed`)}
        ${metric('Semaphore credits', credits == null ? '—' : num(credits), credits == null ? 'Couldn’t load balance' : 'Current balance')}
      </s-grid>
      ${guide}
    </s-stack></s-page>
    ${testSmsModal()}`;

    on('mark-phone-done', 'click', async () => {
      try { await api('/api/setup', { method: 'POST', body: { checkout_phone_done: true } }); toast('Marked as done'); viewHome(); }
      catch (e) { toast(`Couldn’t save: ${e.message}`, true); }
    });
    onAll('#dismiss-guide', 'click', async () => {
      try { await api('/api/setup', { method: 'POST', body: { guide_dismissed: true } }); viewHome(); }
      catch (e) { toast(`Couldn’t save: ${e.message}`, true); }
    });
    on('open-test-sms', 'click', () => showModal('test-sms-modal'));
    wireTestSms(() => viewHome());
    homeChat(d.chat || {});
  }

  // Home › live chat: counts from the chat service plus a setup guide. Loads on
  // its own so a chat-service outage never breaks the rest of Home.
  async function homeChat(cs) {
    const host = byId('home-chat');
    if (!host) return;
    let stats = null, down = false;
    if (cs.configured) {
      try { stats = await chatClient.api('/api/agent/stats'); } catch { down = true; }
    }
    if (!byId('home-chat')) return; // navigated away meanwhile

    const parts = [];
    if (down) {
      parts.push(`<s-banner tone="critical" heading="Chat service is offline">
        Customers can’t reach live chat right now. It reconnects on its own once the chat server is back.</s-banner>`);
    } else if (stats && stats.unanswered > 0) {
      parts.push(`<s-banner tone="warning" heading="${esc(plural(stats.unanswered, 'chat'))} waiting for a reply">
        <s-button slot="secondary-actions" href="${BASE}/chats">Open Chats</s-button></s-banner>`);
    }
    if (cs.configured) {
      const val = (v) => (stats ? num(v) : '—');
      parts.push(`<s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(14rem, 1fr))">
        <s-section><s-stack gap="small-200"><s-text color="subdued">Unanswered chats</s-text><s-heading>${val(stats?.unanswered)}</s-heading>
          <s-link href="${BASE}/chats">Open Chats →</s-link></s-stack></s-section>
        <s-section><s-stack gap="small-200"><s-text color="subdued">Open chats</s-text><s-heading>${val(stats?.open)}</s-heading>
          <s-text color="subdued">${stats ? 'Live from the chat service' : 'Couldn’t load counts'}</s-text></s-stack></s-section>
      </s-grid>`);
    }

    const steps = [
      { done: Boolean(cs.configured), title: 'Connect the chat service',
        note: 'Set CHAT_API_URL and CHAT_AGENT_SECRET in the server .env (your developer).' },
      { done: Boolean(cs.recipientsSet), title: 'Add chat alert recipients',
        note: 'Staff get an email when a chat starts or goes unanswered.',
        action: `<s-button href="${BASE}/settings">Open Settings</s-button>` },
      { done: stats ? stats.officeHoursEnabled : false, title: 'Turn on office hours',
        note: 'Outside office hours the widget shows Offline and the away message. Set them on the Settings page’s Chat office hours card.',
        action: `<s-button href="${BASE}/settings">Open Settings</s-button>` },
      { done: Boolean(cs.embedDone), title: 'Turn on the chat widget in your theme',
        note: 'Theme editor › App embeds › Chat widget. Use “Show only on these pages” to try it on one page first.',
        action: `<s-stack direction="inline" gap="small-200"><s-button href="shopify://admin/themes/current/editor?context=apps" target="_top">Open theme editor</s-button><s-button id="mark-chat-embed-done">Mark as done</s-button></s-stack>` },
    ];
    const doneCount = steps.filter((x) => x.done).length;
    if (!cs.dismissed && doneCount < steps.length) {
      parts.push(`<s-section heading="Set up live chat">
        <s-stack gap="base">
          <s-stack direction="inline" gap="small" alignItems="center">
            <s-text color="subdued">Customers chat with your team from the storefront; you answer in Chats.</s-text>
            <s-badge>${doneCount} of ${steps.length} done</s-badge>
          </s-stack>
          ${steps.map((st) => `<s-box padding="small" borderRadius="base" ${st.done ? '' : 'background="subdued"'}>
            <s-stack gap="small-200">
              <s-stack direction="inline" gap="small" alignItems="center">
                <s-badge tone="${st.done ? 'success' : 'neutral'}">${st.done ? 'Done' : 'To do'}</s-badge>
                <s-text type="strong">${esc(st.title)}</s-text>
              </s-stack>
              ${st.done ? '' : `<s-text color="subdued">${esc(st.note)}</s-text>${st.action || ''}`}
            </s-stack></s-box>`).join('')}
          <s-button variant="tertiary" id="dismiss-chat-guide">Dismiss</s-button>
        </s-stack></s-section>`);
    }
    host.innerHTML = parts.length ? `<s-stack gap="base">${parts.join('')}</s-stack>` : '';

    on('mark-chat-embed-done', 'click', async () => {
      try { await api('/api/setup', { method: 'POST', body: { chat_embed_done: true } }); toast('Marked as done'); viewHome(); }
      catch (e) { toast(`Couldn’t save: ${e.message}`, true); }
    });
    on('dismiss-chat-guide', 'click', async () => {
      try { await api('/api/setup', { method: 'POST', body: { chat_guide_dismissed: true } }); viewHome(); }
      catch (e) { toast(`Couldn’t save: ${e.message}`, true); }
    });
  }

  // Shared "Send test SMS" modal (Home + Shipping SMS).
  function testSmsModal() {
    return `<s-modal id="test-sms-modal" heading="Send test SMS">
      <s-stack gap="base">
        <s-text-field id="test-sms-number" label="Phone number" placeholder="0917 123 4567" details="Uses 1 credit."></s-text-field>
      </s-stack>
      <s-button slot="primary-action" variant="primary" id="test-sms-send">Send test</s-button>
      <s-button slot="secondary-actions" commandFor="test-sms-modal" command="--hide">Cancel</s-button>
    </s-modal>`;
  }
  function wireTestSms(after) {
    on('test-sms-send', 'click', async (e) => {
      const btn = e.currentTarget; const field = byId('test-sms-number');
      field.error = '';
      btn.loading = true;
      try {
        await api('/api/sms/test', { method: 'POST', body: { number: field.value } });
        hideModal('test-sms-modal');
        toast(`Text sent to ${fmtPhone(field.value)}`);
        after?.();
      } catch (err) {
        if (err.status === 400) field.error = err.message; else toast(`Couldn’t send: ${err.message}`, true);
      } finally { btn.loading = false; }
    });
  }

  // ── Inbox lists (Senior/PWD, Returns, Messages) ────────────────────────────
  // One compact table shape for all three: name + email | key field | date |
  // status | ⋯ menu. Rows open the detail page; the menu holds quick actions.
  const INBOX = {
    applications: {
      title: 'Senior/PWD', path: '/applications', api: '/api/submissions', countKey: 'applications',
      nameHeader: 'Applicant', keyHeader: 'ID number', dateHeader: 'Submitted',
      searchLabel: 'Name, email or ID number',
      keyCell: (r) => `<span class="mono nowrap">${esc(r.id_number)}</span>`,
      tabs: (c) => [['all', 'All', c.total], ['pending', 'Pending', c.pending || 0], ['approved', 'Approved'], ['rejected', 'Rejected']],
      empty: ['No Senior/PWD applications yet', 'Senior citizen and PWD applications from mediko.ph show up here.'],
      noun: 'applications',
    },
    returns: {
      title: 'Returns', path: '/requests/returns', api: '/api/return-requests', countKey: 'returns',
      nameHeader: 'Customer', keyHeader: 'Order', dateHeader: 'Submitted',
      searchLabel: 'Name, email or order number',
      keyCell: (r) => `<span class="mono nowrap">${esc(r.order_number)}</span>`,
      tabs: (c) => [['all', 'All', c.total], ['pending', 'Pending', c.pending || 0], ['approved', 'Approved'], ['rejected', 'Rejected']],
      empty: ['No returns yet', 'Return requests from mediko.ph show up here.'],
      noun: 'returns',
    },
    messages: {
      title: 'Messages', path: '/requests/messages', api: '/api/contact-submissions', countKey: 'contact',
      nameHeader: 'From', keyHeader: 'Message', dateHeader: 'Received',
      searchLabel: 'Name, email or message',
      keyCell: (r) => `<span class="cell-one">${esc(r.message)}</span>`,
      tabs: (c) => [['all', 'All', c.total], ['pending', 'Pending', c.pending || 0], ['resolved', 'Resolved']],
      empty: ['No messages yet', 'Messages from the mediko.ph contact form show up here.'],
      noun: 'messages',
    },
  };

  // Menu items per page and status: [label, action, tone]
  function rowActions(kind, status) {
    if (kind === 'messages') return status === 'pending' ? [['Mark resolved', 'resolve']] : [['Reopen', 'reopen']];
    return status === 'pending'
      ? [['Approve', 'approve'], ['Reject…', 'reject', 'critical']]
      : [['Revert to pending…', 'revert']];
  }

  async function viewInbox(kind) {
    const cfg = INBOX[kind];
    const q = qs();
    const per = perPage(kind, q.get('per'));
    const state = { status: q.get('status') || 'all', search: q.get('search') || '', from: q.get('from') || '', to: q.get('to') || '', per };
    const page = Math.max(1, parseInt(q.get('page'), 10) || 1);
    const params = new URLSearchParams({ page, limit: per });
    if (state.status !== 'all') params.set('status', state.status);
    if (state.search) params.set('search', state.search);
    if (state.from) params.set('date_from', state.from);
    if (state.to) params.set('date_to', state.to);
    const [list, counts, smsStatus] = await Promise.all([
      api(`${cfg.api}?${params}`), api('/api/inbox/counts'), api('/api/sms/settings').catch(() => null),
    ]);
    const smsReady = Boolean(smsStatus?.apiKeySet);
    const meta = list.metadata;

    const rows = list.data.map((r) => {
      const status = r.status || 'pending';
      const href = `${BASE}${cfg.path}/${r.id}`;
      return `<s-table-row clickDelegate="row-link-${r.id}">
        <s-table-cell><s-checkbox data-sel="${r.id}" accessibilityLabel="Select ${esc(r.full_name)}"></s-checkbox></s-table-cell>
        <s-table-cell><s-stack gap="none">
          <s-link id="row-link-${r.id}" href="${href}">${esc(r.full_name)}</s-link>
          <s-text color="subdued"><span class="cell-one">${esc(r.email_address)}</span></s-text>
        </s-stack></s-table-cell>
        <s-table-cell>${cfg.keyCell(r)}</s-table-cell>
        <s-table-cell>${dateCell(r.created_at)}</s-table-cell>
        <s-table-cell>${badge(status)}</s-table-cell>
        <s-table-cell>
          <s-button icon="menu-horizontal" variant="tertiary" commandFor="row-menu-${r.id}" accessibilityLabel="Actions for ${esc(r.full_name)}"></s-button>
          <s-menu id="row-menu-${r.id}" accessibilityLabel="Actions for ${esc(r.full_name)}">
            <s-button href="${href}">View</s-button>
            ${rowActions(kind, status).map(([label, act, tone]) =>
              `<s-button ${tone ? `tone="${tone}"` : ''} data-act="${act}" data-id="${r.id}" data-name="${esc(r.full_name)}" data-email="${esc(r.email_address)}" data-phone="${esc(r.contact_number)}" data-order="${esc(r.order_number || '')}">${label}</s-button>`).join('')}
          </s-menu>
        </s-table-cell>
      </s-table-row>`;
    }).join('');

    const filtered = state.search || state.from || state.to || state.status !== 'all';
    const filters = filterBar({ searchLabel: cfg.searchLabel, ...state });
    const body = list.data.length
      ? `<s-section padding="none"><s-table id="inbox-table" paginate ${meta.current_page < meta.total_pages ? 'hasNextPage' : ''} ${meta.current_page > 1 ? 'hasPreviousPage' : ''}>
          <s-stack slot="filters" gap="small">
            <div id="filters-wrap">${filterBar({ searchLabel: cfg.searchLabel, ...state }, false)}</div>
            <div id="bulk-bar" style="display:none"><s-box padding="small" background="strong" borderRadius="base">
              <s-stack direction="inline" gap="base" alignItems="center" justifyContent="space-between">
                <s-text type="strong" id="bulk-count"></s-text>
                <s-stack direction="inline" gap="small">
                  ${(kind === 'messages' ? [['Mark resolved', 'resolve'], ['Reopen', 'reopen']] : [['Approve', 'approve'], ['Reject…', 'reject', 'critical']])
                    .map(([label, act, tone]) => `<s-button data-bulk="${act}" ${tone ? `tone="${tone}"` : ''}>${label}</s-button>`).join('')}
                  <s-button variant="tertiary" id="bulk-clear">Clear</s-button>
                </s-stack>
              </s-stack>
            </s-box></div>
          </s-stack>
          <s-table-header-row>
            <s-table-header><s-checkbox id="sel-all" accessibilityLabel="Select all on this page"></s-checkbox></s-table-header>
            <s-table-header listSlot="primary">${cfg.nameHeader}</s-table-header>
            <s-table-header>${cfg.keyHeader}</s-table-header>
            <s-table-header>${cfg.dateHeader}</s-table-header>
            <s-table-header listSlot="inline">Status</s-table-header>
            <s-table-header><span style="position:absolute;left:-9999px">Actions</span></s-table-header>
          </s-table-header-row>
          <s-table-body>${rows}</s-table-body>
        </s-table></s-section>`
      : filtered
        ? `<s-section padding="none"><s-table>${filters}<s-table-body></s-table-body></s-table></s-section>
           ${state.status === 'pending' && !state.search && !state.from && !state.to
              ? emptyState(`No pending ${cfg.noun}`, 'You’re all caught up.')
              : emptyState(`No ${cfg.noun} match`, 'Try a different search, status or date range.', `<s-button href="${BASE}${cfg.path}">Clear filters</s-button>`)}`
        : emptyState(...cfg.empty);

    $app.innerHTML = `<s-page heading="${cfg.title}"><s-stack gap="base">
      ${pageTitle(cfg.title)}
      ${statusTabs(cfg.path, state, state.status, cfg.tabs(counts[cfg.countKey]))}
      ${body}
    </s-stack></s-page>
    ${decisionModal()}
    <s-modal id="bulk-modal" heading="Confirm">
      <s-stack gap="base">
        <s-paragraph id="bulk-text"></s-paragraph>
        <div id="bulk-reason-wrap"><s-text-area id="bulk-reason" label="Reason (sent to everyone selected)" rows="3"></s-text-area></div>
        <div id="bulk-notify"><s-stack gap="small">
          <s-text type="strong">Notify the customers</s-text>
          <s-checkbox id="bulk-email" label="Send an email" details="Uses your saved templates." checked></s-checkbox>
          <s-checkbox id="bulk-sms" label="Send a text (SMS)"></s-checkbox>
        </s-stack></div>
      </s-stack>
      <s-button slot="primary-action" variant="primary" id="bulk-confirm">Confirm</s-button>
      <s-button slot="secondary-actions" commandFor="bulk-modal" command="--hide">Cancel</s-button>
    </s-modal>
    <s-modal id="revert-list-modal" heading="Revert to pending?">
      <s-stack gap="base" id="revert-list-body"></s-stack>
      <s-button slot="primary-action" variant="primary" tone="critical" id="revert-list-confirm">Revert to pending</s-button>
      <s-button slot="secondary-actions" commandFor="revert-list-modal" command="--hide">Cancel</s-button>
    </s-modal>`;

    wireFilters(cfg.path, state);
    wirePaging('inbox-table', cfg.path, state, meta);
    const reload = () => viewInbox(kind);
    const setStatus = async (id, status, okMsg) => {
      loading(true);
      try { await api(`${cfg.api}/${id}/status`, { method: 'PATCH', body: { status } }); toast(okMsg); reload(); }
      catch (err) { toast(`Couldn’t update: ${err.message}`, true); }
      finally { loading(false); }
    };
    wireDecision();
    const okText = { applications: 'Application', returns: 'Return' };

    // ── Bulk selection ──
    const rowsById = Object.fromEntries(list.data.map((r) => [String(r.id), r]));
    const selected = new Set();
    const syncBulk = () => {
      const n = selected.size;
      byId('bulk-bar').style.display = n ? '' : 'none';
      byId('filters-wrap').style.display = n ? 'none' : '';
      byId('bulk-count').textContent = `${n} selected`;
      const all = byId('sel-all');
      if (all) { all.checked = n > 0 && n === list.data.length; all.indeterminate = n > 0 && n < list.data.length; }
    };
    onAll('[data-sel]', 'change', (e) => {
      const id = e.currentTarget.dataset.sel;
      if (e.currentTarget.checked) selected.add(id); else selected.delete(id);
      syncBulk();
    });
    onAll('[data-sel]', 'click', (e) => e.stopPropagation()); // don't open the row
    on('sel-all', 'change', (e) => {
      const on_ = e.currentTarget.checked;
      document.querySelectorAll('[data-sel]').forEach((cb) => {
        cb.checked = on_;
        if (on_) selected.add(cb.dataset.sel); else selected.delete(cb.dataset.sel);
      });
      syncBulk();
    });
    on('bulk-clear', 'click', () => {
      selected.clear();
      document.querySelectorAll('[data-sel]').forEach((cb) => { cb.checked = false; });
      syncBulk();
    });

    const BULK = {
      approve: { from: 'pending', to: 'approved', verb: 'Approve', done: 'approved' },
      reject: { from: 'pending', to: 'rejected', verb: 'Reject', done: 'rejected' },
      resolve: { from: 'pending', to: 'resolved', verb: 'Mark resolved', done: 'resolved' },
      reopen: { from: 'resolved', to: 'pending', verb: 'Reopen', done: 'reopened' },
    };
    let bulkAct = null, bulkIds = [];
    onAll('[data-bulk]', 'click', (e) => {
      bulkAct = e.currentTarget.dataset.bulk;
      const b = BULK[bulkAct];
      bulkIds = [...selected].filter((id) => (rowsById[id].status || 'pending') === b.from);
      const skipped = selected.size - bulkIds.length;
      const what = kind === 'messages' ? 'message' : kind === 'returns' ? 'return' : 'application';
      byId('bulk-modal').heading = `${b.verb} ${plural(bulkIds.length, what)}?`;
      byId('bulk-text').textContent = bulkIds.length
        ? `${plural(bulkIds.length, what)} will be ${b.done}.${skipped ? ` ${num(skipped)} selected ${skipped === 1 ? 'isn’t' : 'aren’t'} ${b.from}, so ${skipped === 1 ? 'it’s' : 'they’re'} skipped.` : ''}`
        : `None of the selected ${what}s are ${b.from}, so there’s nothing to do.`;
      const reject = bulkAct === 'reject';
      byId('bulk-reason-wrap').style.display = reject ? '' : 'none';
      const r = byId('bulk-reason'); r.value = ''; r.error = '';
      const notify = kind !== 'messages' && (bulkAct === 'approve' || bulkAct === 'reject');
      byId('bulk-notify').style.display = notify ? '' : 'none';
      byId('bulk-email').checked = true;
      const sm = byId('bulk-sms');
      const textable = bulkIds.filter((id) => isPhMobile(rowsById[id].contact_number)).length;
      sm.checked = false;
      sm.disabled = !smsReady || !textable;
      sm.details = !smsReady ? 'Not available: no Semaphore API key on the server.'
        : `Uses your saved templates. ${plural(textable, 'customer')} with a valid mobile number · about ${plural(textable, 'credit')}.`;
      const btn = byId('bulk-confirm');
      btn.textContent = b.verb;
      btn.disabled = !bulkIds.length;
      if (reject) btn.setAttribute('tone', 'critical'); else btn.removeAttribute('tone');
      showModal('bulk-modal');
    });
    on('bulk-confirm', 'click', async (e) => {
      const b = BULK[bulkAct];
      const body = { status: b.to };
      if (bulkAct === 'reject') {
        const r = byId('bulk-reason'); const reason = r.value.trim();
        if (reason.length < 5) { r.error = 'Enter a reason (at least 5 characters).'; return; }
        body.reason = reason;
      }
      if (kind !== 'messages' && (bulkAct === 'approve' || bulkAct === 'reject')) {
        body.notify = { email: Boolean(byId('bulk-email').checked), sms: Boolean(byId('bulk-sms').checked) };
      }
      const btn = e.currentTarget; btn.loading = true;
      let ok = 0, failed = 0, texted = 0, textFailed = 0;
      for (const id of bulkIds) {   // one at a time: each sends its own email/SMS
        try {
          const res = await api(`${cfg.api}/${id}/status`, { method: 'PATCH', body });
          ok++;
          if (res.notified?.sms === 'sent') texted++;
          else if (/^(failed|skipped)/.test(res.notified?.sms || '')) textFailed++;
        } catch { failed++; }
      }
      btn.loading = false;
      hideModal('bulk-modal');
      const what = kind === 'messages' ? 'message' : kind === 'returns' ? 'return' : 'application';
      toast(`${plural(ok, what)} ${b.done}${texted ? ` · ${num(texted)} texted` : ''}`);
      if (failed || textFailed) {
        setTimeout(() => toast([failed ? `${num(failed)} couldn’t be updated` : '', textFailed ? `${num(textFailed)} texts not sent` : ''].filter(Boolean).join(' · '), true), 600);
      }
      reload();
    });
    let revertId = null;
    onAll('[data-act]', 'click', (e) => {
      const { act, id, name, email, phone, order } = e.currentTarget.dataset;
      if (act !== 'revert') {
        openDecision({ kind, act, id, name, email, phone, order, smsReady, after: reload });
        return;
      }
      {
        revertId = id;
        byId('revert-list-body').innerHTML =
          `<s-paragraph>${esc(name)}’s ${kind === 'returns' ? 'return' : 'application'} goes back to the pending list.</s-paragraph>`;
        showModal('revert-list-modal');
      }
    });
    on('revert-list-confirm', 'click', () => {
      hideModal('revert-list-modal');
      setStatus(revertId, 'pending', `${okText[kind]} set back to pending`);
    });
  }

  // ── Decision dialog (approve / reject / resolve / reopen) ──────────────────
  // Every status decision goes through this one confirmation. Approve and
  // reject on Senior/PWD and Returns also offer customer notifications:
  // email (on by default, as before) and SMS (opt-in, 1 credit).
  const DECISION_API = { applications: '/api/submissions', returns: '/api/return-requests', messages: '/api/contact-submissions' };
  const isPhMobile = (p) => {
    let d = String(p || '').replace(/\D/g, '');
    if (d.length === 11 && d.startsWith('09')) d = '63' + d.slice(1);
    else if (d.length === 10 && d.startsWith('9')) d = '63' + d;
    return /^639\d{9}$/.test(d);
  };

  function decisionModal() {
    return `<s-modal id="decision-modal" heading="Confirm">
      <s-stack gap="base">
        <s-paragraph id="decision-text"></s-paragraph>
        <div id="decision-reason-wrap"><s-text-area id="decision-reason" label="Reason" rows="3"></s-text-area></div>
        <div id="decision-notify"><s-stack gap="base">
          <s-text type="strong">Notify the customer</s-text>
          <s-checkbox id="notify-email" label="Send an email"></s-checkbox>
          <div id="notify-email-edit"><s-stack gap="small">
            <s-text-field id="notify-email-subject" label="Email subject"></s-text-field>
            <s-text-area id="notify-email-body" label="Email message" rows="8" details="From your Templates. Changes here apply to this customer only. {{reason}} is filled in from the reason above."></s-text-area>
          </s-stack></div>
          <s-checkbox id="notify-sms" label="Send a text (SMS)"></s-checkbox>
          <div id="notify-sms-edit"><s-stack gap="small-200">
            <s-text-area id="notify-sms-text" label="Text message" rows="3"></s-text-area>
            <s-text color="subdued" id="notify-sms-cost"></s-text>
          </s-stack></div>
        </s-stack></div>
      </s-stack>
      <s-button slot="primary-action" variant="primary" id="decision-confirm">Confirm</s-button>
      <s-button slot="secondary-actions" commandFor="decision-modal" command="--hide">Cancel</s-button>
    </s-modal>`;
  }

  let _decision = null;
  // opts: { kind, act, id, name, email, phone, order, smsReady, after }
  function openDecision(opts) {
    _decision = opts;
    const { kind, act, name, email, phone, order, smsReady } = opts;
    const copy = {
      'applications:approve': [`Approve ${name}?`, 'Their Senior/PWD application is marked approved.', 'Approve'],
      'applications:reject': [`Reject ${name}’s application?`, 'Tell the customer why, so they know what to fix.', 'Reject'],
      'returns:approve': ['Approve this return?', `Return for order ${order || ''} from ${name}.`, 'Approve'],
      'returns:reject': ['Reject this return?', `Return for order ${order || ''} from ${name}. Give the reason.`, 'Reject'],
      'messages:resolve': ['Mark this message resolved?', `From ${name}. It moves out of the pending list.`, 'Mark resolved'],
      'messages:reopen': ['Reopen this message?', `From ${name}. It goes back to the pending list.`, 'Reopen'],
    }[`${kind}:${act}`];
    const modal = byId('decision-modal');
    modal.heading = copy[0];
    byId('decision-text').textContent = copy[1];

    const reject = act === 'reject';
    byId('decision-reason-wrap').style.display = reject ? '' : 'none';
    const reason = byId('decision-reason'); reason.value = ''; reason.error = '';

    const notify = kind !== 'messages';
    byId('decision-notify').style.display = notify ? '' : 'none';
    const em = byId('notify-email'), sm = byId('notify-sms');
    em.checked = true; em.details = email || '';
    const phoneOk = isPhMobile(phone);
    sm.checked = false;
    sm.disabled = !smsReady || !phoneOk;
    sm.details = !smsReady ? 'Not available: no Semaphore API key on the server.'
      : !phoneOk ? `Not available: ${phone || 'no number'} isn’t a PH mobile number.`
      : `${fmtPhone(phone)} · uses 1 credit`;

    const emailEdit = byId('notify-email-edit'), smsEdit = byId('notify-sms-edit');
    const syncEditors = () => {
      emailEdit.style.display = notify && em.checked ? '' : 'none';
      smsEdit.style.display = notify && sm.checked ? '' : 'none';
    };
    em.onchange = syncEditors; sm.onchange = syncEditors;
    syncEditors();
    const subj = byId('notify-email-subject'), bodyF = byId('notify-email-body'), smsF = byId('notify-sms-text');
    const cost = () => { byId('notify-sms-cost').textContent = smsCost(smsF.value); };
    smsF.oninput = cost;
    subj.value = ''; bodyF.value = ''; smsF.value = ''; cost();
    if (notify && (act === 'approve' || act === 'reject')) {
      const status = act === 'approve' ? 'approved' : 'rejected';
      api(`/api/templates/fill/${kind}/${opts.id}/${status}`).then((f) => {
        if (_decision !== opts) return;
        subj.value = f.email.subject; bodyF.value = f.email.body; smsF.value = f.sms; cost();
      }).catch((err) => toast(`Couldn’t load the message templates: ${err.message}`, true));
    }

    const btn = byId('decision-confirm');
    btn.textContent = copy[2];
    if (reject) btn.setAttribute('tone', 'critical'); else btn.removeAttribute('tone');
    showModal('decision-modal');
  }

  function wireDecision() {
    on('decision-confirm', 'click', async (e) => {
      const d = _decision; if (!d) return;
      const status = { approve: 'approved', reject: 'rejected', resolve: 'resolved', reopen: 'pending' }[d.act];
      const body = { status };
      if (d.act === 'reject') {
        const r = byId('decision-reason'); const reason = r.value.trim();
        if (reason.length < 5) { r.error = 'Enter a reason (at least 5 characters).'; return; }
        body.reason = reason;
      }
      if (d.kind !== 'messages') {
        const wantEmail = Boolean(byId('notify-email').checked), wantSms = Boolean(byId('notify-sms').checked);
        body.notify = { email: wantEmail, sms: wantSms };
        if (wantEmail) {
          const subject = byId('notify-email-subject').value.trim(), text = byId('notify-email-body').value.trim();
          if (!subject || !text) { toast('The email subject and message can’t be empty.', true); return; }
          body.notify.email_subject = subject; body.notify.email_body = text;
        }
        if (wantSms) {
          const text = byId('notify-sms-text').value.trim();
          if (!text) { toast('The text message can’t be empty.', true); return; }
          body.notify.sms_text = text;
        }
      }
      const btn = e.currentTarget; btn.loading = true;
      try {
        const res = await api(`${DECISION_API[d.kind]}/${d.id}/status`, { method: 'PATCH', body });
        hideModal('decision-modal');
        const noun = { applications: 'Application', returns: 'Return', messages: 'Message' }[d.kind];
        const verb = { approve: 'approved', reject: 'rejected', resolve: 'resolved', reopen: 'reopened' }[d.act];
        const n = res.notified || {};
        const sent = [n.email ? 'emailed' : '', n.sms === 'sent' ? 'texted' : ''].filter(Boolean);
        toast(`${noun} ${verb}${sent.length ? ` · customer ${sent.join(' and ')}` : ''}`);
        if (typeof n.sms === 'string' && /^(failed|skipped)/.test(n.sms)) {
          setTimeout(() => toast(`Text not sent: ${n.sms.replace(/^(failed|skipped): /, '')}`, true), 600);
        }
        d.after?.();
      } catch (err) {
        if (d.act === 'reject') byId('decision-reason').error = err.message;
        else { hideModal('decision-modal'); toast(`Couldn’t update: ${err.message}`, true); }
      } finally { btn.loading = false; }
    });
  }

  // ── Application detail ─────────────────────────────────────────────────────
  async function viewApplication(id) {

            <s-button id="open-assign">Change</s-button>
            ${a.refunded_at ? '<s-button id="undo-refund">Undo refunded</s-button>' : '<s-button id="mark-refund">Mark as refunded</s-button>'}
            <s-button tone="critical" variant="tertiary" commandFor="unassign-modal" command="--show">Unassign</s-button>
          </s-stack></s-stack>`
      : `<s-stack gap="small"><s-text color="subdued">Not assigned</s-text><s-button id="open-assign">Assign order</s-button></s-stack>`;

    const kv = (label, value) => `<s-stack gap="none"><s-text color="subdued">${esc(label)}</s-text>${value}</s-stack>`;

    $app.innerHTML = `<s-page heading="${esc(a.full_name)}">
      <s-link slot="breadcrumb-actions" href="${BASE}/applications">Senior/PWD</s-link>
      ${badge(status, 'accessory')}
      ${actions}
      <s-stack gap="base">
      ${pageTitle(esc(a.full_name), badge(status))}
      ${status === 'rejected' && a.rejection_reason ? `<s-banner tone="critical" heading="Rejected">${esc(a.rejection_reason)}</s-banner>` : ''}
      <s-section heading="ID photos">
        ${photos.length ? `<s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(9rem, 1fr))">
          ${photos.map((u, i) => `<s-clickable data-photo="${i}" accessibilityLabel="Open ID photo ${i + 1} full size" borderRadius="base">
            <s-image src="${esc(u)}" alt="ID photo ${i + 1}" aspectRatio="4/3" objectFit="cover" borderRadius="base"></s-image></s-clickable>`).join('')}
        </s-grid>
        <s-text color="subdued">Click a photo to see it full size.</s-text>` : '<s-text color="subdued">No photos uploaded.</s-text>'}
      </s-section>
      <s-section heading="Applicant details">
        <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(12rem, 1fr))">
          ${kv('Name', `<s-text>${esc(a.full_name)}</s-text>`)}
          ${kv('Email', `<s-link href="mailto:${esc(a.email_address)}">${esc(a.email_address)}</s-link>`)}
          ${kv('Contact number', `<s-text>${esc(fmtPhone(a.contact_number))}</s-text>`)}
          ${kv('Birthday', `<s-text>${esc(a.birthday ? fmtDay(a.birthday) : '—')}</s-text>`)}
          ${kv('ID number', `<s-text><span class="mono">${esc(a.id_number)}</span></s-text>`)}
          ${kv('Submitted', `<s-text>${esc(fmtDate(a.created_at))}</s-text>`)}
        </s-grid>
      </s-section>

      <s-section slot="aside" heading="Order">${order}</s-section>
    </s-page>

    ${decisionModal()}

    <s-modal id="revert-modal" heading="Revert to pending?">
      <s-paragraph>The application goes back to the pending list.</s-paragraph>
      <s-button slot="primary-action" variant="primary" tone="critical" id="revert-confirm">Revert to pending</s-button>
      <s-button slot="secondary-actions" commandFor="revert-modal" command="--hide">Cancel</s-button>
    </s-modal>

    <s-modal id="unassign-modal" heading="Unassign order ${esc(a.assigned_order_name || '')}?">
      <s-paragraph>The order stays in Shopify. It just won’t be linked to this application.</s-paragraph>
      <s-button slot="primary-action" variant="primary" tone="critical" id="unassign-confirm">Unassign</s-button>
      <s-button slot="secondary-actions" commandFor="unassign-modal" command="--hide">Cancel</s-button>
    </s-modal>

    <s-modal id="photo-modal" heading="ID photo" size="large">
      <s-image id="photo-full" src="" alt="ID photo full size" objectFit="contain"></s-image>
      <s-button slot="secondary-actions" id="photo-prev">‹ Previous</s-button>
      <s-button slot="secondary-actions" id="photo-next">Next ›</s-button>
    </s-modal>

    <s-modal id="assign-modal" heading="Assign order" size="large">
      <s-stack gap="base">
        <s-search-field id="assign-search" label="Search orders" placeholder="Order number, customer name or email"></s-search-field>
        <s-text color="subdued">Leave blank to see ${esc(a.full_name)}’s own orders.</s-text>
        <div id="assign-orders"><s-spinner accessibilityLabel="Loading orders"></s-spinner></div>
        <s-choice-list id="assign-tag" label="Type">
          <s-choice value="PWD" ${a.assigned_tag === 'PWD' ? 'selected' : ''}>PWD</s-choice>
          <s-choice value="SC" ${a.assigned_tag !== 'PWD' ? 'selected' : ''}>SC</s-choice>
        </s-choice-list>
        <s-text id="assign-error" tone="critical"></s-text>
      </s-stack>
      <s-button slot="primary-action" variant="primary" id="assign-confirm">Assign</s-button>
      <s-button slot="secondary-actions" commandFor="assign-modal" command="--hide">Cancel</s-button>
    </s-modal>`;

    const reload = () => viewApplication(id);
    const act = async (fn, okMsg, failMsg) => {
      loading(true);
      try { await fn(); toast(okMsg); reload(); }
      catch (err) { toast(`${failMsg}: ${err.message}`, true); }
      finally { loading(false); }
    };

    const decide = (actName) => openDecision({ kind: 'applications', act: actName, id, name: a.full_name,
      email: a.email_address, phone: a.contact_number, smsReady, after: reload });
    on('approve-btn', 'click', () => decide('approve'));
    on('reject-btn', 'click', () => decide('reject'));
    wireDecision();
    on('revert-confirm', 'click', () => { hideModal('revert-modal'); act(
      () => api(`/api/submissions/${id}/status`, { method: 'PATCH', body: { status: 'pending' } }),
      'Application set back to pending', 'Couldn’t revert'); });
    on('unassign-confirm', 'click', () => { hideModal('unassign-modal'); act(
      () => api(`/api/submissions/${id}/assign-order`, { method: 'DELETE' }), 'Order unassigned', 'Couldn’t unassign'); });
    on('mark-refund', 'click', () => act(() => api(`/api/submissions/${id}/refund`, { method: 'POST' }), 'Marked as refunded', 'Couldn’t mark refunded'));
    on('undo-refund', 'click', () => act(() => api(`/api/submissions/${id}/refund`, { method: 'DELETE' }), 'Refund mark removed', 'Couldn’t update'));

    // Photo lightbox
    let photoIdx = 0;
    const showPhoto = (i) => {
      photoIdx = (i + photos.length) % photos.length;
      byId('photo-full').src = photos[photoIdx];
      byId('photo-modal').heading = `ID photo ${photoIdx + 1} of ${photos.length}`;
    };
    onAll('[data-photo]', 'click', (e) => { showPhoto(Number(e.currentTarget.dataset.photo)); showModal('photo-modal'); });
    on('photo-prev', 'click', () => showPhoto(photoIdx - 1));
    on('photo-next', 'click', () => showPhoto(photoIdx + 1));

    // Assign order
    let orders = [];
    const loadOrders = async (term) => {
      const box = byId('assign-orders');
      box.innerHTML = '<s-spinner accessibilityLabel="Loading orders"></s-spinner>';
      try {
        const r = await api(`/api/submissions/${id}/orders?q=${encodeURIComponent(term || '')}`);
        orders = r.orders || [];
        box.innerHTML = orders.length
          ? `<s-choice-list id="assign-order" label="Order">${orders.map((o, i) => `<s-choice value="${i}" ${i === 0 ? 'selected' : ''}>
              ${esc(o.name)} · ${esc(o.customer_name || o.email || 'Guest')}
              <s-text slot="details">${esc(fmtDate(o.created_at))}${o.total ? ` · ${esc(o.currency === 'PHP' ? '₱' : (o.currency || '') + ' ')}${Number(o.total).toLocaleString('en-US', { minimumFractionDigits: 2 })}` : ''}</s-text>
            </s-choice>`).join('')}</s-choice-list>`
          : '<s-text color="subdued">No matching orders.</s-text>';
      } catch (err) { box.innerHTML = `<s-text tone="critical">Couldn’t load orders: ${esc(err.message)}</s-text>`; }
    };
    on('open-assign', 'click', () => { byId('assign-error').textContent = ''; showModal('assign-modal'); loadOrders(''); });
    let searchTimer;
    on('assign-search', 'input', (e) => { clearTimeout(searchTimer); const v = e.currentTarget.value; searchTimer = setTimeout(() => loadOrders(v), 400); });
    on('assign-confirm', 'click', async (e) => {
      const err = byId('assign-error'); err.textContent = '';
      const pick = byId('assign-order')?.values?.[0];
      const o = orders[Number(pick)];
      if (!o) { err.textContent = 'Pick an order first.'; return; }
      const tag = byId('assign-tag').values?.[0] || 'SC';
      const btn = e.currentTarget; btn.loading = true;
      try {
        await api(`/api/submissions/${id}/assign-order`, { method: 'POST', body: { order_gid: o.gid, order_name: o.name, customer_gid: o.customer_gid, tag } });
        hideModal('assign-modal'); toast('Order assigned'); reload();
      } catch (x) { err.textContent = x.message; }
      finally { btn.loading = false; }
    });
  }
