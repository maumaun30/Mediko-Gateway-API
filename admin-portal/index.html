  // ── Templates ──────────────────────────────────────────────────────────────
  // Same syntax as the server: {{var}}, [[optional part]], blank line = new
  // paragraph, **bold** in emails. Previews use sample values.
  const SAMPLE_VARS = {
    name: 'Maria Santos', first_name: 'Maria', id_number: 'SC-034-2219', reference_id: '123',
    order: '#MK1028', items: 'Vitamin C 500mg ×2', reason: 'The ID photo is too blurry to read.',
    message: 'Is losartan 50mg available for delivery this week?',
    courier: 'J&T Express', tracking: '7820 4419 0031', link: 'https://jtexpress.ph/track?no=782044190031',
  };
  function fillTpl(text, vars, keep = []) {
    const val = (k) => (vars[k] == null ? '' : String(vars[k]));
    return String(text || '')
      .replace(/\[\[([\s\S]*?)\]\]/g, (_, seg) => {
        const names = [...seg.matchAll(/\{\{\s*(\w+)\s*\}\}/g)].map((m) => m[1]);
        return names.every((n) => keep.includes(n) || val(n).trim()) ? seg : '';
      })
      .replace(/\{\{\s*(\w+)\s*\}\}/g, (m, k) => (keep.includes(k) ? m : val(k)));
  }
  const previewEmail = (text) => esc(fillTpl(text, SAMPLE_VARS).replace(/\n{3,}/g, '\n\n').trim())
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  function smsCost(text) {
    const { len, parts } = smsSegments(smsClean(text));
    return `${num(len)} characters · ${plural(parts, 'credit')} each`;
  }

  async function viewTemplates() {
    const { templates } = await api('/api/templates');
    const loaded = Object.fromEntries(templates.map((t) => [t.key, { subject: t.subject, body: t.body }]));
    const groups = [...new Set(templates.map((t) => t.group))];

    const card = (t) => `<s-section heading="${esc(t.name)}">
      <s-stack gap="base">
        <s-stack direction="inline" gap="small" alignItems="center">
          <s-badge tone="${t.channel === 'sms' ? 'info' : 'neutral'}">${t.channel === 'sms' ? 'SMS' : 'Email'}</s-badge>
          <s-badge tone="${t.saved ? 'success' : 'neutral'}">${t.saved ? 'Edited' : 'Default'}</s-badge>
          ${t.saved ? `<s-button variant="tertiary" data-reset="${t.key}" data-name="${esc(t.name)}">Reset to default</s-button>` : ''}
        </s-stack>
        ${t.channel === 'email' ? `<s-text-field id="tpl-subject-${t.key}" label="Subject" value="${esc(t.subject)}" maxLength="200"></s-text-field>` : ''}
        <s-text-area id="tpl-body-${t.key}" label="${t.channel === 'email' ? 'Message' : 'Text'}" rows="${t.channel === 'email' ? 12 : 3}" value="${esc(t.body)}"></s-text-area>
        <s-stack direction="inline" gap="small-200" alignItems="center">
          <s-text color="subdued">Placeholders:</s-text>
          ${t.vars.map((v) => `<s-badge>{{${esc(v)}}}</s-badge>`).join('')}
        </s-stack>
        <s-box padding="base" background="subdued" borderRadius="base">
          <s-stack gap="small-200">
            <s-text color="subdued">Preview with sample details${t.channel === 'sms' ? ` · <span id="tpl-cost-${t.key}"></span>` : ''}</s-text>
            ${t.channel === 'email' ? `<s-text type="strong" id="tpl-prev-subject-${t.key}"></s-text>` : ''}
            <div class="prewrap" id="tpl-prev-${t.key}"></div>
          </s-stack>
        </s-box>
      </s-stack>
    </s-section>`;

    $app.innerHTML = `<form id="tpl-form" data-save-bar data-discard-confirmation>
      <s-page heading="Templates"><s-stack gap="base">
        ${pageTitle('Templates')}
        <s-banner tone="info" heading="How templates work">
          Type <s-text type="strong">{{first_name}}</s-text>-style placeholders to fill in each customer’s details.
          Text inside <s-text type="strong">[[ ]]</s-text> is left out when a placeholder in it is empty.
          In emails, a blank line starts a new paragraph and <s-text type="strong">**text**</s-text> is bold.
          Staff can still adjust the wording for one customer in the approve/reject dialog.
        </s-banner>
        ${groups.map((g) => `<s-heading>${esc(g)}</s-heading>${templates.filter((t) => t.group === g).map(card).join('')}`).join('')}
      </s-stack></s-page>
    </form>
    <s-modal id="tpl-reset-modal" heading="Reset to default?">
      <s-paragraph id="tpl-reset-text"></s-paragraph>
      <s-button slot="primary-action" variant="primary" tone="critical" id="tpl-reset-confirm">Reset</s-button>
      <s-button slot="secondary-actions" commandFor="tpl-reset-modal" command="--hide">Cancel</s-button>
    </s-modal>`;

    const refresh = (t) => {
      const body = byId(`tpl-body-${t.key}`).value;
      if (t.channel === 'email') {
        byId(`tpl-prev-subject-${t.key}`).textContent = fillTpl(byId(`tpl-subject-${t.key}`).value, SAMPLE_VARS);
        byId(`tpl-prev-${t.key}`).innerHTML = previewEmail(body);
      } else {
        const text = smsClean(fillTpl(body, SAMPLE_VARS).replace(/\s+/g, ' '));
        byId(`tpl-prev-${t.key}`).textContent = text;
        byId(`tpl-cost-${t.key}`).textContent = smsCost(text);
      }
    };
    templates.forEach((t) => {
      refresh(t);
      on(`tpl-body-${t.key}`, 'input', () => refresh(t));
      if (t.channel === 'email') on(`tpl-subject-${t.key}`, 'input', () => refresh(t));
    });

    const form = byId('tpl-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const changed = {};
      templates.forEach((t) => {
        const body = byId(`tpl-body-${t.key}`).value;
        const subject = t.channel === 'email' ? byId(`tpl-subject-${t.key}`).value : null;
        byId(`tpl-body-${t.key}`).error = '';
        if (body !== loaded[t.key].body || (t.channel === 'email' && subject !== loaded[t.key].subject)) {
          changed[t.key] = { body, subject };
        }
      });
      if (!Object.keys(changed).length) { viewTemplates(); return; }
      loading(true);
      try {
        await api('/api/templates', { method: 'PUT', body: { templates: changed } });
        toast('Templates saved');
        viewTemplates();
      } catch (err) {
        let matched = false;
        err.message.split('; ').forEach((part) => {
          const t = templates.find((x) => part.startsWith(x.name + ': '));
          if (t) { byId(`tpl-body-${t.key}`).error = part.slice(t.name.length + 2); matched = true; }
        });
        toast(matched ? 'Couldn’t save: check the highlighted templates' : `Couldn’t save: ${err.message}`, true);
      } finally { loading(false); }
    });
    form.addEventListener('reset', () => setTimeout(viewTemplates, 0));

    let resetKey = null;
    onAll('[data-reset]', 'click', (e) => {
      resetKey = e.currentTarget.dataset.reset;
      byId('tpl-reset-text').textContent = `“${e.currentTarget.dataset.name}” goes back to the original wording. Your edits are lost.`;
      showModal('tpl-reset-modal');
    });
    on('tpl-reset-confirm', 'click', async () => {
      hideModal('tpl-reset-modal');
      try { await api(`/api/templates/${resetKey}`, { method: 'DELETE' }); toast('Template reset'); viewTemplates(); }
      catch (err) { toast(`Couldn’t reset: ${err.message}`, true); }
    });
  }

  // ── Settings ───────────────────────────────────────────────────────────────
  const SETTING_GROUPS = {
    Notifications: 'Who gets an email when a new application, message or return comes in.',
    'Email blasts': 'Slows sending so emails don’t get flagged as spam.',
    SMS: 'Shipping texts and SMS blasts, sent through Semaphore.',
    Chat: 'Who is emailed about live chats.',
  };
  const CHAT_DAYS = [['mon', 'Monday'], ['tue', 'Tuesday'], ['wed', 'Wednesday'], ['thu', 'Thursday'], ['fri', 'Friday'], ['sat', 'Saturday'], ['sun', 'Sunday']];
  const HHMM_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
  // 30-minute steps for the office-hours selects, labelled 12-hour ("8:00 AM").
  // A saved value off the grid (e.g. 08:15) is kept as its own option.
  function chatTimeOptions(current) {
    const fmt = (v) => { const [h, m] = v.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
    const vals = [];
    for (let h = 0; h < 24; h++) for (const m of ['00', '30']) vals.push(`${String(h).padStart(2, '0')}:${m}`);
    vals.push('23:59');
    if (current && HHMM_RE.test(current) && !vals.includes(current)) vals.push(current);
    return vals.sort().map((v) => [v, v === '23:59' ? '11:59 PM (end of day)' : fmt(v)]);
  }

  async function viewSettings() {
    const { settings, secrets } = await api('/api/settings');
    const initial = Object.fromEntries(settings.map((s) => [s.key, s.value]));
    const source = (s) => s.source === 'saved' ? '' : ` (${s.source === 'env' ? 'from server config' : 'default'})`;

    const field = (s) => {
      const id = `set-${s.key}`;
      const details = esc((s.help || '') + source(s));
      switch (s.type) {
        case 'boolean':
          return `<s-switch id="${id}" name="${s.key}" label="${esc(s.label)}" details="${details}" ${s.value ? 'checked' : ''}></s-switch>`;
        case 'number':
          return `<s-number-field id="${id}" name="${s.key}" label="${esc(s.label)}" details="${details}" min="${s.min}" max="${s.max}" value="${esc(s.value)}" ${/_ms$/.test(s.key) ? 'suffix="ms"' : ''}></s-number-field>`;
        case 'email':
          return `<s-email-field id="${id}" name="${s.key}" label="${esc(s.label)}" details="${details}" value="${esc(s.value)}"></s-email-field>`;
        case 'sender_name':
          return `<s-text-field id="${id}" name="${s.key}" label="${esc(s.label)}" details="${details}" maxLength="11" value="${esc(s.value)}"></s-text-field>`;
        default:
          return `<s-text-field id="${id}" name="${s.key}" label="${esc(s.label)}" details="${details}" value="${esc(s.value)}"></s-text-field>`;
      }
    };

    const groups = Object.keys(SETTING_GROUPS).map((g) => `
      <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(16rem, 1fr))">
        <s-box padding="small-200"><s-stack gap="small-200"><s-heading>${esc(g)}</s-heading><s-paragraph color="subdued">${esc(SETTING_GROUPS[g])}</s-paragraph></s-stack></s-box>
        <s-section><s-stack gap="base">${settings.filter((s) => s.group === g).map(field).join('')}</s-stack></s-section>
      </s-grid>`).join('');

    // The chat card sits inside the page (same width as the other groups) but
    // outside the form, so its own fields never trigger the Settings save bar.
    $app.innerHTML = `<s-page heading="Settings">
      <s-stack gap="large">
        ${pageTitle('Settings')}
        <form id="settings-form" data-save-bar data-discard-confirmation>
        <s-stack gap="large">
          ${groups}
          <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(16rem, 1fr))">
            <s-box padding="small-200"><s-stack gap="small-200"><s-heading>Server secrets</s-heading>
              <s-paragraph color="subdued">Read-only. These are changed on the server by your developer, not here.</s-paragraph></s-stack></s-box>
            <s-section><s-stack gap="small">${secrets.map((x) => `<s-stack direction="inline" gap="small" alignItems="center" justifyContent="space-between">
              <s-stack gap="none"><s-text>${esc(x.label)}</s-text><s-text color="subdued"><span class="mono">${esc(x.name)}</span></s-text></s-stack>
              <s-badge tone="${x.set ? 'success' : 'neutral'}">${x.set ? 'Set' : 'Not set'}</s-badge></s-stack>`).join('')}</s-stack></s-section>
          </s-grid>
        </s-stack>
        </form>
        <div id="chat-card"></div>
      </s-stack>
    </s-page>`;

    loadChatCard();

    const form = byId('settings-form');
    const readValue = (s) => {
      const el = byId(`set-${s.key}`);
      if (s.type === 'boolean') return Boolean(el.checked);
      if (s.type === 'number') return Number(el.value);
      return String(el.value || '').trim();
    };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const values = {};
      settings.forEach((s) => { const v = readValue(s); if (v !== initial[s.key]) values[s.key] = v; byId(`set-${s.key}`).error = ''; });
      if (!Object.keys(values).length) { viewSettings(); return; }
      loading(true);
      try {
        await api('/api/settings', { method: 'PUT', body: { values } });
        toast('Settings saved');
        viewSettings();
      } catch (err) {
        // The server names fields by label: "<Label> <problem>; …"
        let matched = false;
        err.message.split('; ').forEach((part) => {
          const s = settings.find((x) => part.startsWith(x.label + ' '));
          if (s) { byId(`set-${s.key}`).error = cap(part.slice(s.label.length + 1)) + '.'; matched = true; }
        });
        toast(matched ? 'Couldn’t save: check the highlighted fields' : `Couldn’t save: ${err.message}`, true);
      } finally { loading(false); }
    });
    form.addEventListener('reset', () => setTimeout(viewSettings, 0));
  }

  // Chat card: loads on its own so a chat-service failure never breaks Settings.
  async function loadChatCard() {
    const host = byId('chat-card');
    if (!host) return;
    const wrap = (inner) => `<s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(16rem, 1fr))">
      <s-box padding="small-200"><s-stack gap="small-200"><s-heading>Chat office hours</s-heading>
        <s-paragraph color="subdued">Office hours, the away message and the unanswered-chat alert for live chat. Saved with its own button.</s-paragraph></s-stack></s-box>
      <s-section>${inner}</s-section></s-grid>`;
    host.innerHTML = wrap('<s-text color="subdued">Loading chat settings…</s-text>');
    let data;
    try {
      data = await chatClient.api('/api/agent/settings');
    } catch (err) {
      host.innerHTML = wrap(err.status === 503
        ? '<s-banner tone="warning">Chat service not configured (CHAT_API_URL / CHAT_AGENT_SECRET).</s-banner>'
        : `<s-banner tone="critical" heading="Couldn’t load chat settings">${esc(err.message)}</s-banner>`);
      if (err.status !== 503) toast(`Chat settings: ${err.message}`, true);
      return;
    }
    const bh = data.businessHours || {};
    const hours = bh.hours || {};
    const unanswered = data.unansweredMinutes ?? 10;
    // Compact week editor: Mon–Sun chips toggle open days; one time range for
    // all open days, or a short row per open day when "Different hours per day".
    const st = { open: {}, start: {}, end: {} };
    CHAT_DAYS.forEach(([k]) => {
      const h = hours[k] || {};
      st.open[k] = Boolean(h.open);
      st.start[k] = HHMM_RE.test(h.start || '') ? h.start : '08:00';
      st.end[k] = HHMM_RE.test(h.end || '') ? h.end : '17:00';
    });
    const openKeys = () => CHAT_DAYS.map(([k]) => k).filter((k) => st.open[k]);
    const firstOpen = () => openKeys()[0] || 'mon';
    st.perDay = new Set(openKeys().map((k) => `${st.start[k]}-${st.end[k]}`)).size > 1;

    const timeSelect = (id, label, value) => `<s-select id="${id}" label="${label}" labelAccessibilityVisibility="exclusive">
      ${chatTimeOptions(value).map(([v, txt]) => `<s-option value="${v}" ${v === value ? 'selected' : ''}>${txt}</s-option>`).join('')}
    </s-select>`;
    const dayChips = () => `<s-stack direction="inline" gap="small-200">${CHAT_DAYS.map(([k, label]) =>
      `<s-clickable-chip id="chat-day-${k}" color="${st.open[k] ? 'strong' : 'subdued'}"
        accessibilityLabel="${label}: ${st.open[k] ? 'open, click to close' : 'closed, click to open'}">${label.slice(0, 3)}</s-clickable-chip>`).join('')}</s-stack>`;
    const hoursBody = () => {
      if (!openKeys().length) return '<s-text color="subdued">No open days: chat shows Offline all week.</s-text>';
      if (!st.perDay) {
        const k = firstOpen();
        return `<s-stack direction="inline" gap="small" alignItems="center">
          ${timeSelect('chat-all-start', 'Opens', st.start[k])}<s-text color="subdued">to</s-text>${timeSelect('chat-all-end', 'Closes', st.end[k])}
        </s-stack>`;
      }
      return `<s-stack gap="small-200">${CHAT_DAYS.filter(([k]) => st.open[k]).map(([k, label]) =>
        `<s-stack direction="inline" gap="small" alignItems="center">
          <s-box inlineSize="3rem"><s-text>${label.slice(0, 3)}</s-text></s-box>
          ${timeSelect(`chat-${k}-start`, `${label} opens`, st.start[k])}<s-text color="subdued">to</s-text>${timeSelect(`chat-${k}-end`, `${label} closes`, st.end[k])}
        </s-stack>`).join('')}</s-stack>`;
    };
    // Copy the visible selects into st before any re-render.
    const readHours = () => {
      if (!st.perDay) {
        const a = byId('chat-all-start'), b = byId('chat-all-end');
        if (a && b) CHAT_DAYS.forEach(([k]) => { st.start[k] = a.value; st.end[k] = b.value; });
      } else {
        openKeys().forEach((k) => {
          const a = byId(`chat-${k}-start`), b = byId(`chat-${k}-end`);
          if (a) st.start[k] = a.value;
          if (b) st.end[k] = b.value;
        });
      }
    };
    const renderWeek = () => {
      byId('chat-week').innerHTML = `<s-stack gap="small">
        ${dayChips()}
        ${hoursBody()}
        ${openKeys().length > 1 ? `<s-switch id="chat-perday" label="Different hours per day" ${st.perDay ? 'checked' : ''}></s-switch>` : ''}
        <s-text id="chat-hours-error" tone="critical"></s-text>
      </s-stack>`;
      CHAT_DAYS.forEach(([k]) => on(`chat-day-${k}`, 'click', () => {
        readHours();
        st.open[k] = !st.open[k];
        if (st.open[k] && !st.perDay) { const f = openKeys().find((x) => x !== k); if (f) { st.start[k] = st.start[f]; st.end[k] = st.end[f]; } }
        renderWeek();
      }));
      on('chat-perday', 'change', (e) => {
        readHours();
        st.perDay = Boolean(e.currentTarget.checked);
        if (!st.perDay) { const f = firstOpen(); CHAT_DAYS.forEach(([k]) => { st.start[k] = st.start[f]; st.end[k] = st.end[f]; }); }
        renderWeek();
      });
    };

    host.innerHTML = wrap(`<s-stack gap="base">
      <s-switch id="chat-enabled" label="Use office hours" details="When off, chat is treated as always open." ${bh.enabled === false ? '' : 'checked'}></s-switch>
      <s-stack gap="small-200">
        <s-text type="strong">Open days and hours</s-text>
        <div id="chat-week"></div>
        ${bh.timezone ? `<s-text color="subdued">Timezone: <span class="mono">${esc(bh.timezone)}</span></s-text>` : ''}
      </s-stack>
      <s-text-area id="chat-away" label="Away message" rows="3" maxLength="1000" value="${esc(bh.awayMessage || '')}"></s-text-area>
      <s-number-field id="chat-unanswered" label="Alert when unanswered for (minutes)" min="1" max="240" value="${esc(unanswered)}"></s-number-field>
      <s-stack direction="inline"><s-button id="chat-save" variant="primary">Save chat settings</s-button></s-stack>
    </s-stack>`);
    renderWeek();

    on('chat-save', 'click', async () => {
      const btn = byId('chat-save');
      readHours();
      const body = { enabled: Boolean(byId('chat-enabled').checked), awayMessage: String(byId('chat-away').value || ''), hours: {} };
      const badDay = openKeys().find((k) => !(HHMM_RE.test(st.start[k]) && HHMM_RE.test(st.end[k]) && st.start[k] < st.end[k]));
      CHAT_DAYS.forEach(([k]) => { body.hours[k] = { open: st.open[k], start: st.start[k], end: st.end[k] }; });
      const errEl = byId('chat-hours-error');
      if (errEl) errEl.textContent = badDay ? `${CHAT_DAYS.find(([k]) => k === badDay)[1]}: closing time must be after opening time.` : '';
      const mins = Number(byId('chat-unanswered').value);
      const minsOk = Number.isInteger(mins) && mins >= 1 && mins <= 240;
      byId('chat-unanswered').error = minsOk ? '' : 'Enter a whole number from 1 to 240';
      if (badDay || !minsOk) { toast('Couldn’t save: check the highlighted fields', true); return; }
      btn.disabled = true; loading(true);
      try {
        await chatClient.api('/api/agent/settings', { method: 'PUT', body: { businessHours: body, unansweredMinutes: mins } });
        toast('Chat settings saved');
      } catch (err) {
        toast(`Couldn’t save chat settings: ${err.message}`, true);
      } finally { btn.disabled = false; loading(false); }
    });
  }

  // ── Chats (live agent inbox) ───────────────────────────────────────────────
  // REST (chatClient.api) loads lists and history; the agent WebSocket
  // (chat-connection.js) brings live events. Everything a customer typed
  // (names, emails, messages) is untrusted: always esc().
  const CHAT_ID_RE = /^[0-9a-f-]{36}$/;
  const CHAT_FILTERS = [['open', 'Open'], ['unanswered', 'Unanswered'], ['closed', 'Closed']];
  const CHAT_TYPING_SHOW_MS = 5000;
  const CHAT_TYPING_THROTTLE_MS = 3000;
  const CHAT_MAX_TEXT = 2000;

  // Chat service timestamps are 'YYYY-MM-DD HH:MM:SS(.sss)' UTC without a zone.
  function chatTime(v) {
    if (!v) return null;
    let s = String(v);
    if (/^\d{4}-\d{2}-\d{2} /.test(s)) s = s.replace(' ', 'T');
    if (!/(Z|[+-]\d{2}:?\d{2})$/.test(s)) s += 'Z';
    const t = Date.parse(s);
    return Number.isNaN(t) ? null : t;
  }
  function chatAgo(v) {
    const t = chatTime(v);
    if (t === null) return '';
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return 'now';
    if (s < 3600) return `${Math.floor(s / 60)}m`;
    if (s < 86400) return `${Math.floor(s / 3600)}h`;
    const d = new Date(t);
    if (s < 6 * 86400) return d.toLocaleDateString('en-US', { weekday: 'short' });
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  const isAgentRole = (role) => role === 'agent' || role === 'assistant';

  async function viewChats(sessionId) {
    const st = {
      convs: new Map(),        // id → Conversation (every one we have seen)
      filter: 'open',
      q: '',
      searchIds: null,         // ids from the last search (null = no search)
      selected: null,
      messages: [],            // thread of the selected conversation
      drafts: new Map(),       // per-conversation composer text
      typingTimer: null,
      lastTypingSent: 0,
      wasOffline: false,
      loadSeq: 0,
      listSeq: 0,
      preview: null,           // { url, data, error, loading } for the composer link
      dismissedPreviews: new Set(), // URLs whose preview the agent removed
      previewSeq: 0,
    };
    const initial = sessionId && CHAT_ID_RE.test(sessionId) ? sessionId : null;

    const upsert = (c) => { if (c && typeof c.id === 'string' && CHAT_ID_RE.test(c.id)) st.convs.set(c.id, c); };
    const listUrl = (status, q = '') => `/api/agent/conversations?status=${status}&limit=200${q ? `&q=${encodeURIComponent(q.slice(0, 100))}` : ''}`;

    // First load: open + unanswered, so the counts and the badge are right.
    let open, unans;
    try {
      [open, unans] = await Promise.all([chatClient.api(listUrl('open')), chatClient.api(listUrl('unanswered'))]);
    } catch (err) {
      const msg = err.status === 503
        ? '<s-section><s-banner tone="warning" heading="Chat service not configured">Set CHAT_API_URL and CHAT_AGENT_SECRET in the server .env.</s-banner></s-section>'
        : errorSection(`Chat service is offline. ${err.message}`);
      $app.innerHTML = `<s-page heading="Chats"><s-stack gap="base">${pageTitle('Chats')}${msg}</s-stack></s-page>`;
      on('retry-load', 'click', () => location.reload());
      return;
    }
    (open.conversations || []).forEach(upsert);
    (unans.conversations || []).forEach(upsert);

    $app.innerHTML = `<s-page heading="Chats">
      <s-stack gap="base">
      ${pageTitle('Chats', '<span id="chat-unans"></span>')}
      <div id="chat-offline" hidden><s-banner tone="critical">Chat service is offline. Reconnecting…</s-banner></div>
      <s-section padding="none">
        <div class="chat-grid" id="chat-grid" data-view="${initial ? 'thread' : 'list'}">
          <div class="chat-pane chat-list">
            <div class="chat-bar"><s-box padding="small-200"><s-stack gap="small-200">
              <s-button-group gap="none" id="chat-filters"></s-button-group>
              <s-search-field id="chat-search" label="Search chats" labelAccessibilityVisibility="exclusive" placeholder="Search name, email, phone" maxLength="100"></s-search-field>
            </s-stack></s-box></div>
            <div class="chat-scroll" id="chat-rows"></div>
          </div>
          <div class="chat-pane chat-thread">
            <div class="chat-bar"><s-box padding="small-200" id="chat-head"></s-box></div>
            <div class="chat-scroll"><div class="chat-msgs" id="chat-msgs"></div></div>
            <s-box paddingInline="small-200"><s-text color="subdued" id="chat-typing"></s-text></s-box>
            <div class="chat-bar-top"><s-box padding="small-200">
              <div id="chat-preview"></div>
              <s-grid gridTemplateColumns="1fr auto" gap="small-200" alignItems="end">
                <s-text-area id="chat-input" label="Reply" labelAccessibilityVisibility="exclusive" rows="2" maxLength="${CHAT_MAX_TEXT}" placeholder="Type a reply… (Enter to send, Shift+Enter for a new line)" disabled></s-text-area>
                <s-button id="chat-send" variant="primary" disabled>Send</s-button>
              </s-grid>
            </s-box></div>
          </div>
          <div class="chat-pane chat-details"><div class="chat-scroll"><s-box padding="base" id="chat-details"></s-box></div></div>
        </div>
      </s-section>
      </s-stack>
    </s-page>`;

    const $grid = byId('chat-grid');
    const $rows = byId('chat-rows');
    const $msgs = byId('chat-msgs');
    const $input = byId('chat-input');
    const $send = byId('chat-send');
    const $typing = byId('chat-typing');
    const showPane = (v) => { $grid.dataset.view = v; };

    // ── List ──
    const inFilter = (c) => (st.filter === 'unanswered' ? c.unanswered : c.status === st.filter);
    function renderCounts() {
      const all = [...st.convs.values()];
      const nUnans = all.filter((c) => c.unanswered).length;
      const nOpen = all.filter((c) => c.status === 'open').length;
      byId('chat-unans').innerHTML = nUnans ? `<s-badge tone="attention">${esc(num(nUnans))} unanswered</s-badge>` : '';
      const counts = { open: nOpen, unanswered: nUnans };
      byId('chat-filters').innerHTML = CHAT_FILTERS.map(([key, label]) =>
        `<s-button data-chat-filter="${key}" variant="${st.filter === key ? 'primary' : 'secondary'}">${esc(label)}${counts[key] ? ` ${esc(num(counts[key]))}` : ''}</s-button>`).join('');
    }
    function renderRows() {
      renderCounts();
      let list = [...st.convs.values()].filter(inFilter);
      if (st.searchIds) list = list.filter((c) => st.searchIds.has(c.id));
      list.sort((a, b) => (chatTime(b.lastActive) || 0) - (chatTime(a.lastActive) || 0));
      if (!list.length) {
        $rows.innerHTML = `<s-box padding="base"><s-text color="subdued">${st.q ? 'No chats match your search.' : `No ${st.filter} chats.`}</s-text></s-box>`;
        return;
      }
      $rows.innerHTML = list.map((c) => `<div class="chat-row">
        <s-clickable data-chat-id="${esc(c.id)}" padding="small-200" background="${c.id === st.selected ? 'subdued' : 'transparent'}" accessibilityLabel="Open chat with ${esc(c.displayName)}">
          <s-stack direction="inline" gap="small-200" justifyContent="space-between" alignItems="start">
            <s-stack gap="none">
              <s-stack direction="inline" gap="small-200" alignItems="center">
                <s-text type="strong">${esc(c.displayName)}</s-text>
                ${c.unread ? '<s-badge tone="attention">New</s-badge>' : ''}
              </s-stack>
              <s-text color="subdued"><span class="cell-one">${esc(c.lastMessage || '')}</span></s-text>
            </s-stack>
            <s-text color="subdued"><span class="nowrap" title="${esc(fmtDate(chatTime(c.lastActive)))}">${esc(chatAgo(c.lastActive))}</span></s-text>
          </s-stack>
        </s-clickable></div>`).join('');
    }
    async function loadList() {
      const seq = ++st.listSeq;
      const q = st.q;
      try {
        const r = await chatClient.api(listUrl(st.filter, q));
        if (seq !== st.listSeq) return;
        const got = r.conversations || [];
        got.forEach(upsert);
        st.searchIds = q ? new Set(got.map((c) => c.id)) : null;
        renderRows();
      } catch (err) {
        if (seq === st.listSeq) toast(`Couldn’t load chats: ${err.message}`, true);
      }
    }

    // ── Thread ──
    const current = () => (st.selected ? st.convs.get(st.selected) : null);
    function renderHead() {
      const c = current();
      const $head = byId('chat-head');
      if (!c) {
        $head.innerHTML = '<s-text color="subdued">Select a chat</s-text>';
        $input.disabled = true; $send.disabled = true;
        return;
      }
      const closed = c.status === 'closed';
      $head.innerHTML = `<s-stack direction="inline" gap="small-200" justifyContent="space-between" alignItems="center">
        <s-stack direction="inline" gap="small-200" alignItems="center">
          <span class="chat-mobile"><s-button id="chat-back" variant="tertiary" icon="arrow-left" accessibilityLabel="Back to chats"></s-button></span>
          <s-text type="strong">${esc(c.displayName)}</s-text>
          ${c.online ? '<s-badge tone="success">Online</s-badge>' : ''}
          ${closed ? '<s-badge>Closed</s-badge>' : ''}
        </s-stack>
        <s-stack direction="inline" gap="small-200">
          <span class="chat-mobile"><s-button id="chat-show-details" variant="tertiary">Details</s-button></span>
          <s-button id="chat-toggle">${closed ? 'Reopen' : 'Close chat'}</s-button>
        </s-stack>
      </s-stack>`;
      $input.disabled = false;
      $send.disabled = closed;
      on('chat-back', 'click', () => showPane('list'));
      on('chat-show-details', 'click', () => showPane('details'));
      on('chat-toggle', 'click', () => {
        if (!conn.send({ type: closed ? 'reopen' : 'close', sessionId: c.id })) toast('Chat service is offline', true);
      });
    }
    // Product link preview (Admin API data, re-validated by the chat service).
    const pvPrice = (p) => (p.price ? `${p.currency === 'PHP' || !p.currency ? '₱' : `${p.currency} `}${Number(p.price).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : '');
    function previewCard(p, { removable = false, note = '' } = {}) {
      const img = /^https:\/\/cdn\.shopify\.com\//.test(String(p.image || '')) ? `<img class="chat-pv-img" src="${esc(p.image)}" alt="">` : '';
      const link = /^https:\/\//.test(String(p.url || '')) ? p.url : '';
      return `<s-box padding="small-200" borderRadius="base" border="base" background="base">
        <s-stack direction="inline" gap="small" alignItems="center">
          ${img}
          <div class="chat-pv-text" style="flex:1">
            <s-stack gap="none">
              ${link ? `<s-link href="${esc(link)}" target="_blank"><span class="cell-one">${esc(p.title || link)}</span></s-link>` : `<s-text type="strong">${esc(p.title || '')}</s-text>`}
              ${pvPrice(p) ? `<s-text>${esc(pvPrice(p))}</s-text>` : ''}
              ${note ? `<s-text color="subdued">${esc(note)}</s-text>` : ''}
            </s-stack>
          </div>
          ${removable ? '<s-button id="chat-preview-remove" variant="tertiary" icon="x" accessibilityLabel="Remove preview"></s-button>' : ''}
        </s-stack></s-box>`;
    }
    // First product link in a message ("https://…/products/…"), trailing punctuation dropped.
    // The server decides whether it is a store link (400 otherwise).
    const PRODUCT_LINK_RE = /https:\/\/[^\s<>"]+\/products\/[^\s<>"]+/i;
    const productLinkIn = (text) => { const m = PRODUCT_LINK_RE.exec(String(text || '')); return m ? m[0].replace(/[.,!?;:)'"]+$/, '') : null; };
    // Customer messages: Gateway builds its own card (Admin API), never trusting the
    // widget. Skipped when the customer removed the card (hidePreview). One lookup per link.
    const userPreviews = new Map(); // url → Promise<preview|null>
    const userPreview = (url) => {
      if (!userPreviews.has(url)) {
        userPreviews.set(url, api(`/api/chat/link-preview?url=${encodeURIComponent(url)}`).then((r) => r.preview || null).catch(() => null));
      }
      return userPreviews.get(url);
    };
    function fillUserPreviews() {
      $msgs.querySelectorAll('[data-pv-url]').forEach((el) => {
        const url = el.dataset.pvUrl;
        el.removeAttribute('data-pv-url');
        userPreview(url).then((p) => { if (p && el.isConnected) { el.innerHTML = previewCard(p); scrollThread(false); } });
      });
    }
    const msgHtml = (m) => {
      const agent = isAgentRole(m.role);
      const userLink = !agent && !m.hidePreview ? productLinkIn(m.content) : null;
      return `<div class="chat-msg ${agent ? 'from-agent' : 'from-user'}">
        <s-box padding="small-200" borderRadius="large" background="${agent ? 'strong' : 'base'}" border="base">
          <s-stack gap="none">
            <s-text><span class="prewrap">${esc(m.content)}</span></s-text>
            ${m.preview ? previewCard(m.preview) : ''}
            ${userLink ? `<div data-pv-url="${esc(userLink)}"></div>` : ''}
            <s-text color="subdued"><span class="nowrap">${esc(agent ? 'Mediko Support · ' : '')}${esc(fmtShort(chatTime(m.created_at)))}</span></s-text>
          </s-stack>
        </s-box></div>`;
    };
    const shownRole = (m) => m && (m.role === 'user' || isAgentRole(m.role));
    function scrollThread(force) {
      const box = $msgs.parentElement;
      const near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
      if (force || near) box.scrollTop = box.scrollHeight;
    }
    function renderMessages() {
      const list = st.messages.filter(shownRole);
      $msgs.innerHTML = list.length ? list.map(msgHtml).join('') : '<s-text color="subdued">No messages yet.</s-text>';
      scrollThread(true);
      fillUserPreviews();
    }
    function appendMessage(m) {
      if (!shownRole(m)) return;
      if (m.id && st.messages.some((x) => x.id === m.id)) return;
      const wasEmpty = !st.messages.some(shownRole);
      st.messages.push(m);
      if (wasEmpty) { renderMessages(); return; }
      $msgs.insertAdjacentHTML('beforeend', msgHtml(m));
      scrollThread(isAgentRole(m.role));
      fillUserPreviews();
    }
    // Fetched history + in-memory messages (live events that arrived during a
    // fetch), deduped by id, oldest first; ties keep server order.
    function mergeMessages(fetched, live) {
      const out = Array.isArray(fetched) ? fetched.filter(Boolean) : [];
      const ids = new Set(out.map((m) => m.id).filter(Boolean));
      (live || []).forEach((m) => {
        if (!m) return;
        if (m.id && ids.has(m.id)) return;
        if (m.id) ids.add(m.id);
        out.push(m);
      });
      const at = (m) => chatTime(m.created_at) ?? Number.MAX_SAFE_INTEGER;
      return out.map((m, i) => [m, i]).sort((a, b) => (at(a[0]) - at(b[0])) || (a[1] - b[1])).map(([m]) => m);
    }
    function hideTyping() { clearTimeout(st.typingTimer); st.typingTimer = null; $typing.textContent = ''; }

    // ── Details ──
    async function renderDetails() {
      const c = current();
      const $d = byId('chat-details');
      if (!c) { $d.innerHTML = ''; return; }
      const id = c.id;
      const email = c.email || '';
      $d.innerHTML = `<s-stack gap="base">
        <span class="chat-mobile"><s-button id="chat-details-back" variant="tertiary" icon="arrow-left">Back to chat</s-button></span>
        <s-stack gap="small-200">
          <s-heading>Customer</s-heading>
          <s-text>${esc(c.displayName)}</s-text>
          ${email ? `<s-link href="mailto:${esc(email)}">${esc(email)}</s-link>` : '<s-text color="subdued">No email</s-text>'}
          ${c.phone ? `<s-link href="tel:${esc(c.phone)}">${esc(fmtPhone(c.phone))}</s-link>` : '<s-text color="subdued">No phone</s-text>'}
        </s-stack>
        <s-divider></s-divider>
        <s-stack gap="small-200"><s-heading>Shopify</s-heading><div id="chat-shopify"><s-text color="subdued">${email ? 'Looking up…' : 'No email to look up.'}</s-text></div></s-stack>
        <s-divider></s-divider>
        <s-stack gap="small-200"><s-heading>Orders</s-heading><div id="chat-orders"><s-text color="subdued">Loading orders…</s-text></div></s-stack>
        <s-divider></s-divider>
        <s-stack gap="small-200"><s-heading>Offline replies</s-heading><s-text color="subdued">Replies are emailed if the customer is offline.</s-text></s-stack>
      </s-stack>`;
      on('chat-details-back', 'click', () => showPane('thread'));
      loadOrders(id);
      if (!email) return;
      let html;
      try {
        const r = await cachedApi(`/api/chat/customer?email=${encodeURIComponent(email)}`);
        const cu = r.customer;
        if (!cu) html = '<s-text color="subdued">No Shopify customer with this email.</s-text>';
        else {
          const link = /^https:\/\//.test(String(cu.adminUrl || '')) ? `<s-link href="${esc(cu.adminUrl)}" target="_blank">View customer</s-link>` : '';
          html = `<s-text>${esc(plural(Number(cu.ordersCount) || 0, 'order'))}${cu.lastOrderName ? ` · last ${esc(cu.lastOrderName)}` : ''}</s-text>${link}`;
        }
      } catch (err) {
        html = `<s-text color="subdued">${esc(err.status === 503 ? 'Shopify not configured.' : `Lookup failed: ${err.message}`)}</s-text>`;
      }
      const host = byId('chat-shopify');
      if (host && st.selected === id) host.innerHTML = `<s-stack gap="small-200">${html}</s-stack>`;
    }

    // Shopify lookups for the details pane are cached for a minute: opening a chat
    // renders the pane twice, and switching back and forth shouldn't re-query.
    const lookupCache = new Map(); // url → { at, promise }
    function cachedApi(url, ttlMs = 60000) {
      const hit = lookupCache.get(url);
      if (hit && Date.now() - hit.at < ttlMs) return hit.promise;
      const promise = api(url).catch((err) => { lookupCache.delete(url); throw err; });
      lookupCache.set(url, { at: Date.now(), promise });
      return promise;
    }

    // ── Orders (details pane) ──
    // The customer's recent orders (by chat email) plus any order number they
    // wrote in the chat ("#1042", "order 1042"). "Insert status" drafts a reply.
    const ORDER_STATE = {
      processing: ['Processing', 'neutral'], shipped: ['Shipped', 'info'], delivered: ['Delivered', 'success'],
      partially_shipped: ['Partially shipped', 'attention'], cancelled: ['Cancelled', 'critical'],
    };
    const orderReplies = new Map(); // button id → reply text
    function mentionedOrderNumber() {
      for (let i = st.messages.length - 1; i >= 0; i--) {
        const m = st.messages[i];
        if (m && m.role === 'user') { const n = window.findOrderNumber(m.content); if (n) return n; }
      }
      return null;
    }
    function orderHtml(o, mentioned) {
      const [label, tone] = ORDER_STATE[o.state] || ORDER_STATE.processing;
      const t = (o.tracking || []).find((x) => x.number || x.url);
      const trackUrl = t && /^https:\/\//.test(String(t.url || '')) ? t.url : '';
      const btnId = `order-reply-${orderReplies.size}`;
      orderReplies.set(btnId, o.reply || '');
      return `<s-box padding="small-200" borderRadius="base" border="base" ${mentioned ? 'background="subdued"' : ''}>
        <s-stack gap="small-200">
          <s-stack direction="inline" gap="small-200" alignItems="center">
            <s-text type="strong">${esc(o.name)}</s-text>
            <s-badge tone="${tone}">${esc(label)}</s-badge>
            ${mentioned ? '<s-badge tone="info">Mentioned</s-badge>' : ''}
          </s-stack>
          <s-text color="subdued">${esc(fmtShort(Date.parse(o.createdAt)))}${o.financialStatus ? ` · ${esc(o.financialStatus.replace(/_/g, ' ').toLowerCase())}` : ''}</s-text>
          ${t ? `<s-text>${esc(t.company || 'Carrier')}${t.number ? ` · <span class="mono">${esc(t.number)}</span>` : ''}</s-text>` : ''}
          ${trackUrl ? `<s-link href="${esc(trackUrl)}" target="_blank">Track shipment</s-link>` : ''}
          ${o.reply ? `<s-button id="${btnId}" variant="tertiary">Insert status</s-button>` : ''}
        </s-stack></s-box>`;
    }
    async function loadOrders(id) {
      const c = st.convs.get(id);
      const host = byId('chat-orders');
      if (!c || !host) return;
      const email = c.email || '';
      const mentioned = mentionedOrderNumber();
      let list = [], extra = null, err = null;
      try {
        if (email) list = (await cachedApi(`/api/chat/orders?email=${encodeURIComponent(email)}`)).orders || [];
        const inList = mentioned && list.some((o) => String(o.name).replace(/\D/g, '') === mentioned);
        if (mentioned && !inList) extra = (await cachedApi(`/api/chat/order?number=${encodeURIComponent(mentioned)}`)).order || null;
      } catch (e) { err = e; }
      const box = byId('chat-orders');
      if (!box || st.selected !== id) return;
      orderReplies.clear();
      if (err) { box.innerHTML = `<s-text color="subdued">${esc(err.status === 503 ? 'Shopify not configured.' : `Lookup failed: ${err.message}`)}</s-text>`; return; }
      const isMentioned = (o) => mentioned && String(o.name).replace(/\D/g, '') === mentioned;
      const parts = [];
      if (extra) parts.push(`<s-text color="subdued">Mentioned in this chat</s-text>${orderHtml(extra, true)}`);
      else if (mentioned && !list.some(isMentioned)) parts.push(`<s-text color="subdued">Order #${esc(mentioned)} was mentioned but not found.</s-text>`);
      list.forEach((o) => parts.push(orderHtml(o, isMentioned(o))));
      box.innerHTML = parts.length ? `<s-stack gap="small-200">${parts.join('')}</s-stack>`
        : `<s-text color="subdued">${email ? 'No orders for this email.' : 'No email to look up.'}</s-text>`;
      orderReplies.forEach((text, btnId) => on(btnId, 'click', () => {
        const cur = String($input.value || '').trim();
        $input.value = cur ? `${cur}\n${text}` : text;
        $input.focus();
        schedulePreview();
      }));
    }

    // ── Selecting a conversation ──
    async function select(id, { fromDeepLink = false } = {}) {
      if (!CHAT_ID_RE.test(id)) return;
      if (st.selected) st.drafts.set(st.selected, $input.value || '');
      st.selected = id;
      $input.value = st.drafts.get(id) || '';
      resetPreview(); schedulePreview();
      st.lastTypingSent = 0;
      hideTyping();
      history.replaceState(null, '', `${BASE}/chats/${id}`);
      showPane('thread');
      const seq = ++st.loadSeq;
      st.messages = [];
      $msgs.innerHTML = '<s-spinner accessibilityLabel="Loading chat"></s-spinner>';
      renderHead(); renderRows(); renderDetails();
      try {
        const r = await chatClient.api(`/api/agent/conversations/${id}`);
        if (seq !== st.loadSeq) return;
        upsert(r.conversation);
        // Live events that arrived during the fetch are kept (appendMessage dedupes by id).
        st.messages = mergeMessages(r.messages, st.messages);
        if (fromDeepLink && r.conversation?.status === 'closed') { st.filter = 'closed'; loadList(); }
        renderMessages(); renderHead(); renderRows(); renderDetails();
        markSeen(id);
      } catch (err) {
        if (seq !== st.loadSeq) return;
        $msgs.innerHTML = `<s-banner tone="critical">${esc(err.status === 404 ? 'This chat doesn’t exist.' : `Couldn’t load this chat: ${err.message}`)}</s-banner>`;
        if (err.status === 404) { st.selected = null; history.replaceState(null, '', `${BASE}/chats`); renderHead(); renderRows(); renderDetails(); }
      }
    }

    // ── Composer link preview (WhatsApp-style) ──
    // The first store product link in the draft gets a preview card above the
    // box; × removes it (and it stays removed for that link). It is sent with the reply.
    const $preview = byId('chat-preview');
    const draftLink = () => productLinkIn($input.value);
    function renderPreview() {
      const pv = st.preview;
      if (!pv) { $preview.innerHTML = ''; return; }
      if (pv.loading) { $preview.innerHTML = '<s-box paddingBlockEnd="small-200"><s-text color="subdued">Loading link preview…</s-text></s-box>'; return; }
      $preview.innerHTML = `<s-box paddingBlockEnd="small-200">${pv.data
        ? previewCard(pv.data, { removable: true, note: 'Preview will be sent with your reply' })
        : previewCard({ title: 'No preview', url: '' }, { removable: true, note: pv.error })}</s-box>`;
      on('chat-preview-remove', 'click', () => { st.dismissedPreviews.add(pv.url); st.preview = null; renderPreview(); });
    }
    async function refreshPreview() {
      const url = draftLink();
      if (!url || st.dismissedPreviews.has(url)) { if (st.preview) { st.preview = null; renderPreview(); } return; }
      if (st.preview && st.preview.url === url) return;
      const seq = ++st.previewSeq;
      st.preview = { url, loading: true };
      renderPreview();
      let next = null;
      try {
        const r = await api(`/api/chat/link-preview?url=${encodeURIComponent(url)}`);
        next = { url, data: r.preview };
      } catch (err) {
        // 400/404: not a previewable product, so just no card. Other errors show why.
        next = err.status === 400 || err.status === 404 ? null : { url, error: err.message };
      }
      if (seq !== st.previewSeq || draftLink() !== url) return;
      st.preview = next;
      renderPreview();
    }
    let previewTimer;
    const schedulePreview = () => { clearTimeout(previewTimer); previewTimer = setTimeout(refreshPreview, 400); };
    function resetPreview() { clearTimeout(previewTimer); st.previewSeq++; st.preview = null; renderPreview(); }

    // ── Composer ──
    function sendReply() {
      const c = current();
      const text = String($input.value || '').trim();
      if (!c || !text) return;
      if (c.status === 'closed') { toast('Reopen this chat to reply', true); return; }
      if (text.length > CHAT_MAX_TEXT) { toast(`Keep replies under ${CHAT_MAX_TEXT} characters`, true); return; }
      if (replies.isPending(c.id, text)) return; // same reply already on its way
      const clientId = replies.add(c.id, text);
      const pv = st.preview && st.preview.data && text.includes(st.preview.url) ? st.preview.data : null;
      if (!conn.send({ type: 'agent_message', sessionId: c.id, text, clientId, ...(pv && { preview: pv }) })) {
        replies.fail(clientId);
        toast('Chat service is offline. Your reply was not sent.', true);
        return;
      }
      conn.send({ type: 'typing', sessionId: c.id, value: false });
      st.lastTypingSent = 0;
      // The text stays in the composer until the server echoes agent_sent with this clientId.
    }
    // A reply was confirmed: clear it from the composer / stored draft unless the agent has edited it since.
    function clearSentDraft({ sessionId, text }) {
      if (st.selected === sessionId) {
        if (String($input.value || '').trim() === text) { $input.value = ''; resetPreview(); }
      } else if (String(st.drafts.get(sessionId) || '').trim() === text) {
        st.drafts.delete(sessionId);
      }
    }
    const replies = window.createReplyTracker({
      timeoutMs: 10000,
      onTimeout: () => toast('Reply not confirmed by the chat service. It is still in the box: check the thread before resending.', true),
    });
    $input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendReply(); }
    });
    $input.addEventListener('input', () => {
      schedulePreview();
      const c = current();
      if (!c || c.status === 'closed' || !String($input.value || '').trim()) return;
      const now = Date.now();
      if (now - st.lastTypingSent < CHAT_TYPING_THROTTLE_MS) return;
      if (conn.send({ type: 'typing', sessionId: c.id, value: true })) st.lastTypingSent = now;
    });
    $send.addEventListener('click', sendReply);

    // ── List controls ──
    $rows.addEventListener('click', (e) => {
      const el = e.target.closest('[data-chat-id]');
      if (el) select(el.dataset.chatId);
    });
    byId('chat-filters').addEventListener('click', (e) => {
      const el = e.target.closest('[data-chat-filter]');
      if (!el || el.dataset.chatFilter === st.filter) return;
      st.filter = el.dataset.chatFilter;
      renderRows();
      loadList();
    });
    let searchTimer;
    on('chat-search', 'input', (e) => {
      clearTimeout(searchTimer);
      const v = String(e.currentTarget.value || '').trim().slice(0, 100);
      searchTimer = setTimeout(() => { st.q = v; if (!v) st.searchIds = null; renderRows(); loadList(); }, 300);
    });

    // Opening a chat (or reading new messages in it) clears "New" for every agent.
    function markSeen(id) {
      const c = st.convs.get(id);
      if (!c || !c.unread || document.visibilityState !== 'visible') return;
      conn.send({ type: 'seen', sessionId: id });
    }
    document.addEventListener('visibilitychange', () => { if (st.selected) markSeen(st.selected); });

    // ── Live events ──
    function onEvent(ev) {
      const sid = typeof ev.sessionId === 'string' && CHAT_ID_RE.test(ev.sessionId) ? ev.sessionId : null;
      switch (ev.type) {
        case 'customer_message':
          upsert(ev.conversation);
          if (sid && sid === st.selected) {
            hideTyping(); appendMessage(ev.message); renderHead(); markSeen(sid);
            if (window.findOrderNumber(ev.message && ev.message.content)) loadOrders(sid);
          }
          renderRows();
          break;
        case 'agent_sent': {
          const mine = typeof ev.clientId === 'string' ? replies.confirm(ev.clientId) : null;
          if (mine) clearSentDraft(mine);
          if (sid && sid === st.selected) appendMessage(ev.message);
          break;
        }
        case 'session_updated': {
          const prev = sid ? st.convs.get(sid) : null;
          upsert(ev.conversation);
          if (sid && sid === st.selected) {
            renderHead();
            if (prev && (prev.email !== ev.conversation?.email || prev.phone !== ev.conversation?.phone || prev.displayName !== ev.conversation?.displayName)) renderDetails();
          }
          renderRows();
          break;
        }
        case 'customer_typing':
          if (sid && sid === st.selected) {
            const c = current();
            $typing.textContent = `${c ? c.displayName : 'Customer'} is typing…`;
            clearTimeout(st.typingTimer);
            st.typingTimer = setTimeout(hideTyping, CHAT_TYPING_SHOW_MS);
          }
          break;
        case 'error': {
          const failed = typeof ev.clientId === 'string' ? replies.fail(ev.clientId) : null;
          toast(`Chat: ${String(ev.message || 'error').slice(0, 200)}${failed ? '. Your reply is still in the box.' : ''}`, true);
          break;
        }
        default: break;
      }
    }
    // Missed events while offline: reload lists and the open thread on reconnect.
    async function resync() {
      try {
        const [o, u] = await Promise.all([chatClient.api(listUrl('open')), chatClient.api(listUrl('unanswered'))]);
        const keep = current();
        st.convs.clear();
        if (keep) upsert(keep);
        (o.conversations || []).forEach(upsert);
        (u.conversations || []).forEach(upsert);
        renderRows();
        if (st.filter === 'closed' || st.q) loadList();
        if (st.selected) {
          // Same stale-response guard as select(): drop it if the agent switched chats.
          const id = st.selected;
          const seq = ++st.loadSeq;
          const r = await chatClient.api(`/api/agent/conversations/${id}`);
          if (seq !== st.loadSeq || st.selected !== id) return;
          upsert(r.conversation);
          st.messages = mergeMessages(r.messages, st.messages);
          renderMessages(); renderHead(); renderRows();
        }
      } catch (err) {
        toast(`Couldn’t refresh chats: ${err.message}`, true);
      }
    }
    const conn = window.createChatConnection({
      getToken: () => chatClient.token(true), // fresh agent JWT for every (re)connect
      onEvent,
      onStatus: (s) => {
        byId('chat-offline').hidden = s !== 'offline';
        if (s === 'offline' && replies.failAll().length) toast('Connection lost before your reply was confirmed. It is still in the box: check the thread before resending.', true);
        if (s === 'online' && st.wasOffline) resync();
        if (s === 'online' && st.selected) markSeen(st.selected); // a deep link loads before the socket is up
        st.wasOffline = s === 'offline';
      },
    });
    setInterval(renderRows, 60000); // keep relative times fresh

    renderRows(); renderHead(); renderDetails();
    if (initial) select(initial, { fromDeepLink: true });
  }

  route();
  </script>
</body>
</html>
