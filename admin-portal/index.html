  // ── Blasts ─────────────────────────────────────────────────────────────────
  const BLAST_API = { email: '/api/blasts', sms: '/api/sms-blasts' };

  async function viewBlastList(kind) {
    const isSms = kind === 'sms';
    const page = Math.max(1, parseInt(qs().get('page'), 10) || 1);
    const [list, optouts] = await Promise.all([
      api(`${BLAST_API[kind]}?limit=20&page=${page}`),
      isSms ? api('/api/sms-optouts') : Promise.resolve(null),
    ]);
    const meta = list.metadata;
    const rows = list.data.map((b) => {
      const sent = Number(b.sent), failed = Number(b.failed), skipped = Number(b.skipped);
      return `<s-table-row clickDelegate="blast-link-${b.id}">
        <s-table-cell><s-link id="blast-link-${b.id}" href="${BASE}/blasts/${kind}/${b.id}">${esc(isSms ? b.title : b.subject)}</s-link></s-table-cell>
        <s-table-cell>${esc(b.created_by || 'admin')}</s-table-cell>
        <s-table-cell>${dateCell(b.created_at)}</s-table-cell>
        <s-table-cell>${badge(b.status)}</s-table-cell>
        <s-table-cell><s-stack gap="none"><s-text>${num(sent)} / ${num(b.total)} sent</s-text>
          <s-text color="subdued">${num(failed)} failed · ${num(skipped)} skipped</s-text></s-stack></s-table-cell>
      </s-table-row>`;
    }).join('');

    const history = list.data.length
      ? `<s-section padding="none"><s-table id="blast-table" paginate ${meta.current_page < meta.total_pages ? 'hasNextPage' : ''} ${meta.current_page > 1 ? 'hasPreviousPage' : ''}>
          <s-table-header-row>
            <s-table-header listSlot="primary">${isSms ? 'Title' : 'Subject'}</s-table-header>
            <s-table-header>Started by</s-table-header><s-table-header>Started</s-table-header>
            <s-table-header listSlot="inline">Status</s-table-header><s-table-header>Progress</s-table-header>
          </s-table-header-row><s-table-body>${rows}</s-table-body></s-table></s-section>`
      : emptyState(isSms ? 'No SMS blasts yet' : 'No email blasts yet',
          isSms ? 'Text approved customers about promos and stock.' : 'Send one email to many customers at once.',
          `<s-button variant="primary" href="${BASE}/blasts/${kind}/new">Create ${isSms ? 'SMS' : 'email'} blast</s-button>`);

    const optoutSection = isSms ? `<s-section heading="Opt-out list">
        <s-stack gap="base">
          <s-text color="subdued">These numbers never get blasts. Shipping texts still go out.</s-text>
          ${optouts.data.length ? `<s-table variant="list"><s-table-header-row>
              <s-table-header listSlot="primary">Number</s-table-header><s-table-header>Note</s-table-header>
              <s-table-header>Added</s-table-header><s-table-header><span style="position:absolute;left:-9999px">Remove</span></s-table-header>
            </s-table-header-row><s-table-body>${optouts.data.map((o) => `<s-table-row>
              <s-table-cell>${phoneCell(o.phone)}</s-table-cell><s-table-cell>${esc(o.note || '—')}</s-table-cell>
              <s-table-cell>${dateCell(o.created_at)}</s-table-cell>
              <s-table-cell><s-button variant="tertiary" tone="critical" data-remove-optout="${esc(o.phone)}">Remove</s-button></s-table-cell>
            </s-table-row>`).join('')}</s-table-body></s-table>`
            : '<s-text color="subdued">No opted-out numbers.</s-text>'}
        </s-stack></s-section>` : '';

    $app.innerHTML = `<s-page heading="Email/SMS Blasts">
      <s-button slot="primary-action" variant="primary" href="${BASE}/blasts/${kind}/new">Create ${isSms ? 'SMS' : 'email'} blast</s-button>
      ${isSms ? '<s-button slot="secondary-actions" commandFor="optout-modal" command="--show">Add opt-outs</s-button>' : ''}
      <s-stack gap="base">
      ${pageTitle('Email/SMS Blasts')}
      <s-stack direction="inline" gap="small-200">
        <s-button href="${BASE}/blasts/email" variant="${isSms ? 'secondary' : 'primary'}">Email</s-button>
        <s-button href="${BASE}/blasts/sms" variant="${isSms ? 'primary' : 'secondary'}">SMS</s-button>
      </s-stack>
      ${history}
      ${optoutSection}
    </s-stack></s-page>
    ${isSms ? `<s-modal id="optout-modal" heading="Add opt-outs">
      <s-stack gap="base">
        <s-text-area id="optout-phones" label="Phone numbers" rows="4" details="One per line. Add several at once."></s-text-area>
        <s-text-field id="optout-note" label="Note (optional)" maxLength="255"></s-text-field>
      </s-stack>
      <s-button slot="primary-action" variant="primary" id="optout-add">Add numbers</s-button>
      <s-button slot="secondary-actions" commandFor="optout-modal" command="--hide">Cancel</s-button>
    </s-modal>
    <s-modal id="optout-remove-modal" heading="Remove from opt-out list?">
      <s-paragraph id="optout-remove-text"></s-paragraph>
      <s-button slot="primary-action" variant="primary" tone="critical" id="optout-remove-confirm">Remove</s-button>
      <s-button slot="secondary-actions" commandFor="optout-remove-modal" command="--hide">Cancel</s-button>
    </s-modal>` : ''}`;

    wirePaging('blast-table', `/blasts/${kind}`, {}, meta);
    if (list.data.some((b) => b.status === 'sending')) setTimeout(() => { if (location.pathname.endsWith(`/blasts/${kind}`)) viewBlastList(kind); }, 4000);
    if (!isSms) return;

    on('optout-phones', 'input', () => {
      const n = byId('optout-phones').value.split(/[\n,;]+/).filter((x) => x.trim()).length;
      byId('optout-add').textContent = n ? `Add ${plural(n, 'number')}` : 'Add numbers';
    });
    on('optout-add', 'click', async (e) => {
      const f = byId('optout-phones'); f.error = '';
      const btn = e.currentTarget; btn.loading = true;
      try {
        const r = await api('/api/sms-optouts', { method: 'POST', body: { phones: f.value, note: byId('optout-note').value } });
        hideModal('optout-modal');
        toast(`Added ${plural(r.added, 'number')}${r.invalid.length ? ` · skipped ${r.invalid.length} invalid` : ''}`);
        viewBlastList('sms');
      } catch (err) { f.error = err.message; }
      finally { btn.loading = false; }
    });
    let removePhone = null;
    onAll('[data-remove-optout]', 'click', (e) => {
      removePhone = e.currentTarget.dataset.removeOptout;
      byId('optout-remove-text').textContent = `${fmtPhone(removePhone)} will get SMS blasts again.`;
      showModal('optout-remove-modal');
    });
    on('optout-remove-confirm', 'click', async () => {
      hideModal('optout-remove-modal');
      try { await api(`/api/sms-optouts/${encodeURIComponent(removePhone)}`, { method: 'DELETE' }); toast('Removed from opt-out list'); viewBlastList('sms'); }
      catch (err) { toast(`Couldn’t remove: ${err.message}`, true); }
    });
  }

  // SMS text rules, mirrored from the server: ASCII only, 160 chars = 1 credit,
  // then 153 per part, up to 3 parts (459 chars).
  const smsClean = (raw) => String(raw || '').replace(/\r?\n/g, ' ').normalize('NFKD')
    .replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E]/g, '').trim();
  function smsSegments(text) {
    const len = [...text].reduce((n, ch) => n + ('^{}\\[]~|'.includes(ch) ? 2 : 1), 0);
    return { len, parts: len <= 160 ? 1 : Math.ceil(len / 153) };
  }

  async function viewBlastCreate(kind) {
    const isSms = kind === 'sms';
    const [smsStatus, acct] = isSms
      ? await Promise.all([api('/api/sms/settings').catch(() => null), api('/api/sms/account').catch(() => null)])
      : [null, null];
    let confirmedTotal = null;

    const sources = `
      <s-choice-list id="aud-applications" label="Senior/PWD" multiple>
        <s-choice value="approved">Approved</s-choice><s-choice value="pending">Pending</s-choice><s-choice value="rejected">Rejected</s-choice>
      </s-choice-list>
      <s-choice-list id="aud-contact" label="Messages" multiple>
        <s-choice value="pending">Pending</s-choice><s-choice value="resolved">Resolved</s-choice>
      </s-choice-list>
      <s-choice-list id="aud-returns" label="Returns" multiple>
        <s-choice value="approved">Approved</s-choice><s-choice value="pending">Pending</s-choice><s-choice value="rejected">Rejected</s-choice>
      </s-choice-list>`;

    const senderBanner = isSms ? (smsStatus?.senderName
      ? `<s-banner tone="info">Only text people who agreed to hear from Mediko. Texts come from <s-text type="strong">${esc(smsStatus.senderName)}</s-text>.</s-banner>`
      : `<s-banner tone="warning" heading="No sender name approved yet">Only text people who agreed to hear from Mediko. Texts will come from Semaphore’s default sender. <s-link href="${BASE}/settings">Add one in Settings</s-link>.</s-banner>`) : '';

    $app.innerHTML = `<s-page heading="Create ${isSms ? 'SMS' : 'email'} blast">
      <s-link slot="breadcrumb-actions" href="${BASE}/blasts/${kind}">Email/SMS Blasts</s-link>
      <s-button slot="primary-action" variant="primary" id="send-blast">Send blast</s-button>
      <s-stack gap="base">
      ${pageTitle(`Create ${isSms ? 'SMS' : 'email'} blast`)}
      ${senderBanner}
      <s-section heading="Audience">
        <s-stack gap="base">
          <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(10rem, 1fr))">${sources}</s-grid>
          <s-text-area id="aud-extra" label="Extra ${isSms ? 'phone numbers' : 'email addresses'}" rows="3" details="One per line, or separated by commas."></s-text-area>
          <s-text id="aud-error" tone="critical"></s-text>
          <s-stack direction="inline" gap="base" alignItems="center"><s-button id="count-btn">Count recipients</s-button></s-stack>
          <div id="aud-result"></div>
        </s-stack>
      </s-section>
      <s-section heading="Message">
        <s-stack gap="base">
          ${isSms
            ? `<s-text-field id="b-title" label="Title" details="Only you see this. It isn’t sent." maxLength="120"></s-text-field>
               <s-text-area id="b-body" label="Message" rows="4" maxLength="459" placeholder="Mediko: Hi {{name}}! …"></s-text-area>
               <s-stack direction="inline" gap="small" alignItems="center" id="sms-counter"></s-stack>
               <s-text color="subdued">1 credit per 160 characters, up to 3. Type {{name}} for each person’s first name. Accents and emoji are removed before sending.</s-text>`
            : `<s-text-field id="b-title" label="Subject" maxLength="200"></s-text-field>
               <s-text-area id="b-body" label="Body" rows="10" details="Plain text. Type {{name}} to add each person’s name. A signature and unsubscribe link are added automatically."></s-text-area>`}
        </s-stack>
      </s-section>
      <s-section heading="Send a test">
        <s-grid gap="base" gridTemplateColumns="1fr auto" alignItems="end">
          ${isSms ? '<s-text-field id="test-to" label="Phone number" placeholder="0917 123 4567"></s-text-field>' : '<s-email-field id="test-to" label="Email"></s-email-field>'}
          <s-button id="test-btn">Send test</s-button>
        </s-grid>
      </s-section>
    </s-stack></s-page>
    <s-modal id="send-modal" heading="Send this blast?">
      <s-stack gap="small"><s-paragraph id="send-text"></s-paragraph><s-text color="subdued">This can’t be undone.</s-text></s-stack>
      <s-button slot="primary-action" variant="primary" id="send-confirm">Send blast</s-button>
      <s-button slot="secondary-actions" commandFor="send-modal" command="--hide">Cancel</s-button>
    </s-modal>`;

    const audience = () => ({
      applications: byId('aud-applications').values || [],
      contact: byId('aud-contact').values || [],
      returns: byId('aud-returns').values || [],
      extra: byId('aud-extra').value,
    });
    const content = () => isSms
      ? { title: byId('b-title').value.trim(), body: byId('b-body').value.trim() }
      : { subject: byId('b-title').value.trim(), body: byId('b-body').value.trim() };
    const credits = () => smsSegments(smsClean(byId('b-body').value).replace(/\{\{\s*name\s*\}\}/gi, 'Xxxxxxxxxx'));

    const updateCounter = () => {
      if (!isSms) return;
      const { len, parts } = credits();
      byId('sms-counter').innerHTML = `<s-text>${num(len)} characters</s-text>
        <s-badge tone="${parts > 1 ? 'warning' : 'info'}">${plural(parts, 'credit')} each</s-badge>
        ${confirmedTotal != null ? `<s-text color="subdued">≈ ${num(parts * confirmedTotal)} credits for ${plural(confirmedTotal, 'recipient')}</s-text>` : ''}
        ${parts > 1 ? '<s-text tone="warning">Over 160 characters costs more than 1 credit per person.</s-text>' : ''}`;
    };
    updateCounter();
    on('b-body', 'input', updateCounter);

    const markDirty = () => { confirmedTotal = null; byId('aud-result').innerHTML = ''; updateCounter(); };
    ['aud-applications', 'aud-contact', 'aud-returns'].forEach((id) => on(id, 'change', markDirty));
    on('aud-extra', 'input', markDirty);

    const count = async () => {
      const btn = byId('count-btn'); btn.loading = true;
      try {
        const r = await api(`${BLAST_API[kind]}/preview`, { method: 'POST', body: { audience: audience() } });
        confirmedTotal = r.total;
        const excluded = [];
        const out = isSms ? r.optedOut : r.unsubscribed;
        if (out) excluded.push(`${num(out)} ${isSms ? 'opted out' : 'unsubscribed'}`);
        if (r.invalid.length) excluded.push(`${num(r.invalid.length)} invalid ${isSms ? 'numbers' : 'emails'}`);
        byId('aud-result').innerHTML = `<s-banner tone="${r.total > r.max ? 'critical' : 'info'}" heading="${plural(r.total, 'recipient')}">
          ${excluded.length ? `${esc(excluded.reduce((a, b) => a + ', ' + b))} excluded. ` : ''}
          ${r.total > r.max ? `Over the ${num(r.max)} limit — narrow the audience. ` : ''}
          ${r.sample.length ? `${esc(r.sample.map((x) => x.full_name || (isSms ? fmtPhone(x.phone) : x.email)).join(', '))}${r.total > r.sample.length ? '…' : ''}` : ''}
        </s-banner>`;
        updateCounter();
        return r.total;
      } catch (err) { toast(`Couldn’t count: ${err.message}`, true); return null; }
      finally { btn.loading = false; }
    };
    on('count-btn', 'click', count);

    on('test-btn', 'click', async (e) => {
      const to = byId('test-to'); to.error = '';
      const c = content();
      if (!c.body || !(isSms ? c.title : c.subject)) { toast(`Write a ${isSms ? 'title' : 'subject'} and message first.`, true); return; }
      const btn = e.currentTarget; btn.loading = true;
      try {
        await api(`${BLAST_API[kind]}/test`, { method: 'POST', body: { ...c, to: to.value } });
        toast(`Test sent to ${isSms ? fmtPhone(to.value) : to.value}`);
      } catch (err) { if (err.status === 400) to.error = err.message; else toast(`Couldn’t send: ${err.message}`, true); }
      finally { btn.loading = false; }
    });

    on('send-blast', 'click', async () => {
      const c = content(); let bad = false;
      const t = byId('b-title'), b = byId('b-body'), ae = byId('aud-error');
      t.error = ''; b.error = ''; ae.textContent = '';
      if (!(isSms ? c.title : c.subject)) { t.error = `Enter a ${isSms ? 'title' : 'subject'}.`; bad = true; }
      if (!c.body) { b.error = 'Write a message.'; bad = true; }
      const a = audience();
      if (!a.applications.length && !a.contact.length && !a.returns.length && !a.extra.trim()) {
        ae.textContent = `Choose at least one group or add ${isSms ? 'a number' : 'an email'}.`; bad = true;
      }
      if (bad) return;
      const total = confirmedTotal ?? await count();
      if (total == null) return;
      if (!total) { ae.textContent = 'The selected audience has no recipients.'; return; }
      const name = isSms ? c.title : c.subject;
      if (isSms) {
        const { parts } = credits();
        byId('send-text').textContent = `Send “${name}” to ${plural(total, 'person', 'people')}? ≈ ${num(parts * total)} credits (${plural(parts, 'credit')} each).${acct?.creditBalance != null ? ` You have ${num(acct.creditBalance)} credits.` : ''}`;
      } else {
        byId('send-text').textContent = `Send “${name}” to ${plural(total, 'recipient')}?`;
      }
      showModal('send-modal');
    });

    on('send-confirm', 'click', async (e) => {
      const btn = e.currentTarget; btn.loading = true;
      try {
        const r = await api(BLAST_API[kind], { method: 'POST', body: { ...content(), audience: audience(), expected_total: confirmedTotal } });
        hideModal('send-modal');
        toast(`Blast started — sending to ${plural(r.total, 'recipient')}`);
        go(`/blasts/${kind}/${r.id}`);
      } catch (err) {
        hideModal('send-modal');
        toast(err.message, true);
        if (/Audience changed/.test(err.message)) markDirty();
      } finally { btn.loading = false; }
    });
  }

  function describeAudience(raw, isSms) {
    let a; try { a = JSON.parse(raw || '{}'); } catch { return '—'; }
    const labels = { applications: 'Senior/PWD', contact: 'Messages', returns: 'Returns' };
    const parts = Object.entries(labels).filter(([k]) => a[k]?.length).map(([k, l]) => `${l}: ${a[k].join(', ')}`);
    if (a.extra?.length) parts.push(plural(a.extra.length, isSms ? 'extra number' : 'extra email'));
    return parts.join(' · ') || '—';
  }

  async function viewBlastDetail(kind, id) {
    const isSms = kind === 'sms';
    const b = await api(`${BLAST_API[kind]}/${id}`);
    const title = isSms ? b.title : b.subject;
    const canCancel = b.status === 'sending' || b.status === 'interrupted';
    const stat = (label, value) => `<s-stack gap="none"><s-text color="subdued">${esc(label)}</s-text><s-heading>${num(value)}</s-heading></s-stack>`;

    $app.innerHTML = `<s-page heading="${esc(title)}">
      <s-link slot="breadcrumb-actions" href="${BASE}/blasts/${kind}">Email/SMS Blasts</s-link>
      ${badge(b.status, 'accessory')}
      ${b.status === 'interrupted' ? '<s-button slot="primary-action" variant="primary" id="resume-btn">Resume</s-button>' : ''}
      ${canCancel ? '<s-button slot="secondary-actions" commandFor="cancel-modal" command="--show">Cancel blast</s-button>' : ''}
      <s-stack gap="base">
      ${pageTitle(esc(title), badge(b.status))}
      ${b.status === 'interrupted' ? `<s-banner tone="warning">Sending stopped at ${num(b.sent + b.failed + b.skipped)} of ${num(b.total)}. Resume to send to the remaining ${plural(b.queued, 'person', 'people')}.</s-banner>` : ''}
      <s-section heading="Results">
        <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(8rem, 1fr))">
          ${stat('Sent', b.sent)}${stat('Failed', b.failed)}${stat('Skipped', b.skipped)}${stat('Queued', b.queued)}
        </s-grid>
      </s-section>
      <s-section heading="Audience">
        <s-stack gap="small-200">
          <s-text>${esc(describeAudience(b.audience, isSms))}</s-text>
          <s-text color="subdued">Started by ${esc(b.created_by || 'admin')}, ${esc(fmtDate(b.created_at))}${b.finished_at ? ` · finished ${esc(fmtDate(b.finished_at))}` : ''}</s-text>
        </s-stack>
      </s-section>
      <s-section heading="Message">
        ${isSms ? '' : `<s-text type="strong">${esc(b.subject)}</s-text>`}
        <s-box padding="base" background="subdued" borderRadius="base"><span class="prewrap">${esc(b.body)}</span></s-box>
      </s-section>
      ${b.failures.length ? `<s-section heading="Failed and skipped" padding="none"><s-table>
        <s-table-header-row><s-table-header listSlot="primary">Recipient</s-table-header><s-table-header listSlot="inline">Status</s-table-header><s-table-header>Reason</s-table-header></s-table-header-row>
        <s-table-body>${b.failures.map((f) => `<s-table-row>
          <s-table-cell>${esc(isSms ? fmtPhone(f.phone) : f.email)}${f.full_name ? ` <s-text color="subdued">${esc(f.full_name)}</s-text>` : ''}</s-table-cell>
          <s-table-cell>${badge(f.status)}</s-table-cell><s-table-cell>${esc(f.error || '')}</s-table-cell>
        </s-table-row>`).join('')}</s-table-body></s-table></s-section>` : ''}
    </s-stack></s-page>
    <s-modal id="cancel-modal" heading="Cancel this blast?">
      <s-paragraph>${plural(b.sent, isSms ? 'text' : 'email')} already went out. The remaining ${num(b.queued)} won’t be sent.</s-paragraph>
      <s-button slot="primary-action" variant="primary" tone="critical" id="cancel-confirm">Cancel blast</s-button>
      <s-button slot="secondary-actions" commandFor="cancel-modal" command="--hide">Keep sending</s-button>
    </s-modal>`;

    on('resume-btn', 'click', async (e) => {
      e.currentTarget.loading = true;
      try { await api(`${BLAST_API[kind]}/${id}/resume`, { method: 'POST' }); toast('Blast resumed'); setTimeout(() => viewBlastDetail(kind, id), 800); }
      catch (err) { toast(`Couldn’t resume: ${err.message}`, true); e.currentTarget.loading = false; }
    });
    on('cancel-confirm', 'click', async () => {
      hideModal('cancel-modal');
      try { await api(`${BLAST_API[kind]}/${id}/cancel`, { method: 'POST' }); toast('Blast cancelled'); setTimeout(() => viewBlastDetail(kind, id), 800); }
      catch (err) { toast(`Couldn’t cancel: ${err.message}`, true); }
    });
    if (b.status === 'sending') setTimeout(() => { if (location.pathname.endsWith(`/blasts/${kind}/${id}`)) viewBlastDetail(kind, id); }, 4000);
  }

  // ── Shipping SMS ───────────────────────────────────────────────────────────
  async function viewShippingSms() {
    const q = qs();
    const state = { status: q.get('status') || 'all', search: q.get('search') || '' };
    const page = Math.max(1, parseInt(q.get('page'), 10) || 1);
    const params = new URLSearchParams({ page, limit: 20 });
    if (state.status !== 'all') params.set('status', state.status);
    if (state.search) params.set('search', state.search);
    const [s, log, acct] = await Promise.all([
      api('/api/sms/settings'),
      api(`/api/sms/notifications?${params}`),
      api('/api/sms/account').catch((e) => ({ error: e.message })),
    ]);
    const meta = log.metadata; const c = log.counts || {};
    const allCount = Object.values(c).reduce((a, b) => a + Number(b), 0);

    const [stLabel, stTone, stNote] = !s.apiKeySet ? ['Needs API key', 'warning', 'The Semaphore API key isn’t set. Ask your developer to add it on the server.']
      : s.enabled ? ['Active', 'success', 'Texts send when an order is fulfilled']
      : ['Off', 'neutral', 'Shipping texts are turned off.'];
    const cell = (label, inner) => `<s-stack gap="small-200"><s-text color="subdued">${esc(label)}</s-text>${inner}</s-stack>`;

    const rows = log.data.map((n) => `<s-table-row>
      <s-table-cell><s-stack gap="none"><s-text type="strong">${esc(n.order_name || '—')}</s-text>
        <s-text color="subdued">${esc([n.tracking_company, n.tracking_number].filter(Boolean).join(' · '))}</s-text></s-stack></s-table-cell>
      <s-table-cell>${phoneCell(n.phone)}</s-table-cell>
      <s-table-cell>${badge(n.status)}</s-table-cell>
      <s-table-cell><span class="cell-text">${esc(n.status === 'sent' ? n.message : n.status === 'queued' ? 'Waiting to send' : (n.error || ''))}</span></s-table-cell>
      <s-table-cell>${num(n.attempts)}</s-table-cell>
      <s-table-cell>${dateCell(n.sent_at || n.created_at)}</s-table-cell>
      <s-table-cell>${n.status === 'failed' || n.status === 'skipped' ? `
        <s-button icon="menu-horizontal" variant="tertiary" commandFor="sms-menu-${n.id}" accessibilityLabel="Actions for ${esc(n.order_name)}"></s-button>
        <s-menu id="sms-menu-${n.id}" accessibilityLabel="Actions for ${esc(n.order_name)}">
          ${n.status === 'failed' ? `<s-button data-retry="${n.id}">Retry</s-button>` : ''}
          <s-button data-sendto="${n.id}" data-order="${esc(n.order_name)}">Send to number…</s-button>
        </s-menu>` : ''}</s-table-cell>
    </s-table-row>`).join('');

    const filtered = state.search || state.status !== 'all';
    $app.innerHTML = `<s-page heading="Shipping SMS">
      <s-button slot="secondary-actions" commandFor="test-sms-modal" command="--show">Send test SMS</s-button>
      <s-button slot="secondary-actions" id="refresh-credits">Refresh credits</s-button>
      <s-stack gap="base">
      ${pageTitle('Shipping SMS')}
      ${!s.webhookSecretSet ? '<s-banner tone="critical" heading="Webhook secret missing">Shopify can’t confirm fulfilment events. Add the webhook secret on the server.</s-banner>' : ''}
      <s-section>
        <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(10rem, 1fr))">
          ${cell('Status', `<s-badge tone="${stTone}">${stLabel}</s-badge><s-text color="subdued">${esc(stNote)}</s-text>`)}
          ${cell('Sender name', `<s-text type="strong">${esc(s.senderName || 'Semaphore default')}</s-text><s-link href="${BASE}/settings">Change in Settings</s-link>`)}
          ${cell('API key', `<s-badge tone="${s.apiKeySet ? 'success' : 'warning'}">${s.apiKeySet ? 'Set' : 'Missing'}</s-badge><s-text color="subdued">Set on the server</s-text>`)}
          ${cell('Credits', acct.error ? `<s-text color="subdued">${esc(acct.error)}</s-text>` : `<s-heading>${num(acct.creditBalance)}</s-heading>`)}
          ${cell('Webhook', `<s-badge tone="${s.webhookSecretSet ? 'success' : 'critical'}">${s.webhookSecretSet ? 'Connected' : 'Secret missing'}</s-badge>`)}
        </s-grid>
        <s-grid gap="base" gridTemplateColumns="1fr auto" alignItems="end">
          <s-text-field label="Webhook URL" value="${esc(s.webhookUrl)}" readOnly></s-text-field>
          <s-button id="copy-webhook">Copy</s-button>
        </s-grid>
      </s-section>
      ${statusTabs('/shipping-sms', state, state.status, [['all', 'All', allCount], ['sent', 'Sent', c.sent || 0], ['failed', 'Failed', c.failed || 0], ['skipped', 'Skipped', c.skipped || 0], ['queued', 'Queued', c.queued || 0]])}
      ${log.data.length
        ? `<s-section padding="none"><s-table id="sms-table" paginate ${meta.current_page < meta.total_pages ? 'hasNextPage' : ''} ${meta.current_page > 1 ? 'hasPreviousPage' : ''}>
            <s-search-field slot="filters" id="f-search" label="Search" labelAccessibilityVisibility="exclusive" placeholder="Order, phone or tracking number" value="${esc(state.search)}"></s-search-field>
            <s-table-header-row>
              <s-table-header listSlot="primary">Order</s-table-header><s-table-header>Phone</s-table-header>
              <s-table-header listSlot="inline">Status</s-table-header><s-table-header>Message or error</s-table-header>
              <s-table-header format="numeric">Attempts</s-table-header><s-table-header>Date</s-table-header>
              <s-table-header><span style="position:absolute;left:-9999px">Actions</span></s-table-header>

        : filtered
          ? `<s-section><s-search-field id="f-search" label="Search" labelAccessibilityVisibility="exclusive" placeholder="Order, phone or tracking number" value="${esc(state.search)}"></s-search-field></s-section>
             ${emptyState('No shipping texts match', 'Try a different status or search.', `<s-button href="${BASE}/shipping-sms">Clear filters</s-button>`)}`
          : emptyState('No shipping texts yet', 'Texts appear here when orders are marked fulfilled.', '<s-button commandFor="test-sms-modal" command="--show">Send test SMS</s-button>')}
    </s-stack></s-page>
    ${testSmsModal()}
    <s-modal id="sendto-modal" heading="Send to number">
      <s-stack gap="base">
        <s-paragraph id="sendto-text"></s-paragraph>
        <s-text-field id="sendto-phone" label="Phone number" placeholder="0917 123 4567"></s-text-field>
      </s-stack>
      <s-button slot="primary-action" variant="primary" id="sendto-confirm">Send</s-button>
      <s-button slot="secondary-actions" commandFor="sendto-modal" command="--hide">Cancel</s-button>
    </s-modal>`;

    on('f-search', 'change', (e) => go(withQuery('/shipping-sms', { ...state, search: e.currentTarget.value.trim() })));
    wirePaging('sms-table', '/shipping-sms', state, meta);
    wireTestSms(() => viewShippingSms());
    on('refresh-credits', 'click', () => viewShippingSms());
    on('copy-webhook', 'click', async () => {
      try { await navigator.clipboard.writeText(s.webhookUrl); toast('Webhook URL copied'); }
      catch { toast('Couldn’t copy. Select the URL and copy it.', true); }
    });
    onAll('[data-retry]', 'click', async (e) => {
      loading(true);
      try { await api(`/api/sms/notifications/${e.currentTarget.dataset.retry}/retry`, { method: 'POST', body: {} }); toast('Text sent'); viewShippingSms(); }
      catch (err) { toast(`Couldn’t send: ${err.message}`, true); viewShippingSms(); }
      finally { loading(false); }
    });
    let sendToId = null;
    onAll('[data-sendto]', 'click', (e) => {
      sendToId = e.currentTarget.dataset.sendto;
      byId('sendto-text').textContent = `Where should the shipping text for order ${e.currentTarget.dataset.order} go?`;
      const f = byId('sendto-phone'); f.value = ''; f.error = '';
      showModal('sendto-modal');
    });
    on('sendto-confirm', 'click', async (e) => {
      const f = byId('sendto-phone'); f.error = '';
      const btn = e.currentTarget; btn.loading = true;
      try {
        await api(`/api/sms/notifications/${sendToId}/retry`, { method: 'POST', body: { phone: f.value } });

      } catch (err) { if (err.status === 400) f.error = err.message; else { hideModal('sendto-modal'); toast(`Couldn’t send: ${err.message}`, true); viewShippingSms(); } }
