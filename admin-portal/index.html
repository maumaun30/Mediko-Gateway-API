<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mediko Gateway</title>
  <link rel="icon" type="image/png" href="/admin-dashboard/favicon.png" />
  <!-- Public app client ID (shopify.app.toml). App Bridge uses it to issue the
       session tokens it attaches to every fetch() to this domain. -->
  <meta name="shopify-api-key" content="ee63d07f77aeb73c3ade6dd713eb40f7" />
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
  <style>
    /* Layout glue only; Polaris owns the look. */
    body { margin: 0; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .prewrap { white-space: pre-wrap; overflow-wrap: anywhere; }
    /* In-page title (the admin title bar also shows it). */
    .page-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .page-title h1 { margin: 0; font: 650 1.25rem/1.75rem -apple-system, BlinkMacSystemFont, "San Francisco", "Segoe UI", Roboto, "Helvetica Neue", sans-serif; color: #303030; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <s-app-nav>
    <s-link href="/admin-dashboard/" rel="home">Home</s-link>
    <s-link href="/admin-dashboard/applications">Applications</s-link>
    <s-link href="/admin-dashboard/requests">Requests</s-link>
    <s-link href="/admin-dashboard/blasts">Blasts</s-link>
    <s-link href="/admin-dashboard/shipping-sms">Shipping SMS</s-link>
    <s-link href="/admin-dashboard/settings">Settings</s-link>
  </s-app-nav>

  <div id="app"></div>

  <script>
  'use strict';

  // ── Basics ─────────────────────────────────────────────────────────────────
  const BASE = '/admin-dashboard';
  const $app = document.getElementById('app');
  const inAdmin = window.top !== window.self && typeof window.shopify !== 'undefined';

  function esc(v) {
    return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  const byId = (id) => document.getElementById(id);
  function on(id, ev, fn) { const el = byId(id); if (el) el.addEventListener(ev, fn); return el; }
  function onAll(sel, ev, fn) { document.querySelectorAll(sel).forEach((el) => el.addEventListener(ev, fn)); }

  function toast(msg, isError = false) {
    if (window.shopify?.toast) shopify.toast.show(msg, { isError });
  }
  function loading(v) { try { window.shopify?.loading(v); } catch { /* outside admin */ } }
  function showModal(id) { const m = byId(id); if (m?.showOverlay) m.showOverlay(); else window.shopify?.modal?.show(id); }
  function hideModal(id) { const m = byId(id); if (m?.hideOverlay) m.hideOverlay(); else window.shopify?.modal?.hide(id); }
  function go(path) { window.location.assign(BASE + path); }

  // App Bridge adds a fresh Shopify session token to every same-origin fetch,
  // and the gateway verifies it, so no token handling here.
  async function api(path, { method = 'GET', body } = {}) {
    const res = await fetch(path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const text = await res.text();
    let json = null;
    try { json = text ? JSON.parse(text) : {}; } catch { /* non-JSON */ }
    if (!res.ok) {
      const msg = json?.error || `Server error ${res.status}`;
      const err = new Error(msg); err.status = res.status; throw err;
    }
    return json ?? {};
  }

  const fmtDate = (ts) => ts
    ? new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })
    : '—';
  const fmtDay = (d) => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
  function fmtPhone(p) {
    let d = String(p || '').replace(/\D/g, '');
    if (d.startsWith('63') && d.length === 12) d = '0' + d.slice(2);
    return d.length === 11 ? `${d.slice(0, 4)} ${d.slice(4, 7)} ${d.slice(7)}` : (p || '—');
  }
  const num = (n) => Number(n || 0).toLocaleString('en-US');
  const plural = (n, one, many = one + 's') => `${num(n)} ${n === 1 ? one : many}`;

  // One status → tone mapping everywhere.
  const TONES = {
    pending: 'caution', approved: 'success', resolved: 'success', sent: 'success', completed: 'success',
    rejected: 'critical', failed: 'critical', skipped: 'neutral', cancelled: 'neutral',
    queued: 'info', sending: 'info', interrupted: 'warning',
  };
  const cap = (s) => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1);
  const badge = (status, slot = '') => `<s-badge tone="${TONES[status] || 'neutral'}"${slot ? ` slot="${slot}"` : ''}>${esc(cap(status || 'pending'))}</s-badge>`;

  const qs = () => new URLSearchParams(location.search);
  function withQuery(path, params) {
    const p = new URLSearchParams();
    Object.entries(params).forEach(([k, v]) => { if (v !== '' && v != null && v !== 'all') p.set(k, v); });
    const s = p.toString();
    return s ? `${path}?${s}` : path;
  }
  const photoUrls = (csv) => String(csv || '').split(',').map((p) => p.trim()).filter(Boolean)
    .map((p) => `/view-uploads/${encodeURIComponent(p.split(/[\\/]/).pop())}`);

  // Page title shown at the top of every page; `html` must already be escaped.
  const pageTitle = (html, extra = '') => `<div class="page-title"><h1>${html}</h1>${extra}</div>`;

  function errorSection(msg, retryId = 'retry-load') {
    return `<s-section>
      <s-banner tone="critical" heading="Couldn't load this page">
        ${esc(msg)}
        <s-button slot="secondary-actions" id="${retryId}">Try again</s-button>
      </s-banner></s-section>`;
  }
  function emptyState(heading, text, actionHtml = '') {
    return `<s-section><s-stack gap="base" alignItems="center" padding="large-200">
      <s-heading>${esc(heading)}</s-heading>
      <s-paragraph color="subdued">${esc(text)}</s-paragraph>
      ${actionHtml}
    </s-stack></s-section>`;
  }
  function renderError(page, err) {
    $app.innerHTML = `<s-page heading="${esc(page)}"><s-stack gap="base">${pageTitle(esc(page))}${errorSection(err.message)}</s-stack></s-page>`;
    on('retry-load', 'click', () => location.reload());
  }

  // Index-table filter bar + pagination, shared by the list pages.
  function filterBar({ searchLabel, search, from, to }) {
    return `<s-grid slot="filters" gap="small-200" gridTemplateColumns="repeat(auto-fit, minmax(11rem, 1fr))" alignItems="end">
      <s-search-field id="f-search" label="Search" labelAccessibilityVisibility="exclusive" placeholder="${esc(searchLabel)}" value="${esc(search)}"></s-search-field>
      <s-date-field id="f-from" label="From" value="${esc(from)}"></s-date-field>
      <s-date-field id="f-to" label="To" value="${esc(to)}"></s-date-field>
    </s-grid>`;
  }
  function wireFilters(path, state) {
    const apply = (patch) => go(withQuery(path, { ...state, page: '', ...patch }));
    on('f-search', 'change', (e) => apply({ search: e.currentTarget.value.trim() }));
    on('f-from', 'change', (e) => apply({ from: e.currentTarget.value }));
    on('f-to', 'change', (e) => apply({ to: e.currentTarget.value }));
  }
  function wirePaging(tableId, path, state, meta) {
    on(tableId, 'nextpage', () => go(withQuery(path, { ...state, page: meta.current_page + 1 })));
    on(tableId, 'previouspage', () => go(withQuery(path, { ...state, page: meta.current_page - 1 })));
  }
  function statusTabs(path, state, current, tabs) {
    return `<s-stack direction="inline" gap="small-200">${tabs.map(([key, label, count]) =>
      `<s-button href="${BASE}${withQuery(path, { ...state, status: key, page: '' })}" variant="${current === key ? 'primary' : 'secondary'}">${esc(label)}${count != null ? ` ${num(count)}` : ''}</s-button>`
    ).join('')}</s-stack>`;
  }

  // ── Router ─────────────────────────────────────────────────────────────────
  const ROUTES = [
    [/^\/?$/, viewHome],
    [/^\/applications$/, viewApplications],
    [/^\/applications\/(\d+)$/, viewApplication],
    [/^\/requests$/, () => go('/requests/messages')],
    [/^\/requests\/messages$/, () => viewRequestList('messages')],
    [/^\/requests\/messages\/(\d+)$/, viewMessage],
    [/^\/requests\/returns$/, () => viewRequestList('returns')],
    [/^\/requests\/returns\/(\d+)$/, viewReturn],
    [/^\/blasts$/, () => go('/blasts/email')],
    [/^\/blasts\/(email|sms)$/, viewBlastList],
    [/^\/blasts\/(email|sms)\/new$/, viewBlastCreate],
    [/^\/blasts\/(email|sms)\/(\d+)$/, viewBlastDetail],
    [/^\/shipping-sms$/, viewShippingSms],
    [/^\/settings$/, viewSettings],
  ];

  async function route() {
    if (!inAdmin) {
      $app.innerHTML = `<s-page heading="Mediko Gateway"><s-section>
        <s-heading>Open this app from your Shopify admin</s-heading>
        <s-paragraph>Mediko Gateway only works inside Shopify. Go to Apps › MedikoPH Gateway in your store admin.</s-paragraph>
      </s-section></s-page>`;
      return;
    }
    const path = location.pathname.replace(/^\/admin-dashboard/, '').replace(/\/$/, '') || '/';
    for (const [re, view] of ROUTES) {
      const m = path.match(re);
      if (m) {
        loading(true);
        try { await view(...m.slice(1)); }
        catch (err) { console.error(err); renderError('Mediko Gateway', err); }
        finally { loading(false); }
        return;
      }
    }
    $app.innerHTML = `<s-page heading="Page not found"><s-stack gap="base">${pageTitle('Page not found')}${emptyState('This page doesn’t exist', 'Use the app menu to find what you need.')}</s-stack></s-page>`;
  }

  // ── Home ───────────────────────────────────────────────────────────────────
  async function viewHome() {
    const [d, acct] = await Promise.all([
      api('/api/dashboard'),
      api('/api/sms/account').catch(() => null),
    ]);
    const credits = acct?.creditBalance;
    const banners = [];
    if (d.sms.failedToday > 0) {
      banners.push(`<s-banner tone="critical" heading="${esc(plural(d.sms.failedToday, 'shipping text'))} failed today">
        Customers didn’t get their shipping update.
        <s-button slot="secondary-actions" href="${BASE}/shipping-sms?status=failed">Review failed texts</s-button></s-banner>`);
    }
    if (credits != null && Number(credits) < 100) {
      banners.push(`<s-banner tone="warning" heading="Semaphore credits are running low">
        ${num(credits)} credits left — about ${num(credits)} texts.</s-banner>`);
    }
    d.interrupted.forEach((b) => {
      banners.push(`<s-banner tone="info" heading="${b.kind === 'sms' ? 'SMS' : 'Email'} blast “${esc(b.title)}” stopped at ${num(b.done)} of ${num(b.total)}">
        You can pick up where it left off.
        <s-button slot="secondary-actions" href="${BASE}/blasts/${b.kind}/${b.id}">Resume blast</s-button></s-banner>`);
    });

    const metric = (label, value, linkLabel, href) => `<s-section>
      <s-stack gap="small-200">
        <s-text color="subdued">${esc(label)}</s-text>
        <s-heading>${esc(value)}</s-heading>
        ${href ? `<s-link href="${href}">${esc(linkLabel)}</s-link>` : `<s-text color="subdued">${esc(linkLabel)}</s-text>`}
      </s-stack></s-section>`;
    const c = d.counts;

    const s = d.setup;
    const steps = [
      { done: s.apiKeySet, title: 'Semaphore API key set', note: 'Set on the server by your developer.' },
      { done: s.webhookSecretSet, title: 'Shopify webhook secret set', note: 'Set on the server by your developer.' },
      { done: Boolean(s.senderName), title: 'Enter an approved sender name',
        note: 'Get the name approved in Semaphore first (max 11 characters), then add it in Settings. Until then, texts use Semaphore’s default sender.',
        action: `<s-button href="${BASE}/settings">Open Settings</s-button>` },
      { done: s.checkoutPhoneDone, title: 'Phone number required at checkout',
        note: 'In Shopify Settings › Checkout, set “Shipping address phone number” to Required.',
        action: `<s-stack direction="inline" gap="small-200"><s-button href="shopify://admin/settings/checkout" target="_top">Open checkout settings</s-button><s-button id="mark-phone-done">Mark as done</s-button></s-stack>` },
      { done: s.testSmsSent, title: 'Send a test SMS', note: 'Uses 1 credit.',
        action: `<s-button id="open-test-sms">Send test SMS</s-button>` },
    ];
    const doneCount = steps.filter((x) => x.done).length;
    const guide = s.dismissed ? '' : doneCount === steps.length
      ? `<s-section heading="Shipping texts are ready">
          <s-stack gap="base">
            <s-paragraph>Customers will get a text each time an order is marked fulfilled.</s-paragraph>
            <s-button id="dismiss-guide">Dismiss guide</s-button>
          </s-stack></s-section>`
      : `<s-section heading="Set up shipping texts">
          <s-stack gap="base">
            <s-stack direction="inline" gap="small" alignItems="center">
              <s-text color="subdued">Customers get a text when their order is marked fulfilled.</s-text>
              <s-badge>${doneCount} of ${steps.length} done</s-badge>
            </s-stack>
            ${steps.map((st) => `<s-box padding="small" borderRadius="base" ${st.done ? '' : 'background="subdued"'}>
              <s-stack gap="small-200">
                <s-stack direction="inline" gap="small" alignItems="center">
                  <s-badge tone="${st.done ? 'success' : 'neutral'}">${st.done ? 'Done' : 'To do'}</s-badge>
                  <s-text type="strong">${esc(st.title)}</s-text>
                </s-stack>
                ${st.done ? '' : `<s-text color="subdued">${esc(st.note)}</s-text>${st.action || ''}`}
              </s-stack></s-box>`).join('')}
            <s-button variant="tertiary" id="dismiss-guide">Dismiss</s-button>
          </s-stack></s-section>`;

    $app.innerHTML = `<s-page heading="Home"><s-stack gap="base">
      ${pageTitle('Home')}
      ${banners.join('')}
      <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(14rem, 1fr))">
        ${metric('Pending applications', num(c.applications.pending), 'View pending →', `${BASE}/applications?status=pending`)}
        ${metric('Pending messages', num(c.contact.pending), 'View pending →', `${BASE}/requests/messages?status=pending`)}
        ${metric('Pending returns', num(c.returns.pending), 'View pending →', `${BASE}/requests/returns?status=pending`)}
        ${metric('Shipping texts sent · last 7 days', num(d.sms.sent7d), 'Automatic, on fulfilment')}
        ${metric('Shipping texts failed · last 7 days', num(d.sms.failed7d), 'View failed →', `${BASE}/shipping-sms?status=failed`)}
        ${metric('Semaphore credits', credits == null ? '—' : num(credits), credits == null ? 'Couldn’t load balance' : 'Current balance')}
      </s-grid>
      ${guide}
    </s-stack></s-page>
    ${testSmsModal()}`;

    on('mark-phone-done', 'click', async () => {
      try { await api('/api/setup', { method: 'POST', body: { checkout_phone_done: true } }); toast('Marked as done'); viewHome(); }
      catch (e) { toast(`Couldn’t save: ${e.message}`, true); }
    });
    onAll('#dismiss-guide', 'click', async () => {
      try { await api('/api/setup', { method: 'POST', body: { guide_dismissed: true } }); viewHome(); }
      catch (e) { toast(`Couldn’t save: ${e.message}`, true); }
    });
    on('open-test-sms', 'click', () => showModal('test-sms-modal'));
    wireTestSms(() => viewHome());
  }

  // Shared "Send test SMS" modal (Home + Shipping SMS).
  function testSmsModal() {
    return `<s-modal id="test-sms-modal" heading="Send test SMS">
      <s-stack gap="base">
        <s-text-field id="test-sms-number" label="Phone number" placeholder="0917 123 4567" details="Uses 1 credit."></s-text-field>
      </s-stack>
      <s-button slot="primary-action" variant="primary" id="test-sms-send">Send test</s-button>
      <s-button slot="secondary-actions" commandFor="test-sms-modal" command="--hide">Cancel</s-button>
    </s-modal>`;
  }
  function wireTestSms(after) {
    on('test-sms-send', 'click', async (e) => {
      const btn = e.currentTarget; const field = byId('test-sms-number');
      field.error = '';
      btn.loading = true;
      try {
        await api('/api/sms/test', { method: 'POST', body: { number: field.value } });
        hideModal('test-sms-modal');
        toast(`Text sent to ${fmtPhone(field.value)}`);
        after?.();
      } catch (err) {
        if (err.status === 400) field.error = err.message; else toast(`Couldn’t send: ${err.message}`, true);
      } finally { btn.loading = false; }
    });
  }

  // ── Applications ───────────────────────────────────────────────────────────
  async function viewApplications() {
    const q = qs();
    const state = { status: q.get('status') || 'all', search: q.get('search') || '', from: q.get('from') || '', to: q.get('to') || '' };
    const page = Math.max(1, parseInt(q.get('page'), 10) || 1);
    const params = new URLSearchParams({ page, limit: 20 });
    if (state.status !== 'all') params.set('status', state.status);
    if (state.search) params.set('search', state.search);
    if (state.from) params.set('date_from', state.from);
    if (state.to) params.set('date_to', state.to);
    const [list, counts] = await Promise.all([api(`/api/submissions?${params}`), api('/api/inbox/counts')]);
    const meta = list.metadata; const c = counts.applications;

    const orderCell = (a) => a.assigned_order_name
      ? `<s-stack direction="inline" gap="small-200" alignItems="center"><s-text>${esc(a.assigned_order_name)}</s-text>
           ${a.assigned_tag ? `<s-badge>${esc(a.assigned_tag)}</s-badge>` : ''}
           ${a.refunded_at ? '<s-badge tone="critical">Refunded</s-badge>' : ''}</s-stack>`
      : '<s-text color="subdued">Not assigned</s-text>';
    const rows = list.data.map((a) => `<s-table-row clickDelegate="app-link-${a.id}">
      <s-table-cell><s-stack gap="none"><s-link id="app-link-${a.id}" href="${BASE}/applications/${a.id}">${esc(a.full_name)}</s-link>
        <s-text color="subdued">${esc(a.email_address)}</s-text></s-stack></s-table-cell>
      <s-table-cell>${esc(fmtPhone(a.contact_number))}</s-table-cell>
      <s-table-cell><span class="mono">${esc(a.id_number)}</span></s-table-cell>
      <s-table-cell>${esc(fmtDate(a.created_at))}</s-table-cell>
      <s-table-cell>${badge(a.status || 'pending')}</s-table-cell>
      <s-table-cell>${orderCell(a)}</s-table-cell>
      <s-table-cell>${(a.status || 'pending') === 'pending' ? `
        <s-button icon="menu-horizontal" variant="tertiary" commandFor="app-menu-${a.id}" accessibilityLabel="Actions for ${esc(a.full_name)}"></s-button>
        <s-menu id="app-menu-${a.id}" accessibilityLabel="Actions for ${esc(a.full_name)}">
          <s-button data-approve="${a.id}">Approve</s-button>
          <s-button tone="critical" data-reject="${a.id}" data-name="${esc(a.full_name)}">Reject…</s-button>
        </s-menu>` : ''}</s-table-cell>
    </s-table-row>`).join('');

    const filtered = state.search || state.from || state.to || state.status !== 'all';
    const body = list.data.length ? `<s-section padding="none">
        <s-table id="app-table" paginate ${meta.current_page < meta.total_pages ? 'hasNextPage' : ''} ${meta.current_page > 1 ? 'hasPreviousPage' : ''}>
          ${filterBar({ searchLabel: 'Name, email or ID number', ...state })}
          <s-table-header-row>
            <s-table-header listSlot="primary">Applicant</s-table-header>
            <s-table-header>Contact</s-table-header>
            <s-table-header>ID number</s-table-header>
            <s-table-header>Submitted</s-table-header>
            <s-table-header listSlot="inline">Status</s-table-header>
            <s-table-header>Order</s-table-header>
            <s-table-header><span style="position:absolute;left:-9999px">Actions</span></s-table-header>
          </s-table-header-row>
          <s-table-body>${rows}</s-table-body>
        </s-table></s-section>`
      : filtered
        ? `<s-section padding="none"><s-table>${filterBar({ searchLabel: 'Name, email or ID number', ...state })}<s-table-body></s-table-body></s-table></s-section>
           ${emptyState('No applications match', 'Try a different name, status or date range.', `<s-button href="${BASE}/applications">Clear filters</s-button>`)}`
        : emptyState('No applications yet', 'SC and PWD discount applications from mediko.ph show up here.');

    $app.innerHTML = `<s-page heading="Applications"><s-stack gap="base">
      ${pageTitle('Applications')}
      ${statusTabs('/applications', state, state.status, [['all', 'All', c.total], ['pending', 'Pending', c.pending || 0], ['approved', 'Approved'], ['rejected', 'Rejected']])}
      ${body}
    </s-stack></s-page>
    ${rejectModal('application')}`;

    wireFilters('/applications', state);
    wirePaging('app-table', '/applications', state, meta);
    onAll('[data-approve]', 'click', async (e) => {
      const id = e.currentTarget.dataset.approve;
      loading(true);
      try { await api(`/api/submissions/${id}/status`, { method: 'PATCH', body: { status: 'approved' } }); toast('Application approved'); viewApplications(); }
      catch (err) { toast(`Couldn’t approve: ${err.message}`, true); }
      finally { loading(false); }
    });
    onAll('[data-reject]', 'click', (e) => openReject(e.currentTarget.dataset.reject, e.currentTarget.dataset.name));
    wireReject('application', (id, reason) => api(`/api/submissions/${id}/status`, { method: 'PATCH', body: { status: 'rejected', reason } }), viewApplications);
  }

  // Reject-with-reason modal, shared by applications and returns.
  let _rejectId = null;
  function rejectModal(kind) {
    const what = kind === 'return' ? 'return' : 'application';
    return `<s-modal id="reject-modal" heading="Reject ${what}?">
      <s-stack gap="base">
        <s-paragraph id="reject-intro"></s-paragraph>
        <s-text-area id="reject-reason" label="Reason" rows="3" ${kind === 'return' ? 'details="Shown to the team on this return."' : ''}></s-text-area>
      </s-stack>
      <s-button slot="primary-action" variant="primary" tone="critical" id="reject-confirm">Reject</s-button>
      <s-button slot="secondary-actions" commandFor="reject-modal" command="--hide">Cancel</s-button>
    </s-modal>`;
  }
  function openReject(id, name) {
    _rejectId = id;
    const intro = byId('reject-intro');
    if (intro) intro.textContent = name ? `${name} will be told it was not approved.` : '';
    const f = byId('reject-reason'); if (f) { f.value = ''; f.error = ''; }
    showModal('reject-modal');
  }
  function wireReject(kind, send, after) {
    on('reject-confirm', 'click', async (e) => {
      const f = byId('reject-reason'); const reason = f.value.trim();
      if (reason.length < 5) { f.error = 'Enter a reason (at least 5 characters) so it’s clear what to fix.'; return; }
      const btn = e.currentTarget; btn.loading = true;
      try {
        await send(_rejectId, reason);
        hideModal('reject-modal');
        toast(kind === 'return' ? 'Return rejected' : 'Application rejected');
        after();
      } catch (err) { f.error = err.message; }
      finally { btn.loading = false; }
    });
  }

  // ── Application detail ─────────────────────────────────────────────────────
  async function viewApplication(id) {
    const a = await api(`/api/submissions/${id}`);
    const status = a.status || 'pending';
    const photos = photoUrls(a.id_photo_path);
    const shopOrderId = String(a.assigned_order_gid || '').split('/').pop();

    const actions = status === 'pending'
      ? `<s-button slot="primary-action" variant="primary" id="approve-btn">Approve</s-button>
         <s-button slot="secondary-actions" id="reject-btn">Reject</s-button>`
      : `<s-button slot="secondary-actions" commandFor="revert-modal" command="--show">Revert to pending</s-button>`;

    const discount = a.discount_code
      ? `<s-stack gap="small">
          <s-stack direction="inline" gap="small" alignItems="center">
            <s-text type="strong"><span class="mono">${esc(a.discount_code)}</span></s-text>
            <s-button icon="clipboard" variant="tertiary" id="copy-code" accessibilityLabel="Copy discount code"></s-button>
          </s-stack>
          <s-stack direction="inline" gap="small" alignItems="center">
            <s-button id="check-usage">Check usage</s-button><span id="usage-badge"></span>
          </s-stack></s-stack>`
      : `<s-text color="subdued">${status === 'approved' ? 'No code was created (automatic codes are off in Settings).' : 'A discount code is created when you approve.'}</s-text>`;

    const order = a.assigned_order_gid
      ? `<s-stack gap="small">
          <s-stack direction="inline" gap="small-200" alignItems="center">
            <s-link href="shopify://admin/orders/${esc(shopOrderId)}" target="_top">${esc(a.assigned_order_name || 'Order')}</s-link>
            ${a.assigned_tag ? `<s-badge>${esc(a.assigned_tag)}</s-badge>` : ''}
            ${a.refunded_at ? '<s-badge tone="critical">Refunded</s-badge>' : ''}
          </s-stack>
          ${a.refunded_at ? `<s-text color="subdued">Marked refunded ${esc(fmtDate(a.refunded_at))}${a.refunded_by ? ` by ${esc(a.refunded_by)}` : ''}</s-text>` : '<s-text color="subdued">Opens in Shopify orders</s-text>'}
          <s-stack direction="inline" gap="small">
            <s-button id="open-assign">Change</s-button>
            ${a.refunded_at ? '<s-button id="undo-refund">Undo refunded</s-button>' : '<s-button id="mark-refund">Mark as refunded</s-button>'}
            <s-button tone="critical" variant="tertiary" commandFor="unassign-modal" command="--show">Unassign</s-button>
          </s-stack></s-stack>`
      : `<s-stack gap="small"><s-text color="subdued">Not assigned</s-text><s-button id="open-assign">Assign order</s-button></s-stack>`;

    const kv = (label, value) => `<s-stack gap="none"><s-text color="subdued">${esc(label)}</s-text>${value}</s-stack>`;

    $app.innerHTML = `<s-page heading="${esc(a.full_name)}">
      <s-link slot="breadcrumb-actions" href="${BASE}/applications">Applications</s-link>
      ${badge(status, 'accessory')}
      ${actions}
      <s-stack gap="base">
      ${pageTitle(esc(a.full_name), badge(status))}
      ${status === 'rejected' && a.rejection_reason ? `<s-banner tone="critical" heading="Rejected">${esc(a.rejection_reason)}</s-banner>` : ''}
      <s-section heading="ID photos">
        ${photos.length ? `<s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(9rem, 1fr))">
          ${photos.map((u, i) => `<s-clickable data-photo="${i}" accessibilityLabel="Open ID photo ${i + 1} full size" borderRadius="base">
            <s-image src="${esc(u)}" alt="ID photo ${i + 1}" aspectRatio="4/3" objectFit="cover" borderRadius="base"></s-image></s-clickable>`).join('')}
        </s-grid>
        <s-text color="subdued">Click a photo to see it full size.</s-text>` : '<s-text color="subdued">No photos uploaded.</s-text>'}
      </s-section>
      <s-section heading="Applicant details">
        <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(12rem, 1fr))">
          ${kv('Name', `<s-text>${esc(a.full_name)}</s-text>`)}
          ${kv('Email', `<s-link href="mailto:${esc(a.email_address)}">${esc(a.email_address)}</s-link>`)}
          ${kv('Contact number', `<s-text>${esc(fmtPhone(a.contact_number))}</s-text>`)}
          ${kv('Birthday', `<s-text>${esc(a.birthday ? fmtDay(a.birthday) : '—')}</s-text>`)}
          ${kv('ID number', `<s-text><span class="mono">${esc(a.id_number)}</span></s-text>`)}
          ${kv('Submitted', `<s-text>${esc(fmtDate(a.created_at))}</s-text>`)}
        </s-grid>
      </s-section>
      </s-stack>
      <s-section slot="aside" heading="Discount">${discount}</s-section>
      <s-section slot="aside" heading="Order">${order}</s-section>
    </s-page>

    ${rejectModal('application')}

    <s-modal id="revert-modal" heading="Revert to pending?">
      ${a.discount_code
        ? `<s-banner tone="warning">The discount code ${esc(a.discount_code)} will be deleted. The customer can’t use it anymore. This can’t be undone.</s-banner>`
        : '<s-paragraph>The application goes back to the pending list.</s-paragraph>'}
      <s-button slot="primary-action" variant="primary" tone="critical" id="revert-confirm">Revert to pending</s-button>
      <s-button slot="secondary-actions" commandFor="revert-modal" command="--hide">Cancel</s-button>
    </s-modal>

    <s-modal id="unassign-modal" heading="Unassign order ${esc(a.assigned_order_name || '')}?">
      <s-paragraph>The order stays in Shopify. It just won’t be linked to this application.</s-paragraph>
      <s-button slot="primary-action" variant="primary" tone="critical" id="unassign-confirm">Unassign</s-button>
      <s-button slot="secondary-actions" commandFor="unassign-modal" command="--hide">Cancel</s-button>
    </s-modal>

    <s-modal id="photo-modal" heading="ID photo" size="large">
      <s-image id="photo-full" src="" alt="ID photo full size" objectFit="contain"></s-image>
      <s-button slot="secondary-actions" id="photo-prev">‹ Previous</s-button>
      <s-button slot="secondary-actions" id="photo-next">Next ›</s-button>
    </s-modal>

    <s-modal id="assign-modal" heading="Assign order" size="large">
      <s-stack gap="base">
        <s-search-field id="assign-search" label="Search orders" placeholder="Order number, customer name or email"></s-search-field>
        <s-text color="subdued">Leave blank to see ${esc(a.full_name)}’s own orders.</s-text>
        <div id="assign-orders"><s-spinner accessibilityLabel="Loading orders"></s-spinner></div>
        <s-choice-list id="assign-tag" label="Discount type">
          <s-choice value="PWD" ${a.assigned_tag === 'PWD' ? 'selected' : ''}>PWD</s-choice>
          <s-choice value="SC" ${a.assigned_tag !== 'PWD' ? 'selected' : ''}>SC</s-choice>
        </s-choice-list>
        <s-text id="assign-error" tone="critical"></s-text>
      </s-stack>
      <s-button slot="primary-action" variant="primary" id="assign-confirm">Assign</s-button>
      <s-button slot="secondary-actions" commandFor="assign-modal" command="--hide">Cancel</s-button>
    </s-modal>`;

    const reload = () => viewApplication(id);
    const act = async (fn, okMsg, failMsg) => {
      loading(true);
      try { await fn(); toast(okMsg); reload(); }
      catch (err) { toast(`${failMsg}: ${err.message}`, true); }
      finally { loading(false); }
    };

    on('approve-btn', 'click', () => act(
      () => api(`/api/submissions/${id}/status`, { method: 'PATCH', body: { status: 'approved' } }),
      'Application approved', 'Couldn’t approve'));
    on('reject-btn', 'click', () => openReject(id, a.full_name));
    wireReject('application', (rid, reason) => api(`/api/submissions/${rid}/status`, { method: 'PATCH', body: { status: 'rejected', reason } }), reload);
    on('revert-confirm', 'click', () => { hideModal('revert-modal'); act(
      () => api(`/api/submissions/${id}/status`, { method: 'PATCH', body: { status: 'pending' } }),
      'Application set back to pending', 'Couldn’t revert'); });
    on('unassign-confirm', 'click', () => { hideModal('unassign-modal'); act(
      () => api(`/api/submissions/${id}/assign-order`, { method: 'DELETE' }), 'Order unassigned', 'Couldn’t unassign'); });
    on('mark-refund', 'click', () => act(() => api(`/api/submissions/${id}/refund`, { method: 'POST' }), 'Marked as refunded', 'Couldn’t mark refunded'));
    on('undo-refund', 'click', () => act(() => api(`/api/submissions/${id}/refund`, { method: 'DELETE' }), 'Refund mark removed', 'Couldn’t update'));

    on('copy-code', 'click', async () => {
      try { await navigator.clipboard.writeText(a.discount_code); toast('Code copied'); }
      catch { toast('Couldn’t copy. Select the code and copy it.', true); }
    });
    on('check-usage', 'click', async (e) => {
      const btn = e.currentTarget; btn.loading = true;
      try {
        const u = await api(`/api/submissions/${id}/discount-usage`);
        byId('usage-badge').innerHTML = u.used
          ? `<s-badge tone="success">Used${u.usage_count > 1 ? ` ×${u.usage_count}` : ''}</s-badge>` : '<s-badge>Unused</s-badge>';
      } catch (err) { toast(`Couldn’t check usage: ${err.message}`, true); }
      finally { btn.loading = false; }
    });

    // Photo lightbox
    let photoIdx = 0;
    const showPhoto = (i) => {
      photoIdx = (i + photos.length) % photos.length;
      byId('photo-full').src = photos[photoIdx];
      byId('photo-modal').heading = `ID photo ${photoIdx + 1} of ${photos.length}`;
    };
    onAll('[data-photo]', 'click', (e) => { showPhoto(Number(e.currentTarget.dataset.photo)); showModal('photo-modal'); });
    on('photo-prev', 'click', () => showPhoto(photoIdx - 1));
    on('photo-next', 'click', () => showPhoto(photoIdx + 1));

    // Assign order
    let orders = [];
    const loadOrders = async (term) => {
      const box = byId('assign-orders');
      box.innerHTML = '<s-spinner accessibilityLabel="Loading orders"></s-spinner>';
      try {
        const r = await api(`/api/submissions/${id}/orders?q=${encodeURIComponent(term || '')}`);
        orders = r.orders || [];
        box.innerHTML = orders.length
          ? `<s-choice-list id="assign-order" label="Order">${orders.map((o, i) => `<s-choice value="${i}" ${i === 0 ? 'selected' : ''}>
              ${esc(o.name)} · ${esc(o.customer_name || o.email || 'Guest')}
              <s-text slot="details">${esc(fmtDate(o.created_at))}${o.total ? ` · ${esc(o.currency === 'PHP' ? '₱' : (o.currency || '') + ' ')}${Number(o.total).toLocaleString('en-US', { minimumFractionDigits: 2 })}` : ''}</s-text>
            </s-choice>`).join('')}</s-choice-list>`
          : '<s-text color="subdued">No matching orders.</s-text>';
      } catch (err) { box.innerHTML = `<s-text tone="critical">Couldn’t load orders: ${esc(err.message)}</s-text>`; }
    };
    on('open-assign', 'click', () => { byId('assign-error').textContent = ''; showModal('assign-modal'); loadOrders(''); });
    let searchTimer;
    on('assign-search', 'input', (e) => { clearTimeout(searchTimer); const v = e.currentTarget.value; searchTimer = setTimeout(() => loadOrders(v), 400); });
    on('assign-confirm', 'click', async (e) => {
      const err = byId('assign-error'); err.textContent = '';
      const pick = byId('assign-order')?.values?.[0];
      const o = orders[Number(pick)];
      if (!o) { err.textContent = 'Pick an order first.'; return; }
      const tag = byId('assign-tag').values?.[0] || 'SC';
      const btn = e.currentTarget; btn.loading = true;
      try {
        await api(`/api/submissions/${id}/assign-order`, { method: 'POST', body: { order_gid: o.gid, order_name: o.name, customer_gid: o.customer_gid, tag } });
        hideModal('assign-modal'); toast('Order assigned'); reload();
      } catch (x) { err.textContent = x.message; }
      finally { btn.loading = false; }
    });
  }

  // ── Requests: messages + returns ───────────────────────────────────────────
  async function viewRequestList(kind) {
    const isMsg = kind === 'messages';
    const path = `/requests/${kind}`;
    const q = qs();
    const state = { status: q.get('status') || 'all', search: q.get('search') || '', from: q.get('from') || '', to: q.get('to') || '' };
    const page = Math.max(1, parseInt(q.get('page'), 10) || 1);
    const params = new URLSearchParams({ page, limit: 20 });
    if (state.status !== 'all') params.set('status', state.status);
    if (state.search) params.set('search', state.search);
    if (state.from) params.set('date_from', state.from);
    if (state.to) params.set('date_to', state.to);
    const [list, counts] = await Promise.all([
      api(`/api/${isMsg ? 'contact-submissions' : 'return-requests'}?${params}`),
      api('/api/inbox/counts'),
    ]);
    const meta = list.metadata;
    const c = isMsg ? counts.contact : counts.returns;

    const rows = list.data.map((r) => isMsg
      ? `<s-table-row clickDelegate="req-link-${r.id}">
          <s-table-cell><s-stack gap="none"><s-link id="req-link-${r.id}" href="${BASE}${path}/${r.id}">${esc(r.full_name)}</s-link><s-text color="subdued">${esc(r.email_address)}</s-text></s-stack></s-table-cell>
          <s-table-cell>${esc(fmtPhone(r.contact_number))}</s-table-cell>
          <s-table-cell><span class="clamp">${esc(r.message)}</span></s-table-cell>
          <s-table-cell>${esc(fmtDate(r.created_at))}</s-table-cell>
          <s-table-cell>${badge(r.status || 'pending')}</s-table-cell>
        </s-table-row>`
      : `<s-table-row clickDelegate="req-link-${r.id}">
          <s-table-cell><s-stack gap="none"><s-link id="req-link-${r.id}" href="${BASE}${path}/${r.id}">${esc(r.full_name)}</s-link><s-text color="subdued">${esc(r.email_address)} · ${esc(fmtPhone(r.contact_number))}</s-text></s-stack></s-table-cell>
          <s-table-cell><span class="mono">${esc(r.order_number)}</span></s-table-cell>
          <s-table-cell><span class="clamp">${esc(r.items_to_return)}</span></s-table-cell>
          <s-table-cell>${esc(fmtDate(r.created_at))}</s-table-cell>
          <s-table-cell>${badge(r.status || 'pending')}</s-table-cell>
        </s-table-row>`).join('');

    const headers = isMsg
      ? ['From', 'Contact', 'Message', 'Date', 'Status'] : ['Customer', 'Order', 'Items', 'Date', 'Status'];
    const tabs = isMsg
      ? [['all', 'All', c.total], ['pending', 'Pending', c.pending || 0], ['resolved', 'Resolved']]
      : [['all', 'All', c.total], ['pending', 'Pending', c.pending || 0], ['approved', 'Approved'], ['rejected', 'Rejected']];
    const searchLabel = isMsg ? 'Name, email or message' : 'Name, email or order number';
    const filtered = state.search || state.from || state.to || state.status !== 'all';
    const body = list.data.length
      ? `<s-section padding="none"><s-table id="req-table" paginate ${meta.current_page < meta.total_pages ? 'hasNextPage' : ''} ${meta.current_page > 1 ? 'hasPreviousPage' : ''}>
          ${filterBar({ searchLabel, ...state })}
          <s-table-header-row>${headers.map((h, i) => `<s-table-header${i === 0 ? ' listSlot="primary"' : i === 4 ? ' listSlot="inline"' : ''}>${h}</s-table-header>`).join('')}</s-table-header-row>
          <s-table-body>${rows}</s-table-body></s-table></s-section>`
      : filtered
        ? `<s-section padding="none"><s-table>${filterBar({ searchLabel, ...state })}<s-table-body></s-table-body></s-table></s-section>
           ${state.status === 'pending' && !state.search && !state.from && !state.to
              ? emptyState(`No pending ${kind}`, 'You’re all caught up.')
              : emptyState(`No ${kind} match`, 'Try a different search, status or date range.', `<s-button href="${BASE}${path}">Clear filters</s-button>`)}`
        : emptyState(`No ${kind} yet`, isMsg ? 'Messages from the mediko.ph contact form show up here.' : 'Return requests from mediko.ph show up here.');

    $app.innerHTML = `<s-page heading="Requests"><s-stack gap="base">
      ${pageTitle('Requests')}
      <s-stack direction="inline" gap="small-200">
        <s-button href="${BASE}/requests/messages" variant="${isMsg ? 'primary' : 'secondary'}">Messages ${num(counts.contact.pending || 0)}</s-button>
        <s-button href="${BASE}/requests/returns" variant="${isMsg ? 'secondary' : 'primary'}">Returns ${num(counts.returns.pending || 0)}</s-button>
      </s-stack>
      ${statusTabs(path, state, state.status, tabs)}
      ${body}
    </s-stack></s-page>`;
    wireFilters(path, state);
    wirePaging('req-table', path, state, meta);
  }

  async function viewMessage(id) {
    const m = await api(`/api/contact-submissions/${id}`);
    const status = m.status || 'pending';
    $app.innerHTML = `<s-page heading="${esc(m.full_name)}">
      <s-link slot="breadcrumb-actions" href="${BASE}/requests/messages">Messages</s-link>
      ${badge(status, 'accessory')}
      <s-button slot="primary-action" variant="primary" id="toggle-msg">${status === 'pending' ? 'Mark resolved' : 'Reopen'}</s-button>
      <s-stack gap="base">
      ${pageTitle(esc(m.full_name), badge(status))}
      <s-section heading="Message">
        <s-paragraph><span class="prewrap">${esc(m.message)}</span></s-paragraph>
        <s-text color="subdued">Received ${esc(fmtDate(m.created_at))}</s-text>
      </s-section>
      </s-stack>
      <s-section slot="aside" heading="From">
        <s-stack gap="small-200">
          <s-text>${esc(m.full_name)}</s-text>
          <s-link href="mailto:${esc(m.email_address)}">${esc(m.email_address)}</s-link>
          <s-link href="tel:${esc(m.contact_number)}">${esc(fmtPhone(m.contact_number))}</s-link>
        </s-stack>
      </s-section>
    </s-page>`;
    on('toggle-msg', 'click', async (e) => {
      const next = status === 'pending' ? 'resolved' : 'pending';
      e.currentTarget.loading = true;
      try {
        await api(`/api/contact-submissions/${id}/status`, { method: 'PATCH', body: { status: next } });
        toast(next === 'resolved' ? 'Message resolved' : 'Message reopened'); viewMessage(id);
      } catch (err) { toast(`Couldn’t update: ${err.message}`, true); e.currentTarget.loading = false; }
    });
  }

  async function viewReturn(id) {
    const r = await api(`/api/return-requests/${id}`);
    const status = r.status || 'pending';
    const photos = photoUrls(r.image_paths);
    $app.innerHTML = `<s-page heading="Return for ${esc(r.order_number)}">
      <s-link slot="breadcrumb-actions" href="${BASE}/requests/returns">Returns</s-link>
      ${badge(status, 'accessory')}
      ${status === 'pending'
        ? `<s-button slot="primary-action" variant="primary" id="approve-ret">Approve</s-button>
           <s-button slot="secondary-actions" id="reject-ret">Reject</s-button>`
        : `<s-button slot="secondary-actions" commandFor="revert-ret-modal" command="--show">Revert</s-button>`}
      <s-stack gap="base">
      ${pageTitle(`Return for ${esc(r.order_number)}`, badge(status))}
      ${status === 'rejected' && r.rejection_reason ? `<s-banner tone="critical" heading="Rejected">${esc(r.rejection_reason)}</s-banner>` : ''}
      <s-section heading="Items to return"><s-paragraph><span class="prewrap">${esc(r.items_to_return)}</span></s-paragraph></s-section>
      <s-section heading="Reason"><s-paragraph><span class="prewrap">${esc(r.reason)}</span></s-paragraph></s-section>
      <s-section heading="Photos">
        ${photos.length ? `<s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(9rem, 1fr))">
          ${photos.map((u, i) => `<s-clickable href="${esc(u)}" target="_blank" accessibilityLabel="Open photo ${i + 1} full size" borderRadius="base">
            <s-image src="${esc(u)}" alt="Return photo ${i + 1}" aspectRatio="4/3" objectFit="cover" borderRadius="base"></s-image></s-clickable>`).join('')}
        </s-grid>` : '<s-text color="subdued">No photos uploaded.</s-text>'}
      </s-section>
      </s-stack>
      <s-section slot="aside" heading="Customer">
        <s-stack gap="small-200">
          <s-text>${esc(r.full_name)}</s-text>
          <s-link href="mailto:${esc(r.email_address)}">${esc(r.email_address)}</s-link>
          <s-link href="tel:${esc(r.contact_number)}">${esc(fmtPhone(r.contact_number))}</s-link>
        </s-stack>
      </s-section>
      <s-section slot="aside" heading="Order">
        <s-stack gap="small-200">
          <s-text><span class="mono">${esc(r.order_number)}</span></s-text>
          <s-text color="subdued">Received ${esc(fmtDate(r.created_at))}</s-text>
        </s-stack>
      </s-section>
    </s-page>
    ${rejectModal('return')}
    <s-modal id="revert-ret-modal" heading="Set this return back to pending?">
      <s-paragraph>It goes back to the pending list so it can be reviewed again.</s-paragraph>
      <s-button slot="primary-action" variant="primary" id="revert-ret-confirm">Revert</s-button>
      <s-button slot="secondary-actions" commandFor="revert-ret-modal" command="--hide">Cancel</s-button>
    </s-modal>`;

    const setStatus = async (next, okMsg) => {
      loading(true);
      try { await api(`/api/return-requests/${id}/status`, { method: 'PATCH', body: { status: next } }); toast(okMsg); viewReturn(id); }
      catch (err) { toast(`Couldn’t update: ${err.message}`, true); }
      finally { loading(false); }
    };
    on('approve-ret', 'click', () => setStatus('approved', 'Return approved'));
    on('reject-ret', 'click', () => openReject(id, r.full_name));
    on('revert-ret-confirm', 'click', () => { hideModal('revert-ret-modal'); setStatus('pending', 'Return set back to pending'); });
    wireReject('return', (rid, reason) => api(`/api/return-requests/${rid}/status`, { method: 'PATCH', body: { status: 'rejected', reason } }), () => viewReturn(id));
  }

  // ── Blasts ─────────────────────────────────────────────────────────────────
  const BLAST_API = { email: '/api/blasts', sms: '/api/sms-blasts' };

  async function viewBlastList(kind) {
    const isSms = kind === 'sms';
    const page = Math.max(1, parseInt(qs().get('page'), 10) || 1);
    const [list, optouts] = await Promise.all([
      api(`${BLAST_API[kind]}?limit=20&page=${page}`),
      isSms ? api('/api/sms-optouts') : Promise.resolve(null),
    ]);
    const meta = list.metadata;
    const rows = list.data.map((b) => {
      const sent = Number(b.sent), failed = Number(b.failed), skipped = Number(b.skipped);
      return `<s-table-row clickDelegate="blast-link-${b.id}">
        <s-table-cell><s-link id="blast-link-${b.id}" href="${BASE}/blasts/${kind}/${b.id}">${esc(isSms ? b.title : b.subject)}</s-link></s-table-cell>
        <s-table-cell>${esc(b.created_by || 'admin')}</s-table-cell>
        <s-table-cell>${esc(fmtDate(b.created_at))}</s-table-cell>
        <s-table-cell>${badge(b.status)}</s-table-cell>
        <s-table-cell><s-stack gap="none"><s-text>${num(sent)} / ${num(b.total)} sent</s-text>
          <s-text color="subdued">${num(failed)} failed · ${num(skipped)} skipped</s-text></s-stack></s-table-cell>
      </s-table-row>`;
    }).join('');

    const history = list.data.length
      ? `<s-section padding="none"><s-table id="blast-table" paginate ${meta.current_page < meta.total_pages ? 'hasNextPage' : ''} ${meta.current_page > 1 ? 'hasPreviousPage' : ''}>
          <s-table-header-row>
            <s-table-header listSlot="primary">${isSms ? 'Title' : 'Subject'}</s-table-header>
            <s-table-header>Started by</s-table-header><s-table-header>Started</s-table-header>
            <s-table-header listSlot="inline">Status</s-table-header><s-table-header>Progress</s-table-header>
          </s-table-header-row><s-table-body>${rows}</s-table-body></s-table></s-section>`
      : emptyState(isSms ? 'No SMS blasts yet' : 'No email blasts yet',
          isSms ? 'Text approved customers about promos and stock.' : 'Send one email to many customers at once.',
          `<s-button variant="primary" href="${BASE}/blasts/${kind}/new">Create ${isSms ? 'SMS' : 'email'} blast</s-button>`);

    const optoutSection = isSms ? `<s-section heading="Opt-out list">
        <s-stack gap="base">
          <s-text color="subdued">These numbers never get blasts. Shipping texts still go out.</s-text>
          ${optouts.data.length ? `<s-table variant="list"><s-table-header-row>
              <s-table-header listSlot="primary">Number</s-table-header><s-table-header>Note</s-table-header>
              <s-table-header>Added</s-table-header><s-table-header><span style="position:absolute;left:-9999px">Remove</span></s-table-header>
            </s-table-header-row><s-table-body>${optouts.data.map((o) => `<s-table-row>
              <s-table-cell>${esc(fmtPhone(o.phone))}</s-table-cell><s-table-cell>${esc(o.note || '—')}</s-table-cell>
              <s-table-cell>${esc(fmtDate(o.created_at))}</s-table-cell>
              <s-table-cell><s-button variant="tertiary" tone="critical" data-remove-optout="${esc(o.phone)}">Remove</s-button></s-table-cell>
            </s-table-row>`).join('')}</s-table-body></s-table>`
            : '<s-text color="subdued">No opted-out numbers.</s-text>'}
        </s-stack></s-section>` : '';

    $app.innerHTML = `<s-page heading="Blasts">
      <s-button slot="primary-action" variant="primary" href="${BASE}/blasts/${kind}/new">Create ${isSms ? 'SMS' : 'email'} blast</s-button>
      ${isSms ? '<s-button slot="secondary-actions" commandFor="optout-modal" command="--show">Add opt-outs</s-button>' : ''}
      <s-stack gap="base">
      ${pageTitle('Blasts')}
      <s-stack direction="inline" gap="small-200">
        <s-button href="${BASE}/blasts/email" variant="${isSms ? 'secondary' : 'primary'}">Email</s-button>
        <s-button href="${BASE}/blasts/sms" variant="${isSms ? 'primary' : 'secondary'}">SMS</s-button>
      </s-stack>
      ${history}
      ${optoutSection}
    </s-stack></s-page>
    ${isSms ? `<s-modal id="optout-modal" heading="Add opt-outs">
      <s-stack gap="base">
        <s-text-area id="optout-phones" label="Phone numbers" rows="4" details="One per line. Add several at once."></s-text-area>
        <s-text-field id="optout-note" label="Note (optional)" maxLength="255"></s-text-field>
      </s-stack>
      <s-button slot="primary-action" variant="primary" id="optout-add">Add numbers</s-button>
      <s-button slot="secondary-actions" commandFor="optout-modal" command="--hide">Cancel</s-button>
    </s-modal>
    <s-modal id="optout-remove-modal" heading="Remove from opt-out list?">
      <s-paragraph id="optout-remove-text"></s-paragraph>
      <s-button slot="primary-action" variant="primary" tone="critical" id="optout-remove-confirm">Remove</s-button>
      <s-button slot="secondary-actions" commandFor="optout-remove-modal" command="--hide">Cancel</s-button>
    </s-modal>` : ''}`;

    wirePaging('blast-table', `/blasts/${kind}`, {}, meta);
    if (list.data.some((b) => b.status === 'sending')) setTimeout(() => { if (location.pathname.endsWith(`/blasts/${kind}`)) viewBlastList(kind); }, 4000);
    if (!isSms) return;

    on('optout-phones', 'input', () => {
      const n = byId('optout-phones').value.split(/[\n,;]+/).filter((x) => x.trim()).length;
      byId('optout-add').textContent = n ? `Add ${plural(n, 'number')}` : 'Add numbers';
    });
    on('optout-add', 'click', async (e) => {
      const f = byId('optout-phones'); f.error = '';
      const btn = e.currentTarget; btn.loading = true;
      try {
        const r = await api('/api/sms-optouts', { method: 'POST', body: { phones: f.value, note: byId('optout-note').value } });
        hideModal('optout-modal');
        toast(`Added ${plural(r.added, 'number')}${r.invalid.length ? ` · skipped ${r.invalid.length} invalid` : ''}`);
        viewBlastList('sms');
      } catch (err) { f.error = err.message; }
      finally { btn.loading = false; }
    });
    let removePhone = null;
    onAll('[data-remove-optout]', 'click', (e) => {
      removePhone = e.currentTarget.dataset.removeOptout;
      byId('optout-remove-text').textContent = `${fmtPhone(removePhone)} will get SMS blasts again.`;
      showModal('optout-remove-modal');
    });
    on('optout-remove-confirm', 'click', async () => {
      hideModal('optout-remove-modal');
      try { await api(`/api/sms-optouts/${encodeURIComponent(removePhone)}`, { method: 'DELETE' }); toast('Removed from opt-out list'); viewBlastList('sms'); }
      catch (err) { toast(`Couldn’t remove: ${err.message}`, true); }
    });
  }

  // SMS text rules, mirrored from the server: ASCII only, 160 chars = 1 credit,
  // then 153 per part, up to 3 parts (459 chars).
  const smsClean = (raw) => String(raw || '').replace(/\r?\n/g, ' ').normalize('NFKD')
    .replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E]/g, '').trim();
  function smsSegments(text) {
    const len = [...text].reduce((n, ch) => n + ('^{}\\[]~|'.includes(ch) ? 2 : 1), 0);
    return { len, parts: len <= 160 ? 1 : Math.ceil(len / 153) };
  }

  async function viewBlastCreate(kind) {
    const isSms = kind === 'sms';
    const [smsStatus, acct] = isSms
      ? await Promise.all([api('/api/sms/settings').catch(() => null), api('/api/sms/account').catch(() => null)])
      : [null, null];
    let confirmedTotal = null;

    const sources = `
      <s-choice-list id="aud-applications" label="Applications" multiple>
        <s-choice value="approved">Approved</s-choice><s-choice value="pending">Pending</s-choice><s-choice value="rejected">Rejected</s-choice>
      </s-choice-list>
      <s-choice-list id="aud-contact" label="Messages" multiple>
        <s-choice value="pending">Pending</s-choice><s-choice value="resolved">Resolved</s-choice>
      </s-choice-list>
      <s-choice-list id="aud-returns" label="Returns" multiple>
        <s-choice value="approved">Approved</s-choice><s-choice value="pending">Pending</s-choice><s-choice value="rejected">Rejected</s-choice>
      </s-choice-list>`;

    const senderBanner = isSms ? (smsStatus?.senderName
      ? `<s-banner tone="info">Only text people who agreed to hear from Mediko. Texts come from <s-text type="strong">${esc(smsStatus.senderName)}</s-text>.</s-banner>`
      : `<s-banner tone="warning" heading="No sender name approved yet">Only text people who agreed to hear from Mediko. Texts will come from Semaphore’s default sender. <s-link href="${BASE}/settings">Add one in Settings</s-link>.</s-banner>`) : '';

    $app.innerHTML = `<s-page heading="Create ${isSms ? 'SMS' : 'email'} blast">
      <s-link slot="breadcrumb-actions" href="${BASE}/blasts/${kind}">Blasts</s-link>
      <s-button slot="primary-action" variant="primary" id="send-blast">Send blast</s-button>
      <s-stack gap="base">
      ${pageTitle(`Create ${isSms ? 'SMS' : 'email'} blast`)}
      ${senderBanner}
      <s-section heading="Audience">
        <s-stack gap="base">
          <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(10rem, 1fr))">${sources}</s-grid>
          <s-text-area id="aud-extra" label="Extra ${isSms ? 'phone numbers' : 'email addresses'}" rows="3" details="One per line, or separated by commas."></s-text-area>
          <s-text id="aud-error" tone="critical"></s-text>
          <s-stack direction="inline" gap="base" alignItems="center"><s-button id="count-btn">Count recipients</s-button></s-stack>
          <div id="aud-result"></div>
        </s-stack>
      </s-section>
      <s-section heading="Message">
        <s-stack gap="base">
          ${isSms
            ? `<s-text-field id="b-title" label="Title" details="Only you see this. It isn’t sent." maxLength="120"></s-text-field>
               <s-text-area id="b-body" label="Message" rows="4" maxLength="459" placeholder="Mediko: Hi {{name}}! …"></s-text-area>
               <s-stack direction="inline" gap="small" alignItems="center" id="sms-counter"></s-stack>
               <s-text color="subdued">1 credit per 160 characters, up to 3. Type {{name}} for each person’s first name. Accents and emoji are removed before sending.</s-text>`
            : `<s-text-field id="b-title" label="Subject" maxLength="200"></s-text-field>
               <s-text-area id="b-body" label="Body" rows="10" details="Plain text. Type {{name}} to add each person’s name. A signature and unsubscribe link are added automatically."></s-text-area>`}
        </s-stack>
      </s-section>
      <s-section heading="Send a test">
        <s-grid gap="base" gridTemplateColumns="1fr auto" alignItems="end">
          ${isSms ? '<s-text-field id="test-to" label="Phone number" placeholder="0917 123 4567"></s-text-field>' : '<s-email-field id="test-to" label="Email"></s-email-field>'}
          <s-button id="test-btn">Send test</s-button>
        </s-grid>
      </s-section>
    </s-stack></s-page>
    <s-modal id="send-modal" heading="Send this blast?">
      <s-stack gap="small"><s-paragraph id="send-text"></s-paragraph><s-text color="subdued">This can’t be undone.</s-text></s-stack>
      <s-button slot="primary-action" variant="primary" id="send-confirm">Send blast</s-button>
      <s-button slot="secondary-actions" commandFor="send-modal" command="--hide">Cancel</s-button>
    </s-modal>`;

    const audience = () => ({
      applications: byId('aud-applications').values || [],
      contact: byId('aud-contact').values || [],
      returns: byId('aud-returns').values || [],
      extra: byId('aud-extra').value,
    });
    const content = () => isSms
      ? { title: byId('b-title').value.trim(), body: byId('b-body').value.trim() }
      : { subject: byId('b-title').value.trim(), body: byId('b-body').value.trim() };
    const credits = () => smsSegments(smsClean(byId('b-body').value).replace(/\{\{\s*name\s*\}\}/gi, 'Xxxxxxxxxx'));

    const updateCounter = () => {
      if (!isSms) return;
      const { len, parts } = credits();
      byId('sms-counter').innerHTML = `<s-text>${num(len)} characters</s-text>
        <s-badge tone="${parts > 1 ? 'warning' : 'info'}">${plural(parts, 'credit')} each</s-badge>
        ${confirmedTotal != null ? `<s-text color="subdued">≈ ${num(parts * confirmedTotal)} credits for ${plural(confirmedTotal, 'recipient')}</s-text>` : ''}
        ${parts > 1 ? '<s-text tone="warning">Over 160 characters costs more than 1 credit per person.</s-text>' : ''}`;
    };
    updateCounter();
    on('b-body', 'input', updateCounter);

    const markDirty = () => { confirmedTotal = null; byId('aud-result').innerHTML = ''; updateCounter(); };
    ['aud-applications', 'aud-contact', 'aud-returns'].forEach((id) => on(id, 'change', markDirty));
    on('aud-extra', 'input', markDirty);

    const count = async () => {
      const btn = byId('count-btn'); btn.loading = true;
      try {
        const r = await api(`${BLAST_API[kind]}/preview`, { method: 'POST', body: { audience: audience() } });
        confirmedTotal = r.total;
        const excluded = [];
        const out = isSms ? r.optedOut : r.unsubscribed;
        if (out) excluded.push(`${num(out)} ${isSms ? 'opted out' : 'unsubscribed'}`);
        if (r.invalid.length) excluded.push(`${num(r.invalid.length)} invalid ${isSms ? 'numbers' : 'emails'}`);
        byId('aud-result').innerHTML = `<s-banner tone="${r.total > r.max ? 'critical' : 'info'}" heading="${plural(r.total, 'recipient')}">
          ${excluded.length ? `${esc(excluded.reduce((a, b) => a + ', ' + b))} excluded. ` : ''}
          ${r.total > r.max ? `Over the ${num(r.max)} limit — narrow the audience. ` : ''}
          ${r.sample.length ? `${esc(r.sample.map((x) => x.full_name || (isSms ? fmtPhone(x.phone) : x.email)).join(', '))}${r.total > r.sample.length ? '…' : ''}` : ''}
        </s-banner>`;
        updateCounter();
        return r.total;
      } catch (err) { toast(`Couldn’t count: ${err.message}`, true); return null; }
      finally { btn.loading = false; }
    };
    on('count-btn', 'click', count);

    on('test-btn', 'click', async (e) => {
      const to = byId('test-to'); to.error = '';
      const c = content();
      if (!c.body || !(isSms ? c.title : c.subject)) { toast(`Write a ${isSms ? 'title' : 'subject'} and message first.`, true); return; }
      const btn = e.currentTarget; btn.loading = true;
      try {
        await api(`${BLAST_API[kind]}/test`, { method: 'POST', body: { ...c, to: to.value } });
        toast(`Test sent to ${isSms ? fmtPhone(to.value) : to.value}`);
      } catch (err) { if (err.status === 400) to.error = err.message; else toast(`Couldn’t send: ${err.message}`, true); }
      finally { btn.loading = false; }
    });

    on('send-blast', 'click', async () => {
      const c = content(); let bad = false;
      const t = byId('b-title'), b = byId('b-body'), ae = byId('aud-error');
      t.error = ''; b.error = ''; ae.textContent = '';
      if (!(isSms ? c.title : c.subject)) { t.error = `Enter a ${isSms ? 'title' : 'subject'}.`; bad = true; }
      if (!c.body) { b.error = 'Write a message.'; bad = true; }
      const a = audience();
      if (!a.applications.length && !a.contact.length && !a.returns.length && !a.extra.trim()) {
        ae.textContent = `Choose at least one group or add ${isSms ? 'a number' : 'an email'}.`; bad = true;
      }
      if (bad) return;
      const total = confirmedTotal ?? await count();
      if (total == null) return;
      if (!total) { ae.textContent = 'The selected audience has no recipients.'; return; }
      const name = isSms ? c.title : c.subject;
      if (isSms) {
        const { parts } = credits();
        byId('send-text').textContent = `Send “${name}” to ${plural(total, 'person', 'people')}? ≈ ${num(parts * total)} credits (${plural(parts, 'credit')} each).${acct?.creditBalance != null ? ` You have ${num(acct.creditBalance)} credits.` : ''}`;
      } else {
        byId('send-text').textContent = `Send “${name}” to ${plural(total, 'recipient')}?`;
      }
      showModal('send-modal');
    });

    on('send-confirm', 'click', async (e) => {
      const btn = e.currentTarget; btn.loading = true;
      try {
        const r = await api(BLAST_API[kind], { method: 'POST', body: { ...content(), audience: audience(), expected_total: confirmedTotal } });
        hideModal('send-modal');
        toast(`Blast started — sending to ${plural(r.total, 'recipient')}`);
        go(`/blasts/${kind}/${r.id}`);
      } catch (err) {
        hideModal('send-modal');
        toast(err.message, true);
        if (/Audience changed/.test(err.message)) markDirty();
      } finally { btn.loading = false; }
    });
  }

  function describeAudience(raw, isSms) {
    let a; try { a = JSON.parse(raw || '{}'); } catch { return '—'; }
    const labels = { applications: 'Applications', contact: 'Messages', returns: 'Returns' };
    const parts = Object.entries(labels).filter(([k]) => a[k]?.length).map(([k, l]) => `${l}: ${a[k].join(', ')}`);
    if (a.extra?.length) parts.push(plural(a.extra.length, isSms ? 'extra number' : 'extra email'));
    return parts.join(' · ') || '—';
  }

  async function viewBlastDetail(kind, id) {
    const isSms = kind === 'sms';
    const b = await api(`${BLAST_API[kind]}/${id}`);
    const title = isSms ? b.title : b.subject;
    const canCancel = b.status === 'sending' || b.status === 'interrupted';
    const stat = (label, value) => `<s-stack gap="none"><s-text color="subdued">${esc(label)}</s-text><s-heading>${num(value)}</s-heading></s-stack>`;

    $app.innerHTML = `<s-page heading="${esc(title)}">
      <s-link slot="breadcrumb-actions" href="${BASE}/blasts/${kind}">Blasts</s-link>
      ${badge(b.status, 'accessory')}
      ${b.status === 'interrupted' ? '<s-button slot="primary-action" variant="primary" id="resume-btn">Resume</s-button>' : ''}
      ${canCancel ? '<s-button slot="secondary-actions" commandFor="cancel-modal" command="--show">Cancel blast</s-button>' : ''}
      <s-stack gap="base">
      ${pageTitle(esc(title), badge(b.status))}
      ${b.status === 'interrupted' ? `<s-banner tone="warning">Sending stopped at ${num(b.sent + b.failed + b.skipped)} of ${num(b.total)}. Resume to send to the remaining ${plural(b.queued, 'person', 'people')}.</s-banner>` : ''}
      <s-section heading="Results">
        <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(8rem, 1fr))">
          ${stat('Sent', b.sent)}${stat('Failed', b.failed)}${stat('Skipped', b.skipped)}${stat('Queued', b.queued)}
        </s-grid>
      </s-section>
      <s-section heading="Audience">
        <s-stack gap="small-200">
          <s-text>${esc(describeAudience(b.audience, isSms))}</s-text>
          <s-text color="subdued">Started by ${esc(b.created_by || 'admin')}, ${esc(fmtDate(b.created_at))}${b.finished_at ? ` · finished ${esc(fmtDate(b.finished_at))}` : ''}</s-text>
        </s-stack>
      </s-section>
      <s-section heading="Message">
        ${isSms ? '' : `<s-text type="strong">${esc(b.subject)}</s-text>`}
        <s-box padding="base" background="subdued" borderRadius="base"><span class="prewrap">${esc(b.body)}</span></s-box>
      </s-section>
      ${b.failures.length ? `<s-section heading="Failed and skipped" padding="none"><s-table>
        <s-table-header-row><s-table-header listSlot="primary">Recipient</s-table-header><s-table-header listSlot="inline">Status</s-table-header><s-table-header>Reason</s-table-header></s-table-header-row>
        <s-table-body>${b.failures.map((f) => `<s-table-row>
          <s-table-cell>${esc(isSms ? fmtPhone(f.phone) : f.email)}${f.full_name ? ` <s-text color="subdued">${esc(f.full_name)}</s-text>` : ''}</s-table-cell>
          <s-table-cell>${badge(f.status)}</s-table-cell><s-table-cell>${esc(f.error || '')}</s-table-cell>
        </s-table-row>`).join('')}</s-table-body></s-table></s-section>` : ''}
    </s-stack></s-page>
    <s-modal id="cancel-modal" heading="Cancel this blast?">
      <s-paragraph>${plural(b.sent, isSms ? 'text' : 'email')} already went out. The remaining ${num(b.queued)} won’t be sent.</s-paragraph>
      <s-button slot="primary-action" variant="primary" tone="critical" id="cancel-confirm">Cancel blast</s-button>
      <s-button slot="secondary-actions" commandFor="cancel-modal" command="--hide">Keep sending</s-button>
    </s-modal>`;

    on('resume-btn', 'click', async (e) => {
      e.currentTarget.loading = true;
      try { await api(`${BLAST_API[kind]}/${id}/resume`, { method: 'POST' }); toast('Blast resumed'); setTimeout(() => viewBlastDetail(kind, id), 800); }
      catch (err) { toast(`Couldn’t resume: ${err.message}`, true); e.currentTarget.loading = false; }
    });
    on('cancel-confirm', 'click', async () => {
      hideModal('cancel-modal');
      try { await api(`${BLAST_API[kind]}/${id}/cancel`, { method: 'POST' }); toast('Blast cancelled'); setTimeout(() => viewBlastDetail(kind, id), 800); }
      catch (err) { toast(`Couldn’t cancel: ${err.message}`, true); }
    });
    if (b.status === 'sending') setTimeout(() => { if (location.pathname.endsWith(`/blasts/${kind}/${id}`)) viewBlastDetail(kind, id); }, 4000);
  }

  // ── Shipping SMS ───────────────────────────────────────────────────────────
  async function viewShippingSms() {
    const q = qs();
    const state = { status: q.get('status') || 'all', search: q.get('search') || '' };
    const page = Math.max(1, parseInt(q.get('page'), 10) || 1);
    const params = new URLSearchParams({ page, limit: 20 });
    if (state.status !== 'all') params.set('status', state.status);
    if (state.search) params.set('search', state.search);
    const [s, log, acct] = await Promise.all([
      api('/api/sms/settings'),
      api(`/api/sms/notifications?${params}`),
      api('/api/sms/account').catch((e) => ({ error: e.message })),
    ]);
    const meta = log.metadata; const c = log.counts || {};
    const allCount = Object.values(c).reduce((a, b) => a + Number(b), 0);

    const [stLabel, stTone, stNote] = !s.apiKeySet ? ['Needs API key', 'warning', 'The Semaphore API key isn’t set. Ask your developer to add it on the server.']
      : s.enabled ? ['Active', 'success', 'Texts send when an order is fulfilled']
      : ['Off', 'neutral', 'Shipping texts are turned off.'];
    const cell = (label, inner) => `<s-stack gap="small-200"><s-text color="subdued">${esc(label)}</s-text>${inner}</s-stack>`;

    const rows = log.data.map((n) => `<s-table-row>
      <s-table-cell><s-stack gap="none"><s-text type="strong">${esc(n.order_name || '—')}</s-text>
        <s-text color="subdued">${esc([n.tracking_company, n.tracking_number].filter(Boolean).join(' · '))}</s-text></s-stack></s-table-cell>
      <s-table-cell>${esc(fmtPhone(n.phone))}</s-table-cell>
      <s-table-cell>${badge(n.status)}</s-table-cell>
      <s-table-cell><span class="clamp">${esc(n.status === 'sent' ? n.message : n.status === 'queued' ? 'Waiting to send' : (n.error || ''))}</span></s-table-cell>
      <s-table-cell>${num(n.attempts)}</s-table-cell>
      <s-table-cell>${esc(fmtDate(n.sent_at || n.created_at))}</s-table-cell>
      <s-table-cell>${n.status === 'failed' || n.status === 'skipped' ? `
        <s-button icon="menu-horizontal" variant="tertiary" commandFor="sms-menu-${n.id}" accessibilityLabel="Actions for ${esc(n.order_name)}"></s-button>
        <s-menu id="sms-menu-${n.id}" accessibilityLabel="Actions for ${esc(n.order_name)}">
          ${n.status === 'failed' ? `<s-button data-retry="${n.id}">Retry</s-button>` : ''}
          <s-button data-sendto="${n.id}" data-order="${esc(n.order_name)}">Send to number…</s-button>
        </s-menu>` : ''}</s-table-cell>
    </s-table-row>`).join('');

    const filtered = state.search || state.status !== 'all';
    $app.innerHTML = `<s-page heading="Shipping SMS">
      <s-button slot="secondary-actions" commandFor="test-sms-modal" command="--show">Send test SMS</s-button>
      <s-button slot="secondary-actions" id="refresh-credits">Refresh credits</s-button>
      <s-stack gap="base">
      ${pageTitle('Shipping SMS')}
      ${!s.webhookSecretSet ? '<s-banner tone="critical" heading="Webhook secret missing">Shopify can’t confirm fulfilment events. Add the webhook secret on the server.</s-banner>' : ''}
      <s-section>
        <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(10rem, 1fr))">
          ${cell('Status', `<s-badge tone="${stTone}">${stLabel}</s-badge><s-text color="subdued">${esc(stNote)}</s-text>`)}
          ${cell('Sender name', `<s-text type="strong">${esc(s.senderName || 'Semaphore default')}</s-text><s-link href="${BASE}/settings">Change in Settings</s-link>`)}
          ${cell('API key', `<s-badge tone="${s.apiKeySet ? 'success' : 'warning'}">${s.apiKeySet ? 'Set' : 'Missing'}</s-badge><s-text color="subdued">Set on the server</s-text>`)}
          ${cell('Credits', acct.error ? `<s-text color="subdued">${esc(acct.error)}</s-text>` : `<s-heading>${num(acct.creditBalance)}</s-heading>`)}
          ${cell('Webhook', `<s-badge tone="${s.webhookSecretSet ? 'success' : 'critical'}">${s.webhookSecretSet ? 'Connected' : 'Secret missing'}</s-badge>`)}
        </s-grid>
        <s-grid gap="base" gridTemplateColumns="1fr auto" alignItems="end">
          <s-text-field label="Webhook URL" value="${esc(s.webhookUrl)}" readOnly></s-text-field>
          <s-button id="copy-webhook">Copy</s-button>
        </s-grid>
      </s-section>
      ${statusTabs('/shipping-sms', state, state.status, [['all', 'All', allCount], ['sent', 'Sent', c.sent || 0], ['failed', 'Failed', c.failed || 0], ['skipped', 'Skipped', c.skipped || 0], ['queued', 'Queued', c.queued || 0]])}
      ${log.data.length
        ? `<s-section padding="none"><s-table id="sms-table" paginate ${meta.current_page < meta.total_pages ? 'hasNextPage' : ''} ${meta.current_page > 1 ? 'hasPreviousPage' : ''}>
            <s-search-field slot="filters" id="f-search" label="Search" labelAccessibilityVisibility="exclusive" placeholder="Order, phone or tracking number" value="${esc(state.search)}"></s-search-field>
            <s-table-header-row>
              <s-table-header listSlot="primary">Order</s-table-header><s-table-header>Phone</s-table-header>
              <s-table-header listSlot="inline">Status</s-table-header><s-table-header>Message or error</s-table-header>
              <s-table-header format="numeric">Attempts</s-table-header><s-table-header>Date</s-table-header>
              <s-table-header><span style="position:absolute;left:-9999px">Actions</span></s-table-header>
            </s-table-header-row><s-table-body>${rows}</s-table-body></s-table></s-section>`
        : filtered
          ? `<s-section><s-search-field id="f-search" label="Search" labelAccessibilityVisibility="exclusive" placeholder="Order, phone or tracking number" value="${esc(state.search)}"></s-search-field></s-section>
             ${emptyState('No shipping texts match', 'Try a different status or search.', `<s-button href="${BASE}/shipping-sms">Clear filters</s-button>`)}`
          : emptyState('No shipping texts yet', 'Texts appear here when orders are marked fulfilled.', '<s-button commandFor="test-sms-modal" command="--show">Send test SMS</s-button>')}
    </s-stack></s-page>
    ${testSmsModal()}
    <s-modal id="sendto-modal" heading="Send to number">
      <s-stack gap="base">
        <s-paragraph id="sendto-text"></s-paragraph>
        <s-text-field id="sendto-phone" label="Phone number" placeholder="0917 123 4567"></s-text-field>
      </s-stack>
      <s-button slot="primary-action" variant="primary" id="sendto-confirm">Send</s-button>
      <s-button slot="secondary-actions" commandFor="sendto-modal" command="--hide">Cancel</s-button>
    </s-modal>`;

    on('f-search', 'change', (e) => go(withQuery('/shipping-sms', { ...state, search: e.currentTarget.value.trim() })));
    wirePaging('sms-table', '/shipping-sms', state, meta);
    wireTestSms(() => viewShippingSms());
    on('refresh-credits', 'click', () => viewShippingSms());
    on('copy-webhook', 'click', async () => {
      try { await navigator.clipboard.writeText(s.webhookUrl); toast('Webhook URL copied'); }
      catch { toast('Couldn’t copy. Select the URL and copy it.', true); }
    });
    onAll('[data-retry]', 'click', async (e) => {
      loading(true);
      try { await api(`/api/sms/notifications/${e.currentTarget.dataset.retry}/retry`, { method: 'POST', body: {} }); toast('Text sent'); viewShippingSms(); }
      catch (err) { toast(`Couldn’t send: ${err.message}`, true); viewShippingSms(); }
      finally { loading(false); }
    });
    let sendToId = null;
    onAll('[data-sendto]', 'click', (e) => {
      sendToId = e.currentTarget.dataset.sendto;
      byId('sendto-text').textContent = `Where should the shipping text for order ${e.currentTarget.dataset.order} go?`;
      const f = byId('sendto-phone'); f.value = ''; f.error = '';
      showModal('sendto-modal');
    });
    on('sendto-confirm', 'click', async (e) => {
      const f = byId('sendto-phone'); f.error = '';
      const btn = e.currentTarget; btn.loading = true;
      try {
        await api(`/api/sms/notifications/${sendToId}/retry`, { method: 'POST', body: { phone: f.value } });
        hideModal('sendto-modal'); toast(`Text sent to ${fmtPhone(f.value)}`); viewShippingSms();
      } catch (err) { if (err.status === 400) f.error = err.message; else { hideModal('sendto-modal'); toast(`Couldn’t send: ${err.message}`, true); viewShippingSms(); } }
      finally { btn.loading = false; }
    });
  }

  // ── Settings ───────────────────────────────────────────────────────────────
  const SETTING_GROUPS = {
    Discounts: 'The SC/PWD discount given when you approve an application.',
    Notifications: 'Who gets an email when a new application, message or return comes in.',
    'Email blasts': 'Slows sending so emails don’t get flagged as spam.',
    SMS: 'Shipping texts and SMS blasts, sent through Semaphore.',
  };

  async function viewSettings() {
    const { settings, secrets } = await api('/api/settings');
    const initial = Object.fromEntries(settings.map((s) => [s.key, s.value]));
    const source = (s) => s.source === 'saved' ? '' : ` (${s.source === 'env' ? 'from server config' : 'default'})`;

    const field = (s) => {
      const id = `set-${s.key}`;
      const details = esc((s.help || '') + source(s));
      switch (s.type) {
        case 'boolean':
          return `<s-switch id="${id}" name="${s.key}" label="${esc(s.label)}" details="${details}" ${s.value ? 'checked' : ''}></s-switch>`;
        case 'number':
          return `<s-number-field id="${id}" name="${s.key}" label="${esc(s.label)}" details="${details}" min="${s.min}" max="${s.max}" value="${esc(s.value)}" ${/_ms$/.test(s.key) ? 'suffix="ms"' : ''}></s-number-field>`;
        case 'email':
          return `<s-email-field id="${id}" name="${s.key}" label="${esc(s.label)}" details="${details}" value="${esc(s.value)}"></s-email-field>`;
        case 'sender_name':
          return `<s-text-field id="${id}" name="${s.key}" label="${esc(s.label)}" details="${details}" maxLength="11" value="${esc(s.value)}"></s-text-field>`;
        default:
          return `<s-text-field id="${id}" name="${s.key}" label="${esc(s.label)}" details="${details}" value="${esc(s.value)}"></s-text-field>`;
      }
    };

    const groups = Object.keys(SETTING_GROUPS).map((g) => `
      <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(16rem, 1fr))">
        <s-box padding="small-200"><s-stack gap="small-200"><s-heading>${esc(g)}</s-heading><s-paragraph color="subdued">${esc(SETTING_GROUPS[g])}</s-paragraph></s-stack></s-box>
        <s-section><s-stack gap="base">${settings.filter((s) => s.group === g).map(field).join('')}</s-stack></s-section>
      </s-grid>`).join('');

    $app.innerHTML = `<form id="settings-form" data-save-bar data-discard-confirmation>
      <s-page heading="Settings">
        <s-stack gap="large">
          ${pageTitle('Settings')}
          ${groups}
          <s-grid gap="base" gridTemplateColumns="repeat(auto-fit, minmax(16rem, 1fr))">
            <s-box padding="small-200"><s-stack gap="small-200"><s-heading>Server secrets</s-heading>
              <s-paragraph color="subdued">Read-only. These are changed on the server by your developer, not here.</s-paragraph></s-stack></s-box>
            <s-section><s-stack gap="small">${secrets.map((x) => `<s-stack direction="inline" gap="small" alignItems="center" justifyContent="space-between">
              <s-stack gap="none"><s-text>${esc(x.label)}</s-text><s-text color="subdued"><span class="mono">${esc(x.name)}</span></s-text></s-stack>
              <s-badge tone="${x.set ? 'success' : 'neutral'}">${x.set ? 'Set' : 'Not set'}</s-badge></s-stack>`).join('')}</s-stack></s-section>
          </s-grid>
        </s-stack>
      </s-page>
    </form>`;

    const form = byId('settings-form');
    const readValue = (s) => {
      const el = byId(`set-${s.key}`);
      if (s.type === 'boolean') return Boolean(el.checked);
      if (s.type === 'number') return Number(el.value);
      return String(el.value || '').trim();
    };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const values = {};
      settings.forEach((s) => { const v = readValue(s); if (v !== initial[s.key]) values[s.key] = v; byId(`set-${s.key}`).error = ''; });
      if (!Object.keys(values).length) { viewSettings(); return; }
      loading(true);
      try {
        await api('/api/settings', { method: 'PUT', body: { values } });
        toast('Settings saved');
        viewSettings();
      } catch (err) {
        // The server names fields by label: "<Label> <problem>; …"
        let matched = false;
        err.message.split('; ').forEach((part) => {
          const s = settings.find((x) => part.startsWith(x.label + ' '));
          if (s) { byId(`set-${s.key}`).error = cap(part.slice(s.label.length + 1)) + '.'; matched = true; }
        });
        toast(matched ? 'Couldn’t save: check the highlighted fields' : `Couldn’t save: ${err.message}`, true);
      } finally { loading(false); }
    });
    form.addEventListener('reset', () => setTimeout(viewSettings, 0));
  }

  route();
  </script>
</body>
</html>
