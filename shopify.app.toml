# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ee63d07f77aeb73c3ade6dd713eb40f7"
application_url = "https://mediko-gateway.quailshack.com/admin-dashboard/"
embedded = true
name = "MedikoPH Gateway"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_customers,read_orders,write_orders,read_fulfillments,read_products,write_app_proxy"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "http://localhost" ]

# Storefront /apps/mediko/* → this server's /proxy/* (signed by Shopify).
# Used by the chat widget's "Track my order" to list a logged-in customer's orders.
[app_proxy]
url = "https://mediko-gateway.quailshack.com/proxy"
prefix = "apps"
subpath = "mediko"

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = [ "fulfillments/create" ]
uri = "https://mediko-gateway.quailshack.com/webhooks/shopify/fulfillments-create"
